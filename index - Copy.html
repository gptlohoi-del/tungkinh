<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tụng Kinh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <style>
        :root {
            --accent-color: #4f46e5; 
            --pre-bg: #f8fafc;
            --border-color: #e2e8f0;
            --body-text: #1a202c;
            --pre-font-size: 1.2rem; 
        }

        #pdf-content {
            font-family: "Times New Roman", Times, serif !important;
            color: var(--body-text);
        }

        #pdf-content h1, #pdf-content h2, #pdf-content h3, #pdf-content h4, #pdf-content h5 {
            color: #4f46e5 !important;
            font-weight: bold !important;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
            display: block;
        }

        #pdf-content h1 { 
            font-size: 2.2rem !important; 
            text-align: center; 
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 15px;
            text-transform: uppercase;
        }

        #pdf-content h2 { 
            font-size: 2rem !important; 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        
        #pdf-content h3 { 
            font-size: 1.5rem !important; 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        
        #pdf-content h4 { 
            font-size: 1.2rem !important; 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        #pdf-content pre {
            background-color: var(--pre-bg) !important;
            padding: 0.5rem !important;
            border-radius: 0.5rem;
            border-left: 4px solid var(--accent-color) !important;
            font-family: "Times New Roman", Times, serif !important;
            font-size: var(--pre-font-size) !important;
            line-height: 1.4 !important;
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
            margin: 1rem 0 !important;
            border: 1px solid var(--border-color);
        }

        .selection-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px; height: 20px;
            background-color: var(--accent-color);
            color: white !important;
            border-radius: 50%;
            font-size: 10px; font-weight: bold;
        }

        html { scroll-behavior: smooth; }
        .section-block { page-break-inside: avoid; }
        
        #pdf-content h2, #pdf-content h3, #pdf-content h4 {
            cursor: pointer;
            position: relative;
            padding-left: 25px !important;
        }

        #pdf-content h2::before, #pdf-content h3::before, #pdf-content h4::before {
            content: '▼';
            position: absolute;
            left: 0;
            transition: transform 0.3s;
            font-size: 0.8em;
            color: #6366f1;
        }

        #pdf-content h2.is-collapsed::before, #pdf-content h3.is-collapsed::before, #pdf-content h4.is-collapsed::before {
            transform: rotate(-90deg);
        }

        .section-hidden {
            display: none !important;
        }

        #main-checklist label, 
        #sutra-checklist label,
        #main-checklist span,
        #sutra-checklist span {
            font-weight: 700 !important;
            color: #1e293b;
        }

        #main-checklist label:hover, 
        #sutra-checklist label:hover {
            color: #4f46e5;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #818cf8; }
        
        @keyframes highlight-blink {
            0% { background-color: transparent; }
            50% { background-color: #4f46e5; transform: scale(1.02); }
            100% { background-color: transparent; }
        }
        .blink-target {
            animation: highlight-blink 0.8s ease-in-out 3;
            border: 2px solid #16a34a !important;
            border-radius: 8px;
            z-index: 10;
        }

        .mobile-only-btn { display: block; }
        @media (min-width: 768px) {
            .mobile-only-btn { display: none !important; }
        }

        /* CSS Chuẩn để in ấn nhiều trang */
        @media print {
            body, html, .flex-col, main, .flex-1, aside {
                height: auto !important;
                min-height: auto !important;
                overflow: visible !important;
                display: block !important;
            }
            .no-print, header, aside, .mobile-only-btn, footer, .fixed, #qrModal {
                display: none !important;
            }
            body { background: white !important; }
            main {
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
            }
            .max-w-3xl {
                max-width: 100% !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            .section-hidden {
                display: block !important; 
            }
            #pdf-content h2::before, #pdf-content h3::before, #pdf-content h4::before {
                display: none !important; 
            }
            #pdf-content h2, #pdf-content h3, #pdf-content h4 {
                padding-left: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">
<div class="no-print fixed top-0 left-1/2 -translate-x-1/2 z-[60] flex gap-1 bg-white/80 backdrop-blur-sm p-1 rounded-full shadow-lg border border-indigo-100">
    <button onclick="changeFontSize(-0.1)" class="w-8 h-8 flex items-center justify-center bg-white hover:bg-red-50 text-red-600 rounded-full text-sm font-bold shadow-sm transition-all active:scale-90 border border-gray-200">
        A-
    </button>
    <div id="font-size-display" class="flex items-center px-1 text-[15px] font-bold text-indigo-900 min-w-[32px] justify-center">
        1.2
    </div>
    <button onclick="changeFontSize(0.1)" class="w-8 h-8 flex items-center justify-center bg-white hover:bg-emerald-50 text-emerald-600 rounded-full text-sm font-bold shadow-sm transition-all active:scale-90 border border-gray-200">
        A+
    </button>
</div>

    <header class="no-print bg-indigo-900 text-white p-1.5 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div onclick="window.scrollTo(0,0)" class="cursor-pointer hover:bg-indigo-800 p-1.5 rounded-lg transition-all flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h4m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span class="text-[10px] font-bold uppercase tracking-tighter">HOME</span>
        </div>
        <div class="text-[10px] font-bold uppercase opacity-50 pr-2">...</div>
    </header>

    <div class="flex flex-col md:flex-row-reverse flex-1 overflow-hidden">
        <main class="flex-1 p-1 md:p-12 bg-gray-100 overflow-y-auto">
            <div class="max-w-3xl mx-auto bg-white min-h-full shadow-2xl p-1 md:p-16 rounded-sm">
                <div id="preview-placeholder" class="text-center py-20 text-gray-300">
                    <p class="text-xl font-medium">Chọn nội dung kinh để hiển thị.</p>
                </div>
                <div id="pdf-content" class="hidden"></div>
            </div>
        </main>
    
        <aside class="no-print w-full md:w-96 bg-white border-r overflow-y-auto p-4 space-y-6">
            <button onclick="confirmClear()" class="w-full mb-4 py-2.5 bg-red-500 hover:bg-red-600 text-white text-xs font-bold rounded-xl transition-all active:scale-95 uppercase tracking-tighter shadow-md flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                XOÁ LỰA CHỌN
            </button>

            <div>
                <h2 class="font-bold text-indigo-700 mb-3 border-b pb-2 text-sm uppercase" id="nghithuc-section">NGHI THỨC</h2>
                <div id="main-checklist" class="space-y-1"></div>
            </div>
            
            <div>
                <h2 class="font-bold text-indigo-700 mb-3 border-b pb-2 text-sm uppercase" id="kinhtung-section">KINH TỤNG</h2>
                <div id="sutra-checklist" class="space-y-1"></div>
            </div>
        </aside>
    </div>

    <script src="./data.js" defer></script>

    <script>
        let selectedOrder = [];

        function removeAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
        }

        function toggleSearch() {
            const wrapper = document.getElementById('searchWrapper');
            const btn = document.getElementById('searchBtn');
            const results = document.getElementById('searchResults');
            
            if (wrapper.classList.contains('hidden')) {
                wrapper.classList.remove('hidden');
                wrapper.classList.add('flex'); 
                document.getElementById('searchInput').focus();
                btn.classList.replace('bg-indigo-600', 'bg-red-500');
            } else {
                wrapper.classList.add('hidden');
                wrapper.classList.remove('flex');
                document.getElementById('searchInput').value = "";
                results.innerHTML = "";
                results.classList.add('hidden');
                btn.classList.replace('bg-red-500', 'bg-indigo-600');
            }
        }

        // Kỹ thuật Tối ưu Tìm kiếm (Index chuỗi) + Debounce chống lag
        let searchTimeout;
        function indexSearchData() {
            if (typeof fullData === 'undefined') return;
            fullData.forEach(item => {
                item._searchString = removeAccents(item.title + " " + (item.content || "") + " " + (item.content_open || ""));
            });
        }

        function searchDataDebounced() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(searchData, 300);
        }

        function searchData() {
            if (typeof fullData === 'undefined') return;
            const query = removeAccents(document.getElementById('searchInput').value.trim());
            const resultsContainer = document.getElementById('searchResults');
            
            if (query.length < 2) {
                resultsContainer.innerHTML = "";
                resultsContainer.classList.add('hidden');
                return;
            }

            const matches = fullData.filter(item => item._searchString && item._searchString.includes(query));

            if (matches.length > 0) {
                resultsContainer.classList.remove('hidden');
                resultsContainer.innerHTML = matches.map(item => `
                    <div onclick="goToItem(${item.id})" class="p-3 hover:bg-indigo-50 border-b border-gray-100 text-sm text-gray-700 cursor-pointer flex justify-between items-center">
                        <span class="truncate pr-2">${item.title}</span>
                        <span class="text-[10px] text-indigo-400 font-bold whitespace-nowrap">${item.type === 'sub' ? 'KINH' : 'NGHI THỨC'}</span>
                    </div>
                `).join('');
            } else {
                resultsContainer.innerHTML = "<div class='p-3 text-xs text-gray-400 italic'>Không tìm thấy...</div>";
                resultsContainer.classList.remove('hidden');
            }
        }

        function initChecklists() {
            const mainContainer = document.getElementById('main-checklist');
            const sutraContainer = document.getElementById('sutra-checklist');
            let mainHtml = "";
            let sutraHtml = "";

            fullData.forEach(item => {
                const rowHtml = `
                    <div id="item-${item.id}" class="transition-all duration-300">
                        <label class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg cursor-pointer border-b border-gray-50">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" id="cb-${item.id}" class="w-5 h-5 rounded text-indigo-600" onchange="toggleSection(${item.id})">
                                <span class="item-title text-sm text-gray-600">${item.title}</span>
                            </div>
                        </label>
                    </div>`;
                
                if (item.type === 'sub') sutraHtml += rowHtml;
                else mainHtml += rowHtml;
            });

            mainContainer.innerHTML = mainHtml;
            sutraContainer.innerHTML = sutraHtml;
        }

        function syncChecklistsUI() {
            fullData.forEach(item => {
                const row = document.getElementById(`item-${item.id}`);
                const checkbox = document.getElementById(`cb-${item.id}`);
                if (!row || !checkbox) return;

                const orderIndex = selectedOrder.indexOf(item.id);
                const isChecked = orderIndex !== -1;
                
                checkbox.checked = isChecked;
                const textSpan = row.querySelector('.item-title');
                let badge = row.querySelector('.selection-number');

                if (isChecked) {
                    if(textSpan) {
                        textSpan.classList.add('text-indigo-800', 'font-bold');
                        textSpan.classList.remove('text-gray-600');
                    }
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.className = 'selection-number';
                        row.querySelector('label').appendChild(badge);
                    }
                    badge.innerText = orderIndex + 1;
                } else {
                    if(textSpan) {
                        textSpan.classList.remove('text-indigo-800', 'font-bold');
                        textSpan.classList.add('text-gray-600');
                    }
                    if (badge) badge.remove();
                }
            });
        }
            
        function goToItem(id) {
            const targetElement = document.getElementById(`item-${id}`);
            if (targetElement) {
                targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetElement.classList.add('blink-target');
                setTimeout(() => {
                    targetElement.classList.remove('blink-target');
                }, 2500);
                document.getElementById('searchResults').classList.add('hidden');
            }
        }   

        function toggleSection(id) {
            // Lấy tọa độ Y hiện tại của ô checkbox vừa bấm so với đỉnh màn hình
            const container = document.getElementById(`item-${id}`);
            const beforeRectTop = container ? container.getBoundingClientRect().top : 0;

            const index = selectedOrder.indexOf(id);
            if (index > -1) selectedOrder.splice(index, 1);
            else selectedOrder.push(id);
            
            syncChecklistsUI();
            updateUI();
            updateShareableURL(); 
            saveToLocalStorage(); // Lưu nháp

            // Bù trừ cuộn màn hình để ô checkbox đứng im tại chỗ cũ
            if (container) {
                const afterRectTop = container.getBoundingClientRect().top;
                window.scrollBy(0, afterRectTop - beforeRectTop);
            }
        }

        function clearAll() {
            selectedOrder = [];
            syncChecklistsUI();
            updateUI();
            updateShareableURL(); 
            saveToLocalStorage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateUI() {
            const previewArea = document.getElementById('pdf-content');
            const placeholder = document.getElementById('preview-placeholder');

            const validSelectedItems = selectedOrder
                .map(id => fullData.find(d => d.id === id))
                .filter(item => item && (item.content || item.content_open));

            if (validSelectedItems.length === 0) {
                previewArea.classList.add('hidden');
                placeholder.classList.remove('hidden');
                return;
            }

            placeholder.classList.add('hidden');
            previewArea.classList.remove('hidden');

            const subContent = validSelectedItems
                .filter(item => item.type === 'sub')
                .map(item => item.content)
                .join('');

            const hasWrapper = validSelectedItems.some(item => item.type === 'ritual_wrapper');
            const renderBlocks = [];
            let wrapperAdded = false;

            validSelectedItems.forEach(item => {
                if (item.type === 'ritual_wrapper') {
                    if (!wrapperAdded) {
                        renderBlocks.push(item.content_open + subContent + item.content_close);
                        wrapperAdded = true;
                    } else {
                        renderBlocks.push(item.content_open + item.content_close);
                    }
                } 
                else if (item.type === 'main') {
                    renderBlocks.push(item.content);
                } 
                else if (item.type === 'sub' && !hasWrapper) {
                    renderBlocks.push(item.content);
                }
            });

            previewArea.innerHTML = renderBlocks.join('<div style="page-break-after: always; margin: 10px 0;"></div>');
        }

        function saveToLocalStorage() {
            localStorage.setItem('tungKinhSelected', JSON.stringify(selectedOrder));
        }

        function loadState() {
            const params = new URLSearchParams(window.location.search);
            const savedOrder = params.get('s'); 
            
            if (savedOrder) {
                selectedOrder = [...new Set(savedOrder.split(',')
                    .map(id => parseInt(id, 10))
                    .filter(id => !isNaN(id) && fullData.some(d => d.id === id)))];
            } else {
                // Khôi phục từ LocalStorage nếu không có URL params
                const localData = localStorage.getItem('tungKinhSelected');
                if(localData) {
                    try {
                        selectedOrder = JSON.parse(localData).filter(id => fullData.some(d => d.id === id));
                    } catch(e) {}
                }
            }
        }

        function updateShareableURL() {
            const url = new URL(window.location.href);
            if (selectedOrder.length > 0) {
                url.searchParams.set('s', selectedOrder.join(','));
            } else {
                url.searchParams.delete('s');
            }
            try {
                window.history.replaceState(null, '', url.toString());
            } catch(e) {}
            
            const pageLink = document.getElementById('page-link');
            if (pageLink) {
                pageLink.href = url.toString();
                pageLink.innerText = url.toString();
            }
        }

        let currentFontSize = 1.2; 

        function changeFontSize(delta) {
            currentFontSize = parseFloat((currentFontSize + delta).toFixed(2));
            if (currentFontSize < 0.5) currentFontSize = 0.5;
            if (currentFontSize > 3.0) currentFontSize = 3.0; 
            
            document.getElementById('font-size-display').innerText = currentFontSize;
            document.documentElement.style.setProperty('--pre-font-size', currentFontSize + 'rem');
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (typeof fullData === 'undefined') {
                    document.getElementById('preview-placeholder').innerHTML = `<p class="text-red-500 font-bold">Lỗi tải dữ liệu. Vui lòng tải lại trang!</p>`;
                    return;
                }
                indexSearchData();
                initChecklists();
                loadState();
                syncChecklistsUI();
                updateUI(); 
                updateShareableURL(); 
            } catch (error) {
                console.error("Lỗi khởi tạo:", error);
            }
        });

        document.getElementById('pdf-content').addEventListener('click', function(e) {
            const header = e.target.closest('h2, h3, h4');
            if (!header) return;

            header.classList.toggle('is-collapsed');
            let next = header.nextElementSibling;
            while (next && !['H1', 'H2', 'H3', 'H4'].includes(next.tagName)) {
                next.classList.toggle('section-hidden');
                next = next.nextElementSibling;
            }
        });

        function toggleModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.toggle('hidden');
        }

        function scrollToSection(id) {
            const element = document.getElementById(id);
            if(element) {
                element.scrollIntoView({ behavior: 'smooth' });
                toggleModal('modal-list');
            }
        }

        function confirmClear() {
            if(confirm("Bạn có chắc chắn muốn xoá tất cả lựa chọn không?")) {
                clearAll();
                toggleModal('modal-list');
            }
        }

        function fallbackCopyTextToClipboard(text) {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert("Đã copy đường dẫn: \n" + text);
            } catch (err) {
                console.error('Lỗi Fallback Copy', err);
                alert("Trình duyệt không hỗ trợ copy tự động!");
            }
            textArea.remove();
        }

        function copyToClipboard() {
            const linkToCopy = window.location.href;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(linkToCopy).then(() => {
                    alert("Đã copy đường dẫn: \n" + linkToCopy);
                }).catch(err => {
                    fallbackCopyTextToClipboard(linkToCopy);
                });
            } else {
                fallbackCopyTextToClipboard(linkToCopy);
            }
        }

        function openQRModal() {
            document.getElementById('qrModal').classList.remove('hidden');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        window.addEventListener('click', function(event) {
            const modalList = document.getElementById('modal-list');
            const wrapper = document.getElementById('searchWrapper');
            const btn = document.getElementById('searchBtn');

            if (event.target == modalList) modalList.classList.add('hidden');
            
            if (wrapper && !wrapper.classList.contains('hidden') && btn && !btn.contains(event.target) && !wrapper.contains(event.target)) {
                toggleSearch(); 
            }
        });

    </script>
    
    <!-- Float Container (Góc trên phải): Search + Print + Copy -->
    <div class="no-print fixed top-3 right-1 z-[100] flex flex-col items-end gap-3">
        <!-- Search -->
        <div class="relative flex flex-col items-end">
            <div id="searchWrapper" class="hidden absolute right-16 top-0 flex-col items-end gap-2">
                <input type="text" id="searchInput" oninput="searchDataDebounced()" placeholder="Tìm tên hoặc nội dung kinh..." 
                       class="w-72 md:w-80 p-3 bg-white text-indigo-900 rounded-2xl shadow-2xl border-2 border-indigo-600 outline-none">
                <div id="searchResults" class="w-72 md:w-80 max-h-48 overflow-y-auto bg-white rounded-xl shadow-2xl border border-gray-200 hidden"></div>
            </div>
            
            <button onclick="toggleSearch()" id="searchBtn" class="bg-indigo-600 text-white p-3 rounded-full shadow-2xl active:scale-90 transition-all border-2 border-white w-14 h-14 flex items-center justify-center" title="Tìm kiếm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
        </div>

        <!-- In PDF Icon -->
        <button onclick="window.print()" class="bg-emerald-600 text-white p-3 rounded-full shadow-2xl active:scale-90 transition-all border-2 border-white flex items-center justify-center w-14 h-14" title="In tài liệu (PDF)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
            </svg>
        </button>
        
        <!-- Copy Link Icon -->
        <button onclick="copyToClipboard()" class="bg-indigo-600 text-white p-3 rounded-full shadow-2xl active:scale-90 transition-all border-2 border-white flex items-center justify-center w-14 h-14" title="Copy Link chia sẻ">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
        </button>
    </div>

    <!-- Nút Menu Danh mục (Góc dưới trái Mobile) -->
    <div class="mobile-only-btn no-print fixed bottom-0 left-0 z-[100]">
        <button onclick="toggleModal('modal-list')" class="bg-indigo-600 text-white p-4 rounded-full shadow-2xl active:scale-90 transition-all border-2 border-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>

    <!-- Modal Danh mục nhanh -->
    <div id="modal-list" class="no-print fixed inset-0 bg-black/50 z-[110] hidden backdrop-blur-sm flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="font-extrabold text-indigo-900 tracking-tighter">DANH MỤC NHANH</h3>
                <button onclick="toggleModal('modal-list')" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 text-xl">&times;</button>
            </div>
            <div class="grid grid-cols-1 gap-3 py-2">
                <button onclick="scrollToSection('nghithuc-section')" class="flex items-center gap-3 p-4 bg-indigo-50 text-indigo-700 rounded-2xl font-bold text-left active:bg-indigo-100">
                    <span>📜</span> NGHI THỨC
                </button>
                <button onclick="scrollToSection('kinhtung-section')" class="flex items-center gap-3 p-4 bg-indigo-50 text-indigo-700 rounded-2xl font-bold text-left active:bg-indigo-100">
                    <span>📖</span> KINH TỤNG
                </button>
                <div class="h-[1px] bg-gray-100 my-1"></div>
                <button onclick="confirmClear()" class="flex items-center gap-3 p-4 bg-red-50 text-red-600 rounded-2xl font-bold text-left active:bg-red-100">
                    <span>🗑️</span> XOÁ TẤT CẢ LỰA CHỌN
                </button>
            </div>
        </div>
    </div>
    
    <!-- Float Container: Cuộn đầu/cuối trang (Giữa phải) -->
    <div class="no-print fixed top-1/2 right-0 z-[100] flex flex-col gap-2">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" 
                class="bg-white text-indigo-600 p-3 rounded-l-2xl shadow-2xl border-2 border-indigo-600 hover:bg-indigo-50 active:scale-90 transition-all duration-300"
                title="Về đầu trang">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
            </svg>
        </button>

        <button onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})" 
                class="bg-white text-indigo-600 p-3 rounded-l-2xl shadow-2xl border-2 border-indigo-600 hover:bg-indigo-50 active:scale-90 transition-all duration-300"
                title="Xuống cuối trang">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </button>
    </div>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch((err) => {
                        console.log('ServiceWorker đăng ký thất bại: ', err);
                    });
            });
        }
    </script>   

    <!-- Modal Phóng to QR Code -->
    <div id="qrModal" class="hidden no-print fixed inset-0 z-[100] bg-black/60 flex flex-col items-center justify-center backdrop-blur-sm transition-opacity" onclick="closeQRModal()">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-4 max-w-[90vw]" onclick="event.stopPropagation()">
            <div class="flex justify-between w-full items-center mb-1">
                <h3 class="font-bold text-indigo-900 text-lg uppercase tracking-tighter">Mã QR Trang Web</h3>
                <button onclick="closeQRModal()" class="text-gray-400 hover:text-red-500 transition-colors bg-gray-50 rounded-full p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            
            <div class="border border-indigo-100 p-2 rounded-xl bg-gray-50">
                <img src="./qrcode.png" alt="Mã QR Lớn" class="w-56 h-56 md:w-72 md:h-72 object-contain">
            </div>
            
            <a href="./qrcode.png" download="qrcode-tungkinh.png" class="mt-2 w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-all active:scale-95 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                TẢI MÃ QR VỀ MÁY
            </a>
        </div>
    </div>

    <!-- Footer chứa Link và QR Code -->
    <footer class="no-print w-full bg-white border-t border-indigo-100 p-3 flex flex-wrap items-center justify-center gap-6 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <div class="flex items-center gap-2 text-sm">
            <span class="font-bold text-indigo-800">LINK:</span>
            <a href="https://gptlohoi-del.github.io/tungkinh/" class="text-blue-600 hover:underline" target="_blank" rel="noopener" id="page-link">
                https://gptlohoi-del.github.io/tungkinh/
            </a>
            
            <button onclick="copyToClipboard()" class="flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg font-bold transition-all active:scale-95 border border-indigo-200 ml-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                COPY
            </button>
        </div>

        <div class="flex items-center gap-3">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Mã QR:</span>
            <div onclick="openQRModal()" title="Nhấn để phóng to" class="w-12 h-12 border border-indigo-200 rounded-md bg-white flex items-center justify-center overflow-hidden cursor-pointer hover:border-indigo-500 transition-colors shadow-sm">
                <img src="./qrcode.png" alt="QR Code" class="w-full h-full object-contain pointer-events-none">
            </div>
        </div>
    </footer>

</body>
</html>
