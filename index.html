<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tụng Kinh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#d97706">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <style>
        :root {
            --accent-color: #d97706; 
            --pre-bg: #fffff7; 
            --border-color: #fde68a; 
            --body-text: #451a03; 
            --pre-font-size: 1.4375rem;
            --reader-font: Arial, sans-serif;
            --reader-weight: 500; 
        }

        #pdf-content {
            font-family: var(--reader-font) !important;
            color: var(--body-text);
        }

        #pdf-content h1, #pdf-content h2, #pdf-content h3, #pdf-content h4, #pdf-content h5 {
            color: var(--accent-color) !important;
            font-weight: 700 !important;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
            display: block;
        }

        #pdf-content h1 { 
            font-size: 2.2rem !important; 
            text-align: center; 
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 15px;
            text-transform: uppercase;
        }

        #pdf-content h2 { 
            font-size: 2rem !important; 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        
        #pdf-content h3 { 
            font-size: 1.5rem !important; 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        
        #pdf-content h4 { 
            font-size: 1.2rem !important; 
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        #pdf-content pre {
            background-color: var(--pre-bg) !important;
            padding: 0.5rem !important;
            border-radius: 0.5rem;
            border-left: 4px solid var(--accent-color) !important;
            font-family: var(--reader-font) !important;
            font-size: var(--pre-font-size) !important;
            line-height: 1.7 !important;
            font-weight: var(--reader-weight) !important;
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
            margin: 1rem 0 !important;
            border: 1px solid var(--border-color);
            color: var(--body-text) !important;
        }

        .selection-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px; height: 20px;
            background-color: var(--accent-color);
            color: white !important;
            border-radius: 50%;
            font-size: 10px; font-weight: bold;
        }

        html { scroll-behavior: smooth; }
        .section-block { page-break-inside: avoid; }
        
        #pdf-content h2, #pdf-content h3, #pdf-content h4 {
            cursor: pointer;
            position: relative;
            padding-left: 25px !important;
        }

        #pdf-content h2::before, #pdf-content h3::before, #pdf-content h4::before {
            content: '▼';
            position: absolute;
            left: 0;
            transition: transform 0.3s;
            font-size: 0.8em;
            color: var(--accent-color);
        }

        #pdf-content h2.is-collapsed::before, #pdf-content h3.is-collapsed::before, #pdf-content h4.is-collapsed::before {
            transform: rotate(-90deg);
        }

        .section-hidden {
            display: none !important;
        }

        #main-checklist label, 
        #sutra-checklist label,
        #main-checklist span,
        #sutra-checklist span {
            font-weight: 700 !important;
            color: #451a03;
        }

        #main-checklist label:hover, 
        #sutra-checklist label:hover {
            color: var(--accent-color);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #fef3c7; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fcd34d; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #fbbf24; }
        
        @keyframes highlight-blink {
            0% { background-color: transparent; }
            50% { background-color: var(--pre-bg); transform: scale(1.02); }
            100% { background-color: transparent; }
        }
        .blink-target {
            animation: highlight-blink 0.8s ease-in-out 3;
            border: 2px solid var(--accent-color) !important;
            border-radius: 8px;
            z-index: 10;
        }

        .mobile-only-btn { display: block; }
        @media (min-width: 768px) {
            .mobile-only-btn { display: none !important; }
        }

        @media print {
            body, html, .flex-col, main, .flex-1, aside {
                height: auto !important;
                min-height: auto !important;
                overflow: visible !important;
                display: block !important;
            }
            .no-print, header, aside, .mobile-only-btn, footer, .fixed, #qrModal, #shareMenu {
                display: none !important;
            }
            body { background: white !important; }
            main {
                padding: 0 !important;
                margin: 0 !important;
            }
            .max-w-3xl {
                box-shadow: none !important;
                padding: 0 !important;
            }
            .section-hidden {
                display: block !important; 
            }
            #pdf-content h2::before, #pdf-content h3::before, #pdf-content h4::before {
                display: none !important; 
            }
            #pdf-content h2, #pdf-content h3, #pdf-content h4 {
                padding-left: 0 !important;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-amber-50 flex flex-col min-h-screen font-sans">
<style>
    .reader-toolbar { display:flex; align-items:center; justify-content:space-between; gap:3px; width:100%; min-width:0; }
    .reader-controls { display:flex; align-items:center; gap:3px; flex-wrap:nowrap; min-width:0; }
    .reader-controls button { min-width:30px; height:34px; padding:0 5px; border-radius:7px; border:1px solid #fcd34d; background:#fff; color:#78350f; font-weight:700; }
    .reader-controls select { min-width:0; max-width:90px; height:34px; border-radius:7px; padding:0 2px; background:#fff; color:#78350f; font-size:13px; font-weight:600; }
    #font-weight-select { max-width:76px; }
    #font-size-display { min-width:27px; text-align:center; font-weight:700; font-size:13px; color:#fff; }
    #pdf-content pre { overflow-wrap:anywhere; }
    #pdf-content h2, #pdf-content h3, #pdf-content h4 { cursor:pointer; }
    .item-title { font-size:17px !important; line-height:1.5; font-weight:600; }
    aside label { min-height:48px; }
    @media (max-width:370px) { .reader-controls { gap:2px; } .reader-controls select { max-width:75px; font-size:12px; } #font-weight-select { max-width:65px; } }
</style>
<header class="no-print bg-amber-800 text-amber-50 p-1 sticky top-0 z-50 shadow-lg">
  <div class="reader-toolbar">
    <button aria-label="HOME, về đầu trang" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="display:flex;align-items:center;gap:3px;font-weight:700;font-size:12px;flex-shrink:0;padding:6px 2px">⌂ HOME</button>
    <div class="reader-controls" aria-label="Tùy chỉnh chữ đọc kinh">
      <button aria-label="Giảm cỡ chữ" onclick="changeFontSize(-0.1)">A−</button>
      <span id="font-size-display" aria-label="Cỡ chữ">23</span>
      <button aria-label="Tăng cỡ chữ" onclick="changeFontSize(0.1)">A+</button>
      <select id="font-family-select" aria-label="Chọn phông chữ" onchange="setReaderFont(this.value)">
        <option value="arial">Arial</option>
        <option value="noto">Noto Sans</option>
        <option value="times">Times New Roman</option>
        <option value="georgia">Georgia</option>
        <option value="tahoma">Tahoma</option>
        <option value="verdana">Verdana</option>
        <option value="trebuchet">Trebuchet MS</option>
      </select>
      <select id="font-weight-select" aria-label="Độ đậm chữ" onchange="setReaderWeight(this.value)">
        <option value="400">Thường</option>
        <option value="500">Vừa</option>
        <option value="600">Đậm vừa</option>
        <option value="700">Đậm</option>
      </select>
    </div>
  </div>
</header>

    <div class="flex flex-col md:flex-row-reverse flex-1 overflow-hidden">
        <main class="flex-1 p-1 md:p-12 bg-amber-50 overflow-y-auto" style="overflow-anchor: none;">
            <div class="max-w-3xl mx-auto bg-white min-h-full shadow-xl p-1 md:p-16 rounded-sm border border-amber-100">
                <div id="preview-placeholder" class="no-print text-center py-20 text-amber-300">
                    <p class="text-xl font-medium">Chọn nội dung kinh để hiển thị.</p>
                </div>
                <div id="pdf-content" class="hidden"></div>
            </div>
        </main>
    
        <aside class="no-print w-full md:w-96 bg-white border-r border-amber-100 overflow-y-auto p-4 space-y-6">
            <button onclick="confirmClear()" class="w-full mb-4 py-2.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl transition-all active:scale-95 uppercase tracking-tighter shadow-md flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                XOÁ LỰA CHỌN
            </button>

            <section class="bg-amber-50 border border-amber-200 rounded-xl p-3" aria-label="Bộ bài tụng đã lưu">
              <h2 class="font-bold text-amber-900 mb-2 text-base">BỘ BÀI TỤNG</h2>
              <div class="flex flex-wrap gap-2">
                <select id="saved-profile" aria-label="Chọn bộ bài tụng" class="flex-1 min-w-0 border border-amber-300 rounded-lg p-2 text-base bg-white"><option value="">Chọn bộ đã lưu</option></select>
                <button onclick="loadReadingProfile()" class="bg-amber-700 text-white rounded-lg px-3 py-2 font-semibold">Mở</button>
                <button onclick="saveReadingProfile()" class="bg-white text-amber-900 border border-amber-300 rounded-lg px-3 py-2 font-semibold">Lưu bộ</button>
                <button onclick="deleteReadingProfile()" class="bg-white text-red-700 border border-red-200 rounded-lg px-3 py-2 font-semibold">Xóa bộ</button>
              </div>
            </section>
            <div>
                <h2 class="font-bold text-amber-800 mb-3 border-b border-amber-200 pb-2 text-sm uppercase" id="nghithuc-section">NGHI THỨC</h2>
                <div id="main-checklist" class="space-y-1"></div>
            </div>
            
            <div>
                <h2 class="font-bold text-amber-800 mb-3 border-b border-amber-200 pb-2 text-sm uppercase" id="kinhtung-section">KINH TỤNG</h2>
                <div id="sutra-checklist" class="space-y-1"></div>
            </div>
        </aside>
    </div>

    <script src="./data.js" defer></script>

    <script>
        let selectedOrder = [];

        function removeAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
        }

        function toggleSearch() {
            const wrapper = document.getElementById('searchWrapper');
            const btn = document.getElementById('searchBtn');
            const results = document.getElementById('searchResults');
            
            if (wrapper.classList.contains('hidden')) {
                wrapper.classList.remove('hidden');
                wrapper.classList.add('flex'); 
                document.getElementById('searchInput').focus();
                btn.classList.replace('bg-amber-600', 'bg-red-500');
            } else {
                wrapper.classList.add('hidden');
                wrapper.classList.remove('flex');
                document.getElementById('searchInput').value = "";
                results.innerHTML = "";
                results.classList.add('hidden');
                btn.classList.replace('bg-red-500', 'bg-amber-600');
            }
            
            // Đóng menu share nếu đang mở
            document.getElementById('shareMenu').classList.add('hidden');
        }

        function toggleShareMenu() {
            const menu = document.getElementById('shareMenu');
            menu.classList.toggle('hidden');
            
            // Đóng khung tìm kiếm nếu đang mở
            const wrapper = document.getElementById('searchWrapper');
            if (!wrapper.classList.contains('hidden')) {
                toggleSearch();
            }
        }

        let searchTimeout;
        function indexSearchData() {
            if (typeof fullData === 'undefined') return;
            fullData.forEach(item => {
                item._searchString = removeAccents(item.title + " " + (item.content || "") + " " + (item.content_open || "") + " " + (item.content_close || ""));
            });
        }

        function searchDataDebounced() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(searchData, 300);
        }

        function searchData() {
            if (typeof fullData === 'undefined') return;
            const query = removeAccents(document.getElementById('searchInput').value.trim());
            const resultsContainer = document.getElementById('searchResults');
            
            if (query.length < 2) {
                resultsContainer.innerHTML = "";
                resultsContainer.classList.add('hidden');
                return;
            }

            const matches = fullData.filter(item => !isPlaceholder(item) && item._searchString && item._searchString.includes(query));

            if (matches.length > 0) {
                resultsContainer.classList.remove('hidden');
                resultsContainer.innerHTML = matches.map(item => `
                    <div onclick="goToItem(${item.id})" class="p-3 hover:bg-amber-50 border-b border-amber-100 text-sm text-amber-900 cursor-pointer flex justify-between items-center">
                        <span class="truncate pr-2">${item.title}</span>
                        <span class="text-[10px] text-amber-500 font-bold whitespace-nowrap">${item.type === 'sub' ? 'KINH' : 'NGHI THỨC'}</span>
                    </div>
                `).join('');
            } else {
                resultsContainer.innerHTML = "<div class='p-3 text-xs text-amber-400 italic'>Không tìm thấy...</div>";
                resultsContainer.classList.remove('hidden');
            }
        }

        const PROFILE_KEY='tungKinhReadingProfilesV1';
        function readProfiles() {
            try { const x=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}'); return x&&typeof x==='object'&&!Array.isArray(x)?x:{}; }
            catch(e) { return {}; }
        }
        function refreshProfiles() {
            const el=document.getElementById('saved-profile'), prev=el.value, profiles=readProfiles();
            el.replaceChildren(new Option('Chọn bộ đã lưu',''));
            Object.keys(profiles).sort((a,b)=>a.localeCompare(b,'vi')).forEach(n=>el.add(new Option(n,n)));
            if(Object.prototype.hasOwnProperty.call(profiles,prev)) el.value=prev;
        }
        function saveReadingProfile() {
            const name=(prompt('Tên bộ bài tụng (ví dụ: Buổi sáng):')||'').trim().slice(0,60);
            if(!name) return;
            const profiles=readProfiles();
            if(Object.prototype.hasOwnProperty.call(profiles,name)&&!confirm('Ghi đè bộ bài tụng này?')) return;
            profiles[name]=[...selectedOrder];
            try { localStorage.setItem(PROFILE_KEY,JSON.stringify(profiles)); refreshProfiles(); document.getElementById('saved-profile').value=name; }
            catch(e) { alert('Không lưu được bộ bài tụng trên thiết bị này.'); }
        }
        function loadReadingProfile() {
            const data=readProfiles()[document.getElementById('saved-profile').value];
            if(!Array.isArray(data)) return;
            selectedOrder=[...new Set(data.filter(id=>fullData.some(d=>d.id===id&&!isPlaceholder(d))))];
            syncChecklistsUI(); updateUI(); saveToLocalStorage(); updateShareableURL();
            document.getElementById('modal-list')?.classList.add('hidden');
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function deleteReadingProfile() {
            const name=document.getElementById('saved-profile').value;
            if(!name||!confirm('Xóa bộ bài tụng "'+name+'"?')) return;
            const profiles=readProfiles(); delete profiles[name];
            localStorage.setItem(PROFILE_KEY,JSON.stringify(profiles)); refreshProfiles();
        }
        function isPlaceholder(item) {
            return [56,57,58,124,125].includes(item.id) && !(item.content || item.content_open || item.content_close || '').trim();
        }
        function initChecklists() {
            const mainContainer = document.getElementById('main-checklist');
            const sutraContainer = document.getElementById('sutra-checklist');
            let mainHtml = "";
            let sutraHtml = "";

            fullData.filter(item => !isPlaceholder(item)).forEach(item => {
                const rowHtml = `
                    <div id="item-${item.id}" class="transition-all duration-300">
                        <label class="flex items-center justify-between p-3 hover:bg-amber-50 rounded-lg cursor-pointer border-b border-amber-50">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" id="cb-${item.id}" class="w-5 h-5 rounded text-amber-600 focus:ring-amber-500" onchange="toggleSection(${item.id})">
                                <span class="item-title text-sm text-amber-900">${item.title}</span>
                            </div>
                        </label>
                    </div>`;
                
                if (item.type === 'sub') sutraHtml += rowHtml;
                else mainHtml += rowHtml;
            });

            mainContainer.innerHTML = mainHtml;
            sutraContainer.innerHTML = sutraHtml;
        }

        function syncChecklistsUI() {
            fullData.forEach(item => {
                const row = document.getElementById(`item-${item.id}`);
                const checkbox = document.getElementById(`cb-${item.id}`);
                if (!row || !checkbox) return;

                const orderIndex = selectedOrder.indexOf(item.id);
                const isChecked = orderIndex !== -1;
                
                checkbox.checked = isChecked;
                const textSpan = row.querySelector('.item-title');
                let badge = row.querySelector('.selection-number');

                if (isChecked) {
                    if(textSpan) {
                        textSpan.classList.add('text-amber-800', 'font-bold');
                        textSpan.classList.remove('text-amber-900');
                    }
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.className = 'selection-number';
                        row.querySelector('label').appendChild(badge);
                    }
                    badge.innerText = orderIndex + 1;
                } else {
                    if(textSpan) {
                        textSpan.classList.remove('text-amber-800', 'font-bold');
                        textSpan.classList.add('text-amber-900');
                    }
                    if (badge) badge.remove();
                }
            });
        }
            
        function goToItem(id) {
            document.getElementById('searchResults').classList.add('hidden');
            
            if (!selectedOrder.includes(id)) {
                toggleSection(id, false);
            }

            const targetElement = document.getElementById(`item-${id}`);
            if (targetElement) {
                targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetElement.classList.add('blink-target');
                setTimeout(() => {
                    targetElement.classList.remove('blink-target');
                }, 2500);
            }

            setTimeout(() => {
                const previewElement = document.getElementById(`preview-item-${id}`);
                if (previewElement) {
                    previewElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 300);
        }   

        function toggleSection(id, preventScrollJump = true) {
            const container = document.getElementById(`item-${id}`);
            const beforeTop = container ? container.getBoundingClientRect().top : 0;

            const index = selectedOrder.indexOf(id);
            if (index > -1) {
                selectedOrder.splice(index, 1);
            } else {
                const itemData = fullData.find(d => d.id === id);
                if (itemData && itemData.type === 'ritual_wrapper') {
                    selectedOrder = selectedOrder.filter(existingId => {
                        const existingData = fullData.find(d => d.id === existingId);
                        return !(existingData && existingData.type === 'ritual_wrapper');
                    });
                }
                selectedOrder.push(id);
            }
            
            syncChecklistsUI();
            updateUI();

            if (preventScrollJump && container) {
                const afterTop = container.getBoundingClientRect().top;
                const diff = afterTop - beforeTop;
                
                if (Math.abs(diff) > 1) {
                    const html = document.documentElement;
                    html.style.scrollBehavior = 'auto'; 
                    window.scrollBy(0, diff);
                    
                    requestAnimationFrame(() => {
                        html.style.scrollBehavior = '';
                    });
                }
            }

            saveToLocalStorage();
            updateShareableURL();
        }

        function clearAll() {
            selectedOrder = [];
            syncChecklistsUI();
            updateUI();
            saveToLocalStorage();
            updateShareableURL();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateUI() {
            const previewArea = document.getElementById('pdf-content');
            const placeholder = document.getElementById('preview-placeholder');

            const validSelectedItems = selectedOrder
                .map(id => fullData.find(d => d.id === id))
                .filter(item => item && (item.content || item.content_open));

            if (validSelectedItems.length === 0) {
                previewArea.classList.add('hidden');
                placeholder.classList.remove('hidden');
                return;
            }

            placeholder.classList.add('hidden');
            previewArea.classList.remove('hidden');

            const subContent = validSelectedItems
                .filter(item => item.type === 'sub')
                .map(item => `<div id="preview-item-${item.id}">` + item.content + `</div>`)
                .join('<div style="page-break-after: always; margin: 10px 0;"></div>');

            const hasWrapper = validSelectedItems.some(item => item.type === 'ritual_wrapper');
            const renderBlocks = [];
            let wrapperAdded = false;

            validSelectedItems.forEach(item => {
                if (item.type === 'ritual_wrapper') {
                    if (!wrapperAdded) {
                        renderBlocks.push(`<div id="preview-item-${item.id}">` + item.content_open + subContent + item.content_close + `</div>`);
                        wrapperAdded = true;
                    } else {
                        renderBlocks.push(`<div id="preview-item-${item.id}">` + item.content_open + item.content_close + `</div>`);
                    }
                } 
                else if (item.type === 'main') {
                    renderBlocks.push(`<div id="preview-item-${item.id}">` + item.content + `</div>`);
                } 
                else if (item.type === 'sub' && !hasWrapper) {
                    renderBlocks.push(`<div id="preview-item-${item.id}">` + item.content + `</div>`);
                }
            });

            previewArea.innerHTML = renderBlocks.join('<div style="page-break-after: always; margin: 10px 0;"></div>');
        }

        function saveToLocalStorage() {
            localStorage.setItem('tungKinhSelected', JSON.stringify(selectedOrder));
        }

        function loadState() {
            const params = new URLSearchParams(window.location.search);
            const savedOrder = params.get('s'); 
            
            if (savedOrder) {
                selectedOrder = [...new Set(savedOrder.split(',')
                    .map(id => parseInt(id, 10))
                    .filter(id => !isNaN(id) && fullData.some(d => d.id === id && !isPlaceholder(d))))];
            } else {
                const localData = localStorage.getItem('tungKinhSelected');
                if(localData) {
                    try {
                        selectedOrder = JSON.parse(localData).filter(id => fullData.some(d => d.id === id && !isPlaceholder(d)));
                    } catch(e) {}
                }
            }
        }

        function updateShareableURL() {
            const url = new URL(window.location.href);
            if (selectedOrder.length > 0) {
                url.searchParams.set('s', selectedOrder.join(','));
            } else {
                url.searchParams.delete('s');
            }
            try {
                window.history.replaceState(null, '', url.toString());
            } catch(e) {}
                // QR không được phép chặn thao tác lưu hoặc chọn bài kinh.
            const qrBox = document.getElementById('qrcode-box');
            if (qrBox && typeof QRCode !== 'undefined') {
                try {
                    qrBox.innerHTML = '';
                    new QRCode(qrBox, { text: url.toString(), width: 220, height: 220,
                        colorDark:'#78350f', colorLight:'#fffbeb', correctLevel:QRCode.CorrectLevel.M });
                } catch (error) { console.warn('Không tạo được QR:', error); }
            } else if (qrBox) {
                qrBox.textContent = 'Mã QR chưa sẵn sàng. Bạn vẫn có thể sao chép liên kết.';
            }
        }

        function downloadQR() {
            const qrBox = document.getElementById("qrcode-box");
            const img = qrBox.querySelector("img");
            if (img && img.src) {
                const link = document.createElement("a");
                link.href = img.src;
                link.download = "qrcode-tungkinh.png";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                alert("Mã QR chưa sẵn sàng!");
            }
        }

        const READER_FONTS = {
            arial:'Arial, sans-serif', noto:'"Noto Sans", Arial, sans-serif',
            times:'"Times New Roman", Times, serif', georgia:'Georgia, serif',
            tahoma:'Tahoma, sans-serif', verdana:'Verdana, sans-serif',
            trebuchet:'"Trebuchet MS", Arial, sans-serif'
        };
        let currentFontSize = 1.4375;
        function saveReaderSettings() {
            try { localStorage.setItem('tungKinhReaderSettings', JSON.stringify({
                size:currentFontSize, font:document.getElementById('font-family-select').value,
                weight:document.getElementById('font-weight-select').value
            })); } catch(e) { console.warn('Không lưu được tùy chọn chữ',e); }
        }
        function applyReaderSettings() {
            document.documentElement.style.setProperty('--pre-font-size',currentFontSize+'rem');
            document.documentElement.style.setProperty('--reader-font',READER_FONTS[document.getElementById('font-family-select').value] || READER_FONTS.arial);
            document.documentElement.style.setProperty('--reader-weight',document.getElementById('font-weight-select').value);
            document.getElementById('font-size-display').textContent=Math.round(currentFontSize*16);
            saveReaderSettings();
        }
        function changeFontSize(delta) {
            currentFontSize=Math.max(1,Math.min(3,Math.round((currentFontSize+delta)*100)/100));
            applyReaderSettings();
        }
        function setReaderFont(font) { if(READER_FONTS[font]) applyReaderSettings(); }
        function setReaderWeight(weight) { if(['400','500','600','700'].includes(weight)) applyReaderSettings(); }
        function loadReaderSettings() {
            try {
                const v=JSON.parse(localStorage.getItem('tungKinhReaderSettings')||'{}');
                if(Number.isFinite(v.size)) currentFontSize=Math.max(1,Math.min(3,v.size));
                if(READER_FONTS[v.font]) document.getElementById('font-family-select').value=v.font;
                if(['400','500','600','700'].includes(v.weight)) document.getElementById('font-weight-select').value=v.weight;
                else document.getElementById('font-weight-select').value='550';
            } catch(e) {}
            applyReaderSettings();
        }

        window.addEventListener('DOMContentLoaded', () => {
            try {
                if (typeof fullData === 'undefined') {
                    document.getElementById('preview-placeholder').innerHTML = `<p class="text-red-500 font-bold">Lỗi tải dữ liệu. Vui lòng tải lại trang!</p>`;
                    return;
                }
                if ('serviceWorker' in navigator && !location.pathname.includes('/modules/')) {
                    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:',e));
                }
                loadReaderSettings();
                refreshProfiles();
                indexSearchData();
                initChecklists();
                loadState();
                syncChecklistsUI();
                updateUI(); 
                updateShareableURL();
                const pos=Number(sessionStorage.getItem('tungKinhScrollY')||0);
                if(pos>0) requestAnimationFrame(()=>window.scrollTo(0,pos));
            } catch (error) {
                console.error("Lỗi khởi tạo:", error);
            }
        });

        let saveScrollPending=false;
        window.addEventListener('scroll',()=>{
            if(saveScrollPending) return;
            saveScrollPending=true;
            requestAnimationFrame(()=>{
                try { sessionStorage.setItem('tungKinhScrollY',String(Math.round(window.scrollY))); } catch(e) {}
                saveScrollPending=false;
            });
        },{passive:true});
        document.getElementById('pdf-content').addEventListener('click' , function(e) {
            const header = e.target.closest('h2, h3, h4');
            if (!header) return;

            const level=Number(header.tagName.slice(1));
            const collapse=!header.classList.contains('is-collapsed');
            header.classList.toggle('is-collapsed',collapse);
            let next=header.nextElementSibling;
            while(next) {
                const nextLevel=/^H[1-4]$/.test(next.tagName) ? Number(next.tagName.slice(1)) : 99;
                if(nextLevel<=level) break;
                next.classList.toggle('section-hidden',collapse);
                next=next.nextElementSibling;
            }
        });

        function toggleModal(id) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.toggle('hidden');
        }

        function scrollToSection(id) {
            const element = document.getElementById(id);
            if(element) {
                element.scrollIntoView({ behavior: 'smooth' });
                toggleModal('modal-list');
            }
        }

        function confirmClear() {
            if(confirm("Bạn có chắc chắn muốn xoá tất cả lựa chọn không?")) {
                clearAll();
                document.getElementById('modal-list')?.classList.add('hidden');
            }
        }

        function fallbackCopyTextToClipboard(text) {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert("Đã copy đường dẫn: \n" + text);
            } catch (err) {
                console.error('Lỗi Fallback Copy', err);
                alert("Trình duyệt không hỗ trợ copy tự động!");
            }
            textArea.remove();
        }

        function copyToClipboard() {
            const linkToCopy = window.location.href;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(linkToCopy).then(() => {
                    alert("Đã copy đường dẫn: \n" + linkToCopy);
                }).catch(err => {
                    fallbackCopyTextToClipboard(linkToCopy);
                });
            } else {
                fallbackCopyTextToClipboard(linkToCopy);
            }
            // Đóng menu share sau khi copy
            document.getElementById('shareMenu').classList.add('hidden');
        }

        function openQRModal() {
            document.getElementById('qrModal').classList.remove('hidden');
            // Đóng menu share sau khi mở QR
            document.getElementById('shareMenu').classList.add('hidden');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        window.addEventListener('click', function(event) {
            const modalList = document.getElementById('modal-list');
            const wrapper = document.getElementById('searchWrapper');
            const btnSearch = document.getElementById('searchBtn');
            const shareMenu = document.getElementById('shareMenu');
            const btnShare = document.getElementById('shareBtn');

            if (event.target == modalList) modalList.classList.add('hidden');
            
            // Xử lý đóng Search khi click ngoài
            if (wrapper && !wrapper.classList.contains('hidden') && btnSearch && !btnSearch.contains(event.target) && !wrapper.contains(event.target)) {
                toggleSearch(); 
            }
            
            // Xử lý đóng Share Menu khi click ngoài
            if (shareMenu && !shareMenu.classList.contains('hidden') && btnShare && !btnShare.contains(event.target) && !shareMenu.contains(event.target)) {
                shareMenu.classList.add('hidden');
            }
        });

        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const modalList = document.getElementById('modal-list');
                const qrModal = document.getElementById('qrModal');
                const wrapper = document.getElementById('searchWrapper');
                const shareMenu = document.getElementById('shareMenu');

                if (modalList) modalList.classList.add('hidden');
                if (qrModal) qrModal.classList.add('hidden');
                if (wrapper && !wrapper.classList.contains('hidden')) toggleSearch();
                if (shareMenu && !shareMenu.classList.contains('hidden')) shareMenu.classList.add('hidden');
            }
        });

        window.addEventListener('beforeunload', function (e) {
            if (selectedOrder.length > 0) {
                e.preventDefault();
                e.returnValue = 'NẾU BẠN TẢI LẠI TRANG, CÁC BÀI KINH ĐÃ CHỌN SẼ BỊ MẤT. BẠN CÓ CHẮC CHẮN KHÔNG?';
            }
        });

    </script>
    
    <!-- Float Container: Tìm kiếm, In, Share (Giữa cạnh dưới) -->
    <div class="no-print fixed bottom-1 left-1/2 -translate-x-1/2 z-[100] flex flex-row items-center gap-3">
        <!-- Search -->
        <div class="relative flex flex-col items-center">
            <div id="searchWrapper" class="hidden absolute bottom-14 flex-col items-center gap-2">
                <input type="text" id="searchInput" oninput="searchDataDebounced()" placeholder="Tìm tên hoặc nội dung kinh..." 
                       class="w-72 md:w-80 p-3 bg-white text-amber-900 rounded-2xl shadow-xl border-2 border-amber-600 outline-none">
                <div id="searchResults" class="w-72 md:w-80 max-h-48 overflow-y-auto bg-white rounded-xl shadow-xl border border-amber-200 hidden"></div>
            </div>
            <button aria-label="Tìm kiếm" onclick="toggleSearch()" id="searchBtn" class="bg-amber-600 text-white p-2.5 rounded-full shadow-lg active:scale-90 transition-all border-2 border-white w-12 h-12 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            </button>
        </div>

        <!-- In PDF Icon -->
        <button aria-label="In tài liệu" onclick="window.print()" class="bg-emerald-600 text-white p-2.5 rounded-full shadow-lg active:scale-90 transition-all border-2 border-white flex items-center justify-center w-12 h-12">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
        </button>
        
        <!-- Nút Share (Thay cho nút Copy cũ) -->
        <div class="relative flex flex-col items-center">
            <!-- Menu tùy chọn share (Bật lên) -->
            <div id="shareMenu" class="hidden absolute bottom-14 flex-col bg-white rounded-xl shadow-xl border border-amber-200 overflow-hidden w-40">
                <button onclick="copyToClipboard()" class="w-full px-4 py-3 text-sm font-semibold text-amber-900 hover:bg-amber-50 flex items-center gap-2 border-b border-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                    Copy Link
                </button>
                <button onclick="openQRModal()" class="w-full px-4 py-3 text-sm font-semibold text-amber-900 hover:bg-amber-50 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" /></svg>
                    Mã QR
                </button>
            </div>
            <button aria-label="Chia sẻ" onclick="toggleShareMenu()" id="shareBtn" class="bg-amber-600 text-white p-2.5 rounded-full shadow-lg active:scale-90 transition-all border-2 border-white flex items-center justify-center w-12 h-12">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" /></svg>
            </button>
        </div>
    </div>

    <!-- Nút Menu Danh mục (Góc dưới trái Mobile) -->
    <div class="mobile-only-btn no-print fixed bottom-0 left-0 z-[100]">
        <button aria-label="Danh mục" onclick="toggleModal('modal-list')" class="bg-amber-600 text-white p-4 rounded-full shadow-lg active:scale-90 transition-all border-2 border-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>

    <!-- Modal Danh mục nhanh -->
    <div id="modal-list" class="no-print fixed inset-0 bg-black/50 z-[110] hidden backdrop-blur-sm flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-amber-100 pb-4">
                <h3 class="font-extrabold text-amber-900 tracking-tighter">DANH MỤC NHANH</h3>
                <button aria-label="Đóng danh mục" onclick="toggleModal('modal-list')" class="w-8 h-8 flex items-center justify-center bg-amber-50 rounded-full text-amber-500 text-xl">&times;</button>
            </div>
            <div class="grid grid-cols-1 gap-3 py-2">
                <button onclick="scrollToSection('nghithuc-section')" class="flex items-center gap-3 p-4 bg-amber-50 text-amber-800 rounded-2xl font-bold text-left active:bg-amber-100">
                    <span>📜</span> NGHI THỨC
                </button>
                <button onclick="scrollToSection('kinhtung-section')" class="flex items-center gap-3 p-4 bg-amber-50 text-amber-800 rounded-2xl font-bold text-left active:bg-amber-100">
                    <span>📖</span> KINH TỤNG
                </button>
                <div class="h-[1px] bg-amber-100 my-1"></div>
                <button onclick="confirmClear()" class="flex items-center gap-3 p-4 bg-red-50 text-red-600 rounded-2xl font-bold text-left active:bg-red-100">
                    <span>🗑️</span> XOÁ TẤT CẢ LỰA CHỌN
                </button>
            </div>
        </div>
    </div>
    
    <!-- Float Container: Cuộn đầu/cuối trang (Góc dưới phải) -->
    <div class="no-print fixed bottom-2 right-2 z-[100] flex flex-col gap-2">
        <button aria-label="Về đầu trang" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" 
                class="bg-white text-amber-700 p-2.5 rounded-full shadow-md border-2 border-amber-600 hover:bg-amber-50 active:scale-90 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
        </button>
        <button aria-label="Xuống cuối trang" onclick="window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'})" 
                class="bg-white text-amber-700 p-2.5 rounded-full shadow-md border-2 border-amber-600 hover:bg-amber-50 active:scale-90 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
        </button>
    </div>

    <!-- Modal Phóng to QR Code -->
    <div id="qrModal" class="hidden no-print fixed inset-0 z-[100] bg-black/60 flex flex-col items-center justify-center backdrop-blur-sm transition-opacity" onclick="closeQRModal()">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-4 max-w-[90vw]" onclick="event.stopPropagation()">
            <div class="flex justify-between w-full items-center mb-1">
                <h3 class="font-bold text-amber-900 text-lg uppercase tracking-tighter">Mã QR Trang Web</h3>
                <button aria-label="Đóng QR" onclick="closeQRModal()" class="text-amber-400 hover:text-red-500 transition-colors bg-amber-50 rounded-full p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <!-- Khung chứa mã QR động -->
            <div id="qrcode-box" class="border border-amber-200 p-4 rounded-xl bg-amber-50 flex justify-center items-center w-full"></div>
            
            <!-- Nút Tải QR mới -->
            <button onclick="downloadQR()" class="mt-2 w-full flex items-center justify-center gap-2 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-xl transition-all active:scale-95 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                TẢI MÃ QR VỀ MÁY
            </button>
            
            </div>
    
</body>
</html>
