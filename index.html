        #pdf-content h2, #pdf-content h3 {

            position: absolute;
            left: 0;
            transition: transform 0.3s;
            font-size: 0.8em;
            color: #6366f1; /* Indigo-500 */
        }

        #pdf-content h2.is-collapsed::before, #pdf-content h3.is-collapsed::before {
            transform: rotate(-90deg);
        }

        }

Từ bao nhiêu công hạnh
của một người xuất gia
như giữ gìn giới luật
sống đời sống giản đơn
thủ hộ các giác quan
và tinh tấn Chánh Niệm.
Vị Tỳ kheo như thế
sẽ tìm chốn hoang vu
như gốc cây, khe suối
hoặc hang núi, chòi tranh
ngồi như một đóa sen
thẳng lưng và bất động
với Chánh Niệm rạng ngời
rõ ràng ngay trước mắt. O

Rồi từ một nội tâm
sáng trong và yên tĩnh
tham ái được diệt trừ
sân hận được vượt qua
lòng từ mẫn bao la
thương yêu cho tất cả.
Rồi từ một nội tâm
sáng trong và yên tĩnh
nên hôn trầm, trạo hối
và do dự lìa xa
Như một người thoát ra
khỏi gông cùm xiềng xích
như một người vượt qua
khỏi sa mạc khô khan
gặp dòng sông nước mát
cũng vậy, Tỳ kheo ấy
diệt năm triền cái rồi
được hân hoan hạnh phúc. O

Từ niềm hân hoan trên
Tâm càng thêm định tĩnh
Bất thiện pháp xa lìa
Sơ thiền được chứng đạt.
Đó là một trạng thái
tham dục được vượt qua
nên hỷ lạc tràn đầy
dù vẫn còn niệm tế.
Không tự mãn Sơ thiền
Tỳ kheo ấy nhiếp tâm
diệt trừ niệm vi tế
và chứng đạt Nhị thiền.
Đó là một trạng thái
hỷ lạc do định sanh
rất thênh thang mầu nhiệm
tâm cực kỳ yên tĩnh. O

Không tự mãn Nhị thiền
Tỳ kheo ấy nhiếp tâm
dừng hoạt động giác quan
để chứng đạt Tam thiền.
Đó là một trạng thái
vào Chánh Định rất sâu
với an lạc vi diệu
tận cùng không bờ bến.
Không tự mãn Tam thiền
Tỳ kheo ấy nhiếp tâm
trừ mọi cảm thọ trước
để chứng đạt Tứ thiền.
Đó là một trạng thái
đã bất động hoàn toàn
không cảm thọ khổ vui
và vô cùng sáng suốt. O

Rồi từ một nội tâm
đã bất động hoàn toàn
Tỳ kheo ấy hướng tâm
nhớ về vô lượng kiếp
qua từng chỗ thọ sanh
với giai cấp, dòng họ
khổ vui và tên tuổi
rất chi tiết rõ ràng
và như vậy, Vị ấy
thành tựu Túc Mạng Minh.
Rồi từ một nội tâm
đã bất động hoàn toàn
Tỳ kheo ấy hướng tâm
xem chúng sanh lưu chuyển
qua mỗi kiếp luân hồi
nhận quả báo khổ vui
theo nghiệp duyên thiện ác
không một chút sai lầm
và như vậy, Vị ấy
thành tựu Thiên Nhãn Minh. O

Rồi từ một nội tâm
đã bất động hoàn toàn
Trí tuệ được khởi lên
vô minh được chấm dứt.
Vị ấy biết rõ ràng
như thế nào là Khổ
hay Nguyên Nhân Của Khổ
thế nào là Giải Thoát
và Đường Về Giải Thoát
và như vậy, Vị ấy
chứng đạt Lậu Tận Minh.
Từ Chánh Trí như trên
Vị ấy tự biết mình
đã dừng lại Luân hồi
đã viên thành Phạm hạnh
đã hoàn toàn giải thoát. O

<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b>

<h3>KINH SỐNG HÒA HỢP</h3>

- Kính bạch Đức Thế Tôn!

<h3>THÁNH TRÍ BÁT NHÃ</h3>
<pre>Khi Bồ Tát Quán Tự Tại thành tựu được Chánh Định thẳm sâu, phát sinh trí tuệ Bát Nhã vi diệu, liền thấy thân tâm năm uẩn này trống rỗng, không quan trọng nữa, và ngay đó vượt qua tất cả đau khổ.
Này Xá Lợi Phất, Bồ Tát thành tựu được Chánh Định vĩ đại an lành nên không còn chấp vào sắc thân, tự tại đối với sắc thân;
không còn bị chi phối bởi cảm giác, tự tại đối với cảm giác; không còn vướng mắc nơi tâm tưởng, tự tại đối với tâm tưởng; không còn lệ thuộc vào tâm năng, tự tại đối với tâm năng; không còn bị giới hạn bởi cái biết, tự tại đối với cái biết.
Này Xá Lợi Phất, với sự tự tại an lành như thế, Bồ Tát đi vào sinh tử mang hạnh nguyện hóa độ chúng sinh. Khi ở trong sinh tử, Bồ Tát không bị dính mắc bởi bất cứ điều gì, không cần bất cứ điều gì, không xao động theo bất cứ sự biến dịch nào của cuộc đời. Bồ Tát đến với chúng sinh bằng tâm từ bi vô hạn, không phân biệt kẻ sang người hèn, kẻ dở người hay, thậm chí thương yêu cả kẻ xấu ác để tìm cách hóa độ. Bồ Tát sẽ phải chấp nhận mọi điều tôn vinh hay nhục mạ, vinh quang hay cay đắng một cách bình thản. Dũng lực của Bồ Tát là vô biên vô hạn.
Bồ Tát sẽ tùy theo tâm tình, sở thích, ngôn ngữ của chúng sinh mà tìm cách hóa độ chứ không chấp cứng vào văn tự Kinh điển vì cả cuộc sống của Bồ Tát là một bài Kinh thiêng liêng bất tận; những việc làm của Bồ Tát là tấm gương sáng ngời, ngay cả một cái nhìn hay sự im lặng của Bồ Tát cũng như sấm sét có thể làm thay đổi tâm hồn người đối diện.
Tâm của Bồ Tát chính là vô lượng đạo lý; lời nói của Bồ Tát chính là vô lượng Kinh điển, nghe không giống như ngôn ngữ cổ thư nhưng không hề sai khác với ý Phật.
Bồ Tát thực hành Bát Nhã như thế nên thành tựu vô lượngcông đức. Những công đức này  khiến cho Bồ Tát trở nên một vị Thánh đầy uy lực, không một chướng ngại nào, khổ nạn nào có thể xâm phạm được nữa. Bồ Tát đạt được sự bình an vô hạn cả nội tâm và ngoại cảnh.

<h3>THÁNH TRÍ BÁT NHÃ</h3>
<pre>Khi Bồ Tát Quán Tự Tại thành tựu được Chánh Định thẳm sâu, phát sinh trí tuệ Bát Nhã vi diệu, liền thấy thân tâm năm uẩn này trống rỗng, không quan trọng nữa, và ngay đó vượt qua tất cả đau khổ.
Này Xá Lợi Phất, Bồ Tát thành tựu được Chánh Định vĩ đại an lành nên không còn chấp vào sắc thân, tự tại đối với sắc thân;
không còn bị chi phối bởi cảm giác, tự tại đối với cảm giác; không còn vướng mắc nơi tâm tưởng, tự tại đối với tâm tưởng; không còn lệ thuộc vào tâm năng, tự tại đối với tâm năng; không còn bị giới hạn bởi cái biết, tự tại đối với cái biết.
Này Xá Lợi Phất, với sự tự tại an lành như thế, Bồ Tát đi vào sinh tử mang hạnh nguyện hóa độ chúng sinh. Khi ở trong sinh tử, Bồ Tát không bị dính mắc bởi bất cứ điều gì, không cần bất cứ điều gì, không xao động theo bất cứ sự biến dịch nào của cuộc đời. Bồ Tát đến với chúng sinh bằng tâm từ bi vô hạn, không phân biệt kẻ sang người hèn, kẻ dở người hay, thậm chí thương yêu cả kẻ xấu ác để tìm cách hóa độ. Bồ Tát sẽ phải chấp nhận mọi điều tôn vinh hay nhục mạ, vinh quang hay cay đắng một cách bình thản. Dũng lực của Bồ Tát là vô biên vô hạn.
Bồ Tát sẽ tùy theo tâm tình, sở thích, ngôn ngữ của chúng sinh mà tìm cách hóa độ chứ không chấp cứng vào văn tự Kinh điển vì cả cuộc sống của Bồ Tát là một bài Kinh thiêng liêng bất tận; những việc làm của Bồ Tát là tấm gương sáng ngời, ngay cả một cái nhìn hay sự im lặng của Bồ Tát cũng như sấm sét có thể làm thay đổi tâm hồn người đối diện.
Tâm của Bồ Tát chính là vô lượng đạo lý; lời nói của Bồ Tát chính là vô lượng Kinh điển, nghe không giống như ngôn ngữ cổ thư nhưng không hề sai khác với ý Phật.
Bồ Tát thực hành Bát Nhã như thế nên thành tựu vô lượngcông đức. Những công đức này  khiến cho Bồ Tát trở nên một vị Thánh đầy uy lực, không một chướng ngại nào, khổ nạn nào có thể xâm phạm được nữa. Bồ Tát đạt được sự bình an vô hạn cả nội tâm và ngoại cảnh.
Chư Phật từ xưa đến nay hay sau này đều thực hành Bát Nhã như thế, thành tựu Chánh Định như thế, có được tự tại như thế, giáo hóa chúng sinh như thế để đắc thành Vô Thượng Chánh Đẳng Chánh Giác.
Thần lực phi thường của Phật và Đại Bồ Tát có thể cứu giúp chúng sinh qua khỏi khổ nạn cấp thời để chúng sinh có cơ hội tu tập và gây tạo phước lành đền bù ác nghiệp quá khứ.

<h3>NGUYỆN HƯƠNG</h3>
<pre>Kiếp người như ngọn nến lung linh

<h3>TÁN THÁN PHẬT (chuông khánh)</h3>
<pre>Đấng Pháp vương vô thượng
Ba cõi chẳng ai bằng

Ức kiếp vẫn không cùng. O

<h3>KINH HẠNH NGƯỜI XUẤT GIA</h3>
<pre>Con đã nghe như vầy
giữa thế gian triền phược
Đức Như Lai ra đời
là bậc A La Hán
là vị Phật Thế Tôn
sau khi đã chứng ngộ
Ngài tuyên giảng con đường
đưa đến bờ giải thoát. O

Rồi một người cư sĩ
dù thuộc giai cấp nào
sau khi nghe pháp ấy
khởi lên lòng kính ngưỡng
đối với đức Như Lai
tự nghĩ sống ở đời
đầy những điều ràng buộc
bụi bặm và khổ đau
khó thể nào đạt được
hạnh thanh tịnh hoàn toàn
trắng trong như vỏ ốc
chỉ đời sống xuất gia
phóng khoáng như hư không
mới có thể giúp ta
đến bến bờ giải thoát. O

Rồi vị ấy từ bỏ
tài sản và gia đình
khoác Ca-sa cạo tóc
làm một vị Sa-môn.
Sau khi đã xuất gia
vị ấy sống chế ngự
bằng giới bổn Mộc-xoa (Mokkha)
đủ oai nghi Chánh Hạnh.
Vị ấy thấy nguy hiểm
trong từng lỗi nhỏ nhặt
lời nói và việc làm
luôn giữ gìn thanh tịnh,
thủ hộ các giác quan
không đắm nhiễm bên ngoài,
sống cuộc đời thanh bai
giản đơn và tri túc. O

Thế nào là Tỳ kheo
có giới hạnh cụ túc?
Đó là một Tỳ kheo
đã từ bỏ sát sanh
xa lìa các vũ khí
và thương yêu tất cả.
Đó là vị Tỳ kheo
đã từ bỏ gian tham

không mong nhiều sở hữu. O

Đó là vị Tỳ kheo

phạm hạnh được giữ gìn
trắng trong và trọn vẹn.

tránh xa sự nói dối
chỉ nói bằng sự thật
cho những người đáng nghe.
Không nói lời chia rẽ
làm thù hận phát sinh
chỉ nói lời hòa vui
để yêu thương xuất hiện. O

Vị ấy không bao giờ
nói lên lời ác độc
chỉ nói lời từ ái
tao nhã đẹp lòng người.
Vị ấy cũng tránh xa
những lời nói khoe khoang
hơn thua và hiếu thắng
để gìn giữ khiêm cung. O

Đó là vị Tỳ kheo
biết tôn trọng cỏ cây
biết giữ gìn sự sống
của tất cả mọi loài.
Không ăn uống phi thời
không dự xem nhạc kịch
Từ bỏ các vòng hoa
hương thơm và vàng bạc. O

Vị ấy cũng khước từ
chăn nuôi và buôn bán
tôi tớ và đất đai
tham lam hay lừa đảo.
Vị Tỳ kheo như thế
tâm bình thản an vui
không ăn năn lo sợ
vì không phạm lỗi lầm. O

Rồi vị Tỳ kheo ấy
gìn giữ các giác quan
không đắm theo ngoại cảnh
dù ít hay là nhiều.
Vị ấy luôn tự xét
từ một nguyên nhân nào
khiến tâm chìm theo cảnh
để mà tự khắc phục.
Vị Tỳ kheo như thế
tâm tự tại an vui
không tối tăm vẩn đục
vì không nhiễm thế trần. O

Rồi vị Tỳ kheo ấy
khi đi tới, đi lui
khi nhìn quanh, nhìn thẳng
đều rõ ràng tỉnh giác
thường hằng kiểm soát tâm.
Khi co tay, duỗi tay
khi đắp y, mang bát
đều rõ ràng tỉnh giác
thường hằng kiểm soát tâm. O

Khi uống ăn nhai nuốt
khi đi đứng nằm ngồi
khi lặng yên, lên tiếng
đều rõ ràng tỉnh giác
thường hằng kiểm soát tâm.
Từ bao nhiêu công hạnh
của một người xuất gia
như giữ gìn giới luật
sống đời sống giản đơn
thủ hộ các giác quan
và tinh tấn Chánh Niệm.
Vị Tỳ kheo như thế
sẽ tìm chốn hoang vu

hoặc hang núi, chòi tranh
ngồi như một đóa sen
thẳng lưng và bất động
với Chánh Niệm rạng ngời
rõ ràng ngay trước mắt. O

Rồi từ một nội tâm

tham ái được diệt trừ
sân hận được vượt qua
lòng từ mẫn bao la
thương yêu cho tất cả.
Rồi từ một nội tâm
sáng trong và yên tĩnh
nên hôn trầm, trạo hối
và do dự lìa xa
Như một người thoát ra
khỏi gông cùm xiềng xích
như một người vượt qua
khỏi sa mạc khô khan
gặp dòng sông nước mát
cũng vậy, Tỳ kheo ấy
diệt năm triền cái rồi
được hân hoan hạnh phúc. O

Từ niềm hân hoan trên

Bất thiện pháp xa lìa
Sơ thiền được chứng đạt.
Đó là một trạng thái
tham dục được vượt qua

Không tự mãn Sơ thiền
Tỳ kheo ấy nhiếp tâm
diệt trừ niệm vi tế
và chứng đạt Nhị thiền.
Đó là một trạng thái
hỷ lạc do định sanh
rất thênh thang mầu nhiệm
tâm cực kỳ yên tĩnh. O

Không tự mãn Nhị thiền
Tỳ kheo ấy nhiếp tâm
dừng hoạt động giác quan
để chứng đạt Tam thiền.
Đó là một trạng thái
vào Chánh Định rất sâu
với an lạc vi diệu
tận cùng không bờ bến.
Không tự mãn Tam thiền
Tỳ kheo ấy nhiếp tâm
trừ mọi cảm thọ trước
để chứng đạt Tứ thiền.
Đó là một trạng thái
đã bất động hoàn toàn
không cảm thọ khổ vui
và vô cùng sáng suốt. O

Rồi từ một nội tâm
đã bất động hoàn toàn
Tỳ kheo ấy hướng tâm
nhớ về vô lượng kiếp
qua từng chỗ thọ sanh
với giai cấp, dòng họ
khổ vui và tên tuổi
rất chi tiết rõ ràng
và như vậy, Vị ấy
thành tựu Túc Mạng Minh.
Rồi từ một nội tâm
đã bất động hoàn toàn
Tỳ kheo ấy hướng tâm
xem chúng sanh lưu chuyển
qua mỗi kiếp luân hồi
nhận quả báo khổ vui
theo nghiệp duyên thiện ác
không một chút sai lầm
và như vậy, Vị ấy
thành tựu Thiên Nhãn Minh. O

Rồi từ một nội tâm
đã bất động hoàn toàn
Trí tuệ được khởi lên
vô minh được chấm dứt.
Vị ấy biết rõ ràng
như thế nào là Khổ
hay Nguyên Nhân Của Khổ
thế nào là Giải Thoát
và Đường Về Giải Thoát
và như vậy, Vị ấy
chứng đạt Lậu Tận Minh.
Từ Chánh Trí như trên
Vị ấy tự biết mình
đã dừng lại Luân hồi
đã viên thành Phạm hạnh
đã hoàn toàn giải thoát. O

<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b>
</pre>
<h3>KINH SỐNG HÒA HỢP</h3>
<pre>
Con từng nghe như vầy
Có một thời Thế Tôn
Ở tại Na-di-ka
đi đến thăm khu rừng
trồng nhiều cây Tala
tên gọi Go-sin-ga. O

Ở đó có ba Thầy
Thầy A-nu-rud-dha
với Thầy Nan-di-ya
và Thầy Kim-bi-la
đang cùng sống chung nhau
tu tập trong an lành
Thấy Thế Tôn từ xa,
ba Thầy lo tiếp đón

người sửa soạn chỗ ngồi

Rồi đảnh lễ cung kính
xong, ngồi xuống một bên. O

Thế Tôn mở lời hỏi:

Cuộc sống ở nơi đây

hằng ngày đi khất thực
có mệt nhọc lắm chăng?
các Thầy đã sống chung
có thật sự hòa hợp
như thể nước với sữa,
lòng hoan hỷ tràn đầy
không hề tranh cãi chăng? O

thật sự là như vậy.
chúng con sống an lành
cảm thấy rất yên vui
đi khất thực dễ dàng
chúng con rất hòa hợp
nói lời thuận thảo nhau
tràn đầy niềm hoan hỷ. O

Thế Tôn khen, hỏi tiếp:
- Các Thầy bằng cách nào
thực hiện đời sống ấy?
- Kính bạch Đức Thế Tôn!

thật vô cùng lợi ích
khi chúng con sống chung
với bạn đồng phạm hạnh
nên xử sự với nhau
dù trước mặt, sau lưng
vẫn một mực tốt đẹp
vẫn một niềm quý trọng
ở trong từng việc làm
ở trong từng lời nói
ngay cả trong suy nghĩ. O

Kính bạch Đức Thế Tôn!
Chúng con đã thật sự
từ bỏ tâm ý mình
để sống tùy thuận theo
tâm của bạn đồng tu.
Vì thực hiện như thế
chúng con tuy khác thân
mà tâm vẫn tương đồng.
Do “khác thân, giống tâm”
nên chúng con nhìn nhau
trong ánh mắt thiện cảm
vui sống ở bên nhau
không một lời tranh cãi
như nước sữa hợp hòa. O

- Này, các thầy Tỳ kheo
đời sống của các Thầy
có nhiệt tâm, tinh cần
không hề phóng dật chăng?
- Kính bạch Đức Thế Tôn!
Chúng con sống như sau:
ai khất thực về trước
lo soạn sẵn nước uống
soạn cả nước rửa chân
bớt phần ăn của mình
dành cho người về muộn. O

Ai khất thực về sau
có thể dùng, nếu cần
sau đó, sẽ xếp dọn
mọi thứ cho gọn gàng.
Khi cần được giúp đỡ,
chúng con chỉ đưa tay

Lời nói chỉ được dùng
đàm luận chuyện đạo pháp
vào những lúc thích hợp
nhằm chia sẻ cho nhau
điều chúng con tu tập. O

Thế Tôn hết lời khen,
tiếp tục hỏi các Thầy,
- Này, các thầy Tỳ kheo
các Thầy có thể nào
chứng được pháp cao thượng
được tri kiến thánh nhân
được thoải mái an lạc
với cuộc sống như thế? O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con sẽ nhiếp tâm
lìa xa các ham muốn
lìa xa các vọng tưởng
không khởi Tham Sân Si
để trú Thiền thứ nhất.28
Đó là tâm an ổn
với hỷ được phát sinh
dùng chút ý nhỏ nhiệm
thường hằng kiểm soát tâm. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
lúc chúng con nhiếp tâm
ý thức của chúng con
sẽ đạt đến bất động
để trú Thiền thứ hai.
Đó là tâm an định
với hỷ lạc phát sinh
dù không còn kiểm soát
tâm ý chẳng lung lay. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con sẽ nhiếp tâm
để trú Thiền thứ ba.
Đó là tâm thanh tịnh
với an lạc vi diệu
và tỉnh giác hoàn toàn
sâu vào trong Chánh Định
tâm Sở đắc tan biến. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con sẽ nhiếp tâm
vượt các lớp tâm thức
để trú Thiền thứ tư.
Đó là một trạng thái
đã bất động hoàn toàn
không cảm thọ khổ vui
và vô cùng sáng suốt. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con hướng tâm về
hư không rộng vô biên
với tâm rộng vô lượng
không chi phối bởi Tưởng
để trú định thứ nhất
là Không Vô Biên Xứ. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con trải cái biết
phủ trùm không bến bờ
để trú định thứ hai

<h3>THÁNH TRÍ BÁT NHÃ</h3>

<h3>THÁNH TRÍ BÁT NHÃ</h3>
<pre>Khi Bồ Tát Quán Tự Tại thành tựu được Chánh Định thẳm sâu, phát sinh trí tuệ Bát Nhã vi diệu, liền thấy thân tâm năm uẩn này trống rỗng, không quan trọng nữa, và ngay đó vượt qua tất cả đau khổ.
Này Xá Lợi Phất, Bồ Tát thành tựu được Chánh Định vĩ đại an lành nên không còn chấp vào sắc thân, tự tại đối với sắc thân;
không còn bị chi phối bởi cảm giác, tự tại đối với cảm giác; không còn vướng mắc nơi tâm tưởng, tự tại đối với tâm tưởng; không còn lệ thuộc vào tâm năng, tự tại đối với tâm năng; không còn bị giới hạn bởi cái biết, tự tại đối với cái biết.
Này Xá Lợi Phất, với sự tự tại an lành như thế, Bồ Tát đi vào sinh tử mang hạnh nguyện hóa độ chúng sinh. Khi ở trong sinh tử, Bồ Tát không bị dính mắc bởi bất cứ điều gì, không cần bất cứ điều gì, không xao động theo bất cứ sự biến dịch nào của cuộc đời. Bồ Tát đến với chúng sinh bằng tâm từ bi vô hạn, không phân biệt kẻ sang người hèn, kẻ dở người hay, thậm chí thương yêu cả kẻ xấu ác để tìm cách hóa độ. Bồ Tát sẽ phải chấp nhận mọi điều tôn vinh hay nhục mạ, vinh quang hay cay đắng một cách bình thản. Dũng lực của Bồ Tát là vô biên vô hạn.
Bồ Tát sẽ tùy theo tâm tình, sở thích, ngôn ngữ của chúng sinh mà tìm cách hóa độ chứ không chấp cứng vào văn tự Kinh điển vì cả cuộc sống của Bồ Tát là một bài Kinh thiêng liêng bất tận; những việc làm của Bồ Tát là tấm gương sáng ngời, ngay cả một cái nhìn hay sự im lặng của Bồ Tát cũng như sấm sét có thể làm thay đổi tâm hồn người đối diện.
Tâm của Bồ Tát chính là vô lượng đạo lý; lời nói của Bồ Tát chính là vô lượng Kinh điển, nghe không giống như ngôn ngữ cổ thư nhưng không hề sai khác với ý Phật.
Bồ Tát thực hành Bát Nhã như thế nên thành tựu vô lượngcông đức. Những công đức này  khiến cho Bồ Tát trở nên một vị Thánh đầy uy lực, không một chướng ngại nào, khổ nạn nào có thể xâm phạm được nữa. Bồ Tát đạt được sự bình an vô hạn cả nội tâm và ngoại cảnh.
Chư Phật từ xưa đến nay hay sau này đều thực hành Bát Nhã như thế, thành tựu Chánh Định như thế, có được tự tại như thế, giáo hóa chúng sinh như thế để đắc thành Vô Thượng Chánh Đẳng Chánh Giác.
Thần lực phi thường của Phật và Đại Bồ Tát có thể cứu giúp chúng sinh qua khỏi khổ nạn cấp thời để chúng sinh có cơ hội tu tập và gây tạo phước lành đền bù ác nghiệp quá khứ.
Phải biết Bát Nhã là bờ bến hiền lành an ổn, là thuyền to lớn giữa biển sóng lao xao, là ánh sáng soi rọi giữa đêm đen mờ mịt, là sự cao thượng vượt hơn mọi điều cao thượng trên đời.

Kẻ ngất trời tham vọng
Tìm quyền lực bao la
Mọi cái thuộc về ta
Để chỉ tay sai khiến.

Bản ngã này phủ hết
Ý nghĩ này của tôi
Danh dự này của tôi
Quyến thân hay phe phái.

Cả trong cùng một đạo
Cũng phân biệt từng chùa
Dòng phái hay tông môn
Để mà xa mà cách.

Tưởng mình đã thành Phật
Khi chứng đạt nội tâm
Rất định tĩnh hư vô
Đâu ngờ đầy bản ngã. O

Hai hạng người đáng kính
Một diệt ngã chấp rồi
Được giải thoát cao vời
Thánh nhân A la hán

Hai là người khao khát
Tìm vô ngã sâu xa
Cẩn thận với cái Ta
Để tránh điều tội lỗi.

Phật dạy tìm Vô ngã
Trước hết là quán thân
Khối Tứ Đại vô thường
Chịu sinh già bệnh chết.

Chết rồi thân mục rữa
Còn lại chút xương tàn
Xương thành bụi bay đi
Tan vào trong gió thoảng.

Kế đó quán Năm Uẩn
Hợp lại thành thân tâm
Từ cảm xúc tình thâm
Đến vô biên cái Biết.

Giác tri hay tình cảm
Quyện chặt lại với nhau
Thành bản ngã thẳm sâu
Với Vô minh phiền não.

Hiểu cái Ta như thế
Hành giả gắng khiêm cung
Thường tự nhủ trong lòng
Mình chỉ là đất bụi.

Những khi tâm tỉnh giác
Không được tự khen mình
Mà càng phải nhớ rằng
Mình chỉ là đất bụi. O

Nguyện khởi tâm yêu quý
Hết tất cả chúng sinh
Bởi lẽ tâm từ bi
Giúp diệt trừ bản ngã.

Nguyện tận cùng tuyệt đối
Tôn kính Phật Pháp Tăng
Dù thịt nát xương tan
Muôn đời không thay đổi.

Rất siêng năng tạo phúc
Nhưng kín đáo khiêm cung
Không kiêu mạn chấp công
Để đủ đầy công đức.

Khi thấy ai tài đức
Lòng tán thán vui mừng
Diệt đố kỵ nhỏ nhen
Để cùng vui hưởng phúc.

Không sống đời nhàn rỗi
Lo giáo hóa độ sinh
Mong tất cả chúng sinh
Đều quy y Tam Bảo.

Nguyện rời xa thương ghét
Chẳng thiên vị riêng tư
Chỉ giữ tâm từ bi
Để tung bay giải thoát. O

Đến viếng thăm gặp gỡ
Cả những người chưa quen
Để được kết duyên lành
Dẫn đường về Phật Pháp.

Diệt bản năng hưởng thụ
Tránh dục lạc tầm thường
Vì dục lạc thế gian
Chỉ làm tăng ngã chấp.

Thường vâng lời nhu thuận
Không cố chấp ý mình
Không bướng bỉnh hung hăng
Để không tăng ngã chấp.

Thường lo cho người trước
Mà ít lo cho mình
Nếu phải lo cho mình
Cũng chỉ vì đại sự.

Không cúi luồn xu nịnh
Không khiếp nhược ươn hèn
Chỉ cung kính cúi đầu
Trước những điều cao thượng.

Việc thiện dù rất nhỏ
Cũng cố gắng để làm
Bòn từng chút phước duyên
Để đi về giải thoát.

Việc bậy dù rất nhỏ
Cũng cố gắng lìa xa
Tránh từng chút lỗi lầm
Để đi về giải thoát. O

Lúc nào cũng an trú
Cảm giác khắp toàn thân
Để biết thân Vô thường
Mở đường vào chánh niệm.

Khi tâm hơi yên tĩnh
Ngồi bất động kiết già
Xem hơi thở vào ra
Để lắng tâm vào định.

Biết thân này đang thở
Thân thở vào thở ra
Là từng bước về xa
Trên con đường Vô Ngã.

Bốn tầng bậc thiền định
Rất vi diệu nhiệm mầu
Cảnh giới lạ chưa từng
Dễ lầm là xong việc.

Hành giả nhờ công đức
Tôn kính Phật vô biên
Nên thôi thúc tiến lên
Đến tận cùng Vô ngã.

Từ Vô minh Chấp ngã
Đến giải thoát hoàn toàn
Không thể tính thời gian
Bằng bao nhiêu năm tháng.

Nguyện lòng là đi mãi
Dù vạn kiếp nghìn đời
Tinh tấn chẳng hề vơi
Trên con đường thánh đạo.

Nguyện Kinh Vô Ngã Tướng
Đến khắp cả chúng sinh
Đều trì tụng thực hành
Để chứng thành quả thánh

Nguyện ai lòng tin hiểu
Gắng trì tụng thực hành
Được rất nhiều phúc lành
Tam bảo thường gia hộ

Nguyện cho khắp pháp giới
Cùng tinh tấn tu hành
Thoát chấp ngã vô minh
Đồng viên thành Phật đạo. O
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b></pre></div>`

            { 
                id: 92, 
                title: "KINH TỪ TÂM", 
                type: 'sub',
                content: `<div class="section-block"><h3>KINH TỪ TÂM</h3><pre>Con từng nghe kể như vầy
Một thời, Xá Vệ, tại ngay Kỳ Hoàn
Thế Tôn cho gọi chúng Tăng
Các Thầy cung kính thưa vâng đáp lời. O

Thế Tôn dạy chuyện ở đời
Liên quan tu tập nên người từ tâm
Là người rất đỗi ân cần
Thương yêu trải khắp kẻ gần người xa
Tấm lòng nhân ái bao la
Thật là thuần khiết, thật là cao thâm
Hướng về tất cả chúng sinh
Người từ tâm trọn quên mình mà thương. O

Không vì ái luyến vấn vương
Không vì mong đợi chút đường lợi danh
Không vì ân nghĩa riêng dành
Không vì cân nhắc với mình lạ quen
Thương người quen lẽ tất nhiên
Cũng thương những kẻ chưa quen bao giờ
Xóa đi ngăn cách lạ xa
Xóa đi ngần ngại hững hờ bấy lâu. O

Tình thương lan tỏa đến đâu
Giúp xây nơi ấy nhịp cầu cảm thông
Người từ tâm đủ bao dung
Đủ lòng độ lượng, đủ lòng thương yêu
Với người mưu hại đủ điều
Bất nhân, ác cảm, gây bao hận thù
Người từ tâm trước như sau
Trải lòng ra mãi đậm sâu thương người. O

Với người oán ghét bao đời
Nguồn thương yêu ấy làm vơi tị hiềm
Chuyện không hay chẳng trách phiền
Cho vơi bớt những nghiệp duyên với người
Người từ tâm trước muôn loài
Đem lòng thương xót cảnh đời không may
Thương người sống kiếp đọa đày
Làm thân cầm thú nghiệp gây chẳng lành
Hoặc loài ngạ quỷ vô hình
Hoặc trong địa ngục tội tình vương mang. O

Từ tâm như ánh trăng ngàn
Dịu dàng soi thấu mọi đường trầm luân
Ở đâu có chúng hữu tình
Thì nơi ấy có từ tâm hướng về
Như tàn lá mát rộng che
Chúng sanh vô lượng tâm từ vô biên
Tâm từ như suối triền miên
Thấm vào mạch sống mọi miền an vui
Tâm từ làm gốc vun bồi
Cho người cao thượng cho đời thăng hoa. O

Thấy người khổ nạn khó qua
Lòng mình đau xót như là khổ chung
Thấy người hạnh phúc thành công
Lòng mình vui sướng như cùng vui theo
Thấy người lầm lỗi ít nhiều
Lòng mình tha thứ mến trìu càng hơn
Người từ tâm sống vẹn tròn
Thương yêu bình đẳng sắt son bền lòng
Cho dù không ước không mong
Phước lành tự đến do công đức thành. O

Một là ngủ được an lành
Bởi lòng mình đã chân thành thương yêu
Bởi không lừa lọc dệt thêu
Bởi không toan tính lắm điều chua ngoa
Tâm mình không gợn xấu xa
Tham lam, sân hận, si mê mịt mờ
Đầu hôm đến lúc tinh mơ
Khổ ưu lặng tắt thới thơ giấc nồng. O

Hai là rời bước khỏi giường
Lòng mình một mực bình thường yên vui
Khi đi đứng, lúc nằm ngồi
Không còn tiếc nhớ, đua đòi, ước ao
Từ tâm hóa giải đẹp sao
Muộn phiền, sân hận tan vào hư không
Lòng mình luôn giữ trắng trong
Nguồn an lạc trải tựa đồng bao la. O

Ba là từ ái lan xa
Làm cho cảm ứng chan hòa rộng theo
Ai ai cũng thấy mến yêu
Đem lòng ngưỡng mộ người nêu tâm từ
Bốn là loài chẳng phải người
Một khi cảm nhận biết người từ tâm
Cũng dành cho những tình thâm
Hộ trì người được những thành tựu vui. O

Năm là thiên chúng cõi trời
Xưa kia tu tập nên người từ tâm
Thấy người nào tính ai lân
Nay theo gia hộ để cùng tiến tu
Sáu là hiểm nạn đang chờ
Dầu sôi lửa bỏng mịt mờ kiếm cung
Cùng bao nhiêu thứ độc trùng
Không sao xâm phạm đến vùng trú thân. O

Bảy do huân tập từ tâm
Thác sanh phạm chúng làm dân cõi trời
Được nhiều phước báo tuyệt vời
Và tâm từ được trau giồi hơn thêm
Tám là đầy đủ thiện duyên
Người từ tâm biết thường xuyên chuyên cần
Làm cho đức hạnh được thuần
Thành vườn ruộng tốt gieo trồng đại bi. O

Đượm nhuần vô ngã vô si
Con đường giải thoát bước đi thêm gần
Khéo an trú, khéo tác thành
Thân tâm an ổn, vững vàng lắng sâu
Tâm từ khi được khéo tu
Làm cho kiết sử bị mau yếu dần
Không còn dấu vết tham sân
Niết Bàn hiển lộ thênh thang giữa đời
Thế Tôn thuyết giảng mấy lời
Các Thầy vui nhận, tin, rồi làm theo. O

<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b></pre></div>`

            { 
                id: 93, 
                title: "KINH SỐNG HOÀ HỢP", 
                type: 'sub',
                content: `<div class="section-block"><h3>KINH SỐNG HOÀ HỢP</h3><pre>Con từng nghe như vầy
Có một thời Thế Tôn
Ở tại Na-di-ka
đi đến thăm khu rừng
trồng nhiều cây Tala
tên gọi Go-sin-ga. O

Ở đó có ba Thầy
Thầy A-nu-rud-dha
với Thầy Nan-di-ya
và Thầy Kim-bi-la
đang cùng sống chung nhau
tu tập trong an lành
Thấy Thế Tôn từ xa,
ba Thầy lo tiếp đón
người đỡ lấy y bát
người sửa soạn chỗ ngồi
người đem nước rửa chân.
Rồi đảnh lễ cung kính
xong, ngồi xuống một bên. O

Thế Tôn mở lời hỏi:
- Này, các Thầy Tỳ kheo
Cuộc sống ở nơi đây
an lành, yên vui chăng?
hằng ngày đi khất thực
có mệt nhọc lắm chăng?
các Thầy đã sống chung
có thật sự hòa hợp
như thể nước với sữa,
lòng hoan hỷ tràn đầy
không hề tranh cãi chăng? O

Khi nghe hỏi như vậy,
ba Thầy đã thưa rằng:
- Kính bạch Đức Thế Tôn!
thật sự là như vậy.
chúng con sống an lành
cảm thấy rất yên vui
đi khất thực dễ dàng
chúng con rất hòa hợp
nói lời thuận thảo nhau
tràn đầy niềm hoan hỷ. O

Thế Tôn khen, hỏi tiếp:
- Các Thầy bằng cách nào
thực hiện đời sống ấy?
- Kính bạch Đức Thế Tôn!
Chúng con hiểu được rằng
thật vô cùng lợi ích
khi chúng con sống chung
với bạn đồng phạm hạnh
nên xử sự với nhau
dù trước mặt, sau lưng
vẫn một mực tốt đẹp
vẫn một niềm quý trọng
KINH SỐNG HÒA HỢP
ở trong từng việc làm
ở trong từng lời nói
ngay cả trong suy nghĩ. O

Kính bạch Đức Thế Tôn!
Chúng con đã thật sự
từ bỏ tâm ý mình
để sống tùy thuận theo
tâm của bạn đồng tu.
Vì thực hiện như thế
chúng con tuy khác thân
mà tâm vẫn tương đồng.
Do “khác thân, giống tâm”
nên chúng con nhìn nhau
trong ánh mắt thiện cảm
vui sống ở bên nhau
không một lời tranh cãi
như nước sữa hợp hòa. O

- Này, các thầy Tỳ kheo
đời sống của các Thầy
có nhiệt tâm, tinh cần
không hề phóng dật chăng?
- Kính bạch Đức Thế Tôn!
Chúng con sống như sau:
ai khất thực về trước
lo soạn sẵn nước uống
soạn cả nước rửa chân
bớt phần ăn của mình
dành cho người về muộn. O

Ai khất thực về sau
có thể dùng, nếu cần
sau đó, sẽ xếp dọn
mọi thứ cho gọn gàng.
Khi cần được giúp đỡ,
chúng con chỉ đưa tay
ra hiệu chứ không nói.
Lời nói chỉ được dùng
đàm luận chuyện đạo pháp
vào những lúc thích hợp
nhằm chia sẻ cho nhau
điều chúng con tu tập. O

Thế Tôn hết lời khen,
tiếp tục hỏi các Thầy,
- Này, các thầy Tỳ kheo
các Thầy có thể nào
chứng được pháp cao thượng
được tri kiến thánh nhân
được thoải mái an lạc
với cuộc sống như thế? O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con sẽ nhiếp tâm
lìa xa các ham muốn
lìa xa các vọng tưởng
không khởi Tham Sân Si
để trú Thiền thứ nhất.28
Đó là tâm an ổn
với hỷ được phát sinh
dùng chút ý nhỏ nhiệm
thường hằng kiểm soát tâm. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
lúc chúng con nhiếp tâm
ý thức của chúng con
sẽ đạt đến bất động
để trú Thiền thứ hai.
Đó là tâm an định
với hỷ lạc phát sinh
dù không còn kiểm soát
tâm ý chẳng lung lay. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con sẽ nhiếp tâm
để trú Thiền thứ ba.
Đó là tâm thanh tịnh
với an lạc vi diệu
và tỉnh giác hoàn toàn
sâu vào trong Chánh Định
tâm Sở đắc tan biến. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con sẽ nhiếp tâm
vượt các lớp tâm thức
để trú Thiền thứ tư.
Đó là một trạng thái
đã bất động hoàn toàn
không cảm thọ khổ vui
và vô cùng sáng suốt. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con hướng tâm về
hư không rộng vô biên
với tâm rộng vô lượng
không chi phối bởi Tưởng
để trú định thứ nhất
là Không Vô Biên Xứ. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con trải cái biết
phủ trùm không bến bờ
để trú định thứ hai
là Thức Vô Biên Xứ. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
tâm lượng càng rộng mở
vượt thoát mọi đối tượng
sai biệt trong Pháp Giới
thấy rõ “không có gì”
để trú định thứ ba
là Vô Sở Hữu Xứ. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con vượt ra khỏi
Vô Sở Hữu Xứ Định
dùng tâm vô lượng ấy
thấy biết cả Pháp Giới
để trú định thứ tư
Phi Tưởng Phi Phi Tưởng. O

- Kính bạch Đức Thế Tôn!
Nếu như chúng con muốn
chúng con sẽ tiếp tục
an trú Diệt Tận Định
thể tĩnh lặng tuyệt đối
từ đó, với Trí tuệ
thấy biết đúng như thật
mà đoạn trừ vô minh. O

- Kính bạch Đức Thế Tôn!
Đó là hạnh phúc lớn
là an trú tối thượng
chúng con cùng thành tựu
không thấy hạnh phúc nào
bằng hạnh phúc ấy cả.
- Này, các Thầy Tỳ kheo
Các Thầy đã thật sự
có hạnh phúc tuyệt vời
đã biết sống hòa hợp
giữa huynh đệ với nhau. O

Sau khi đã ngợi khen
Đức Thế Tôn ra về
các Thầy ngồi quanh nhau
thầy A-nu-rud-dha
lên tiếng rằng: - Chẳng ai
nói về điều sở đắc
về quả vị chứng đạt
nhưng tâm Tôi vẫn biết
tâm huynh đệ như thế
mà bạch cùng Thế Tôn
mọi chuyện rất rõ ràng. O

Lúc đó, có Dạ xoa
tên Pa-ra-ja-na
đến chỗ Thế Tôn ở
đảnh lễ và tán thán
sự có mặt của Người
cùng với các Thầy đây
đem hạnh phúc lợi ích
cho dân chúng Vaj-ji
đồng thời, các cõi trời
cùng chung nhau ca ngợi
Thế Tôn và các Thầy. O

Thế Tôn bảo Dạ xoa:
- Này Di-gha hãy nhớ
nếu ai trong loài Trời
cũng như trong loài người
nhớ đến ba Thầy đây
với tâm niệm hoan hỷ30
với tâm niệm cung kính
là tạo công đức lớn
người đó sẽ an lạc
sẽ hạnh phúc lâu dài. O

Hãy nhìn xem ba Thầy
đã sống như thế nào
để thể hiện trọn vẹn
“lòng thương tưởng chúng sanh
vì an lạc, hạnh phúc
loài Trời và loài người”
Được Thế Tôn chỉ dạy
Dạ xoa rất vui mừng
tin nhận và làm theo
cuộc sống khéo hòa hợp
gương mẫu nhất trên đời. O
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b></pre></div>` 
            },
            { 
                id: 94, 
                title: "KINH HẠNH NGƯỜI XUẤT GIA", 
                type: 'sub',
                content: `<div class="section-block"><h3>KINH HẠNH NGƯỜI XUẤT GIA</h3><pre>Con đã nghe như vầy
giữa thế gian triền phược
Đức Như Lai ra đời
là bậc A La Hán
là vị Phật Thế Tôn
sau khi đã chứng ngộ
Ngài tuyên giảng con đường
đưa đến bờ giải thoát. O

Rồi một người cư sĩ
dù thuộc giai cấp nào
sau khi nghe pháp ấy
khởi lên lòng kính ngưỡng
đối với đức Như Lai
tự nghĩ sống ở đời
đầy những điều ràng buộc
bụi bặm và khổ đau
khó thể nào đạt được
hạnh thanh tịnh hoàn toàn
trắng trong như vỏ ốc
chỉ đời sống xuất gia
phóng khoáng như hư không
mới có thể giúp ta
đến bến bờ giải thoát. O

Rồi vị ấy từ bỏ
tài sản và gia đình
khoác Ca-sa cạo tóc
làm một vị Sa-môn.
Sau khi đã xuất gia
vị ấy sống chế ngự
bằng giới bổn Mộc-xoa (Mokkha)
đủ oai nghi Chánh Hạnh.
Vị ấy thấy nguy hiểm
trong từng lỗi nhỏ nhặt
KINH HẠNH NGƯỜI XUẤT GIA
lời nói và việc làm
luôn giữ gìn thanh tịnh,
thủ hộ các giác quan
không đắm nhiễm bên ngoài,
sống cuộc đời thanh bai
giản đơn và tri túc. O

Thế nào là Tỳ kheo
có giới hạnh cụ túc?
Đó là một Tỳ kheo
đã từ bỏ sát sanh
xa lìa các vũ khí
và thương yêu tất cả.
Đó là vị Tỳ kheo
đã từ bỏ gian tham
không trộm cắp của người
không mong nhiều sở hữu. O

Đó là vị Tỳ kheo
đã xa lìa tính dục
phạm hạnh được giữ gìn
trắng trong và trọn vẹn.
Đó là vị Tỳ kheo
tránh xa sự nói dối
chỉ nói bằng sự thật
cho những người đáng nghe.
Không nói lời chia rẽ
làm thù hận phát sinh
chỉ nói lời hòa vui
để yêu thương xuất hiện. O

Vị ấy không bao giờ
nói lên lời ác độc
chỉ nói lời từ ái
tao nhã đẹp lòng người.
Vị ấy cũng tránh xa
những lời nói khoe khoang
hơn thua và hiếu thắng
để gìn giữ khiêm cung. O

Đó là vị Tỳ kheo
biết tôn trọng cỏ cây
biết giữ gìn sự sống
của tất cả mọi loài.
Không ăn uống phi thời
không dự xem nhạc kịch
Từ bỏ các vòng hoa
hương thơm và vàng bạc. O

Vị ấy cũng khước từ
chăn nuôi và buôn bán
tôi tớ và đất đai
tham lam hay lừa đảo.
Vị Tỳ kheo như thế
tâm bình thản an vui
không ăn năn lo sợ
vì không phạm lỗi lầm. O

Rồi vị Tỳ kheo ấy
gìn giữ các giác quan
không đắm theo ngoại cảnh
dù ít hay là nhiều.
Vị ấy luôn tự xét
từ một nguyên nhân nào
khiến tâm chìm theo cảnh
để mà tự khắc phục.
Vị Tỳ kheo như thế
tâm tự tại an vui
không tối tăm vẩn đục
vì không nhiễm thế trần. O

Rồi vị Tỳ kheo ấy
khi đi tới, đi lui
khi nhìn quanh, nhìn thẳng
đều rõ ràng tỉnh giác
thường hằng kiểm soát tâm.
Khi co tay, duỗi tay
khi đắp y, mang bát
đều rõ ràng tỉnh giác
thường hằng kiểm soát tâm. O

Khi uống ăn nhai nuốt
khi đi đứng nằm ngồi
khi lặng yên, lên tiếng
đều rõ ràng tỉnh giác
thường hằng kiểm soát tâm.
Từ bao nhiêu công hạnh
của một người xuất gia
như giữ gìn giới luật
sống đời sống giản đơn
thủ hộ các giác quan
và tinh tấn Chánh Niệm.
Vị Tỳ kheo như thế
sẽ tìm chốn hoang vu
như gốc cây, khe suối
hoặc hang núi, chòi tranh
ngồi như một đóa sen
thẳng lưng và bất động
với Chánh Niệm rạng ngời
rõ ràng ngay trước mắt. O

Rồi từ một nội tâm
sáng trong và yên tĩnh
tham ái được diệt trừ
sân hận được vượt qua
lòng từ mẫn bao la
thương yêu cho tất cả.
Rồi từ một nội tâm
sáng trong và yên tĩnh
nên hôn trầm, trạo hối
và do dự lìa xa
Như một người thoát ra
khỏi gông cùm xiềng xích
như một người vượt qua
khỏi sa mạc khô khan
gặp dòng sông nước mát
cũng vậy, Tỳ kheo ấy
diệt năm triền cái rồi
được hân hoan hạnh phúc. O

Từ niềm hân hoan trên
Tâm càng thêm định tĩnh
Bất thiện pháp xa lìa
Sơ thiền được chứng đạt.
Đó là một trạng thái
tham dục được vượt qua
nên hỷ lạc tràn đầy
dù vẫn còn niệm tế.
Không tự mãn Sơ thiền
Tỳ kheo ấy nhiếp tâm
diệt trừ niệm vi tế
và chứng đạt Nhị thiền.
Đó là một trạng thái
hỷ lạc do định sanh
rất thênh thang mầu nhiệm
tâm cực kỳ yên tĩnh. O

Không tự mãn Nhị thiền
Tỳ kheo ấy nhiếp tâm
dừng hoạt động giác quan
để chứng đạt Tam thiền.
Đó là một trạng thái
vào Chánh Định rất sâu
với an lạc vi diệu
tận cùng không bờ bến.
Không tự mãn Tam thiền
Tỳ kheo ấy nhiếp tâm
trừ mọi cảm thọ trước
để chứng đạt Tứ thiền.
Đó là một trạng thái
đã bất động hoàn toàn
không cảm thọ khổ vui
và vô cùng sáng suốt. O

Rồi từ một nội tâm
đã bất động hoàn toàn
Tỳ kheo ấy hướng tâm
nhớ về vô lượng kiếp
qua từng chỗ thọ sanh
với giai cấp, dòng họ
khổ vui và tên tuổi
rất chi tiết rõ ràng
và như vậy, Vị ấy
thành tựu Túc Mạng Minh.
Rồi từ một nội tâm
đã bất động hoàn toàn
Tỳ kheo ấy hướng tâm
xem chúng sanh lưu chuyển
qua mỗi kiếp luân hồi
nhận quả báo khổ vui
theo nghiệp duyên thiện ác
không một chút sai lầm
và như vậy, Vị ấy
thành tựu Thiên Nhãn Minh. O

Rồi từ một nội tâm
đã bất động hoàn toàn
Trí tuệ được khởi lên
vô minh được chấm dứt.
Vị ấy biết rõ ràng
như thế nào là Khổ34
hay Nguyên Nhân Của Khổ
thế nào là Giải Thoát
và Đường Về Giải Thoát
và như vậy, Vị ấy
chứng đạt Lậu Tận Minh.
Từ Chánh Trí như trên
Vị ấy tự biết mình
đã dừng lại Luân hồi
đã viên thành Phạm hạnh
đã hoàn toàn giải thoát. O

<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b></pre></div>` 
            },
            { 
                id: 95, 
                title: "NHẤT DẠ HIỀN GIẢ", 
                type: 'sub',
                content: `<div class="section-block"><h3>NHẤT DẠ HIỀN GIẢ</h3><pre>Không truy tìm quá khứ
Không ước vọng tương lai
Quá khứ đã qua rồi
Tương lai lại chưa đến
Chỉ có pháp hiện tại
Tuệ quán chính là đây
Bất động chẳng lung lay
Hãy thực hành như thế O

Không một ai biết trước
Cái chết đến lúc nào
Tử thần có đợi đâu
Làm sao điều đình được
Vì thế nên nỗ lực
Tinh tấn suốt đêm ngày
Tỉnh giác từng phút giây
An trú bằng Chánh Niệm O

Như vậy mới xứng đáng
Người biết sống một mình
Kẻ ấy đã tôn vinh
Đạo nhiệm mầu vô thượng. O
</pre></div>` 
            },
            { 
                id: 96, 
                title: "CHÁNH NIỆM TRONG ĐỜI SỐNG", 
                type: 'sub',
                content: `<div class="section-block"><h3>CHÁNH NIỆM TRONG ĐỜI SỐNG</h3><pre>Tam Bảo gia hộ cho con
Lúc thức cũng như lúc ngủ
Ban ngày cũng như ban đêm
Luôn nhớ thân này vô thường.
Khi đi hoặc là khi đứng
Khi ngồi hoặc là khi nằm
Lúc làm việc hay nghỉ ngơi
Luôn nhớ thân này vô thường.
Khi nghe cũng như khi nói
Đông người hay ở một mình
Xem phim hay là đọc sách
Luôn nhớ thân này vô thường.
Lúc ăn cơm hay uống nước
Khi tắm rửa hay vệ sinh
Đắp y hay mang giày dép
Luôn nhớ thân này vô thường.
Những khi tâm con tỉnh giác
Càng nhớ thân này vô thường
Nguyện cho chúng sinh khắp chốn
Luôn biết thân này vô thường.
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b></pre></div>` 
            },
            { 
                id: 97, 
                title: "LỜI KHẤN NGUYỆN", 
                type: 'sub',
                content: `<div class="section-block"><h3>LỜI KHẤN NGUYỆN</h3><pre><b>Kính lạy Mười Phương Phật
Kính lạy Mười Phương Pháp
Kính lạy Mười Phương Tăng</b>
Xin chứng giám lòng con
Với tất cả tâm thành
Dâng lên lời khấn nguyện O

Xin cho con mãi mãi
Lòng tôn kính vô biên
Hơn núi biển mông mênh
Dâng lên Mười Phương Phật. O

Xin cho con mãi mãi
Lòng thương yêu không cùng
Trải thế giới Tam Thiên
Đến chúng sinh vô tận.
Xin cho khắp muôn loài
Sống yên lành bên nhau
Không ganh ghét oán thù
Không chiến tranh giết chóc.
Xin cho kẻ bất thiện
Biết tin có luân hồi
Có nghiệp báo trả vay
Để hồi đầu hướng thiện. O

Xin kẻ mù được sáng
Kẻ điếc lại được nghe
Kẻ nghèo được ấm no
Kẻ ốm đau bình phục.
Xin cho loài cầm thú
Thoát được nghiệp ngu si
Tái sinh vào cõi người
Biết tu theo Phật Pháp.
Các vong linh vất vưởng
Trong cõi giới u huyền
Thoát nghiệp đói triền miên
Quy y và siêu thoát. O

Xin cho nơi địa ngục
Chúng sinh đang đọa đày
Khởi được tâm từ bi
Để xa lìa cảnh khổ.
Cúi xin Mười Phương Phật
Chư Bồ Tát Thánh Hiền
Đem Chánh Pháp thiêng liêng
Sáng soi nghìn thế giới.
Cho chúng con mãi mãi
Dù sinh về nơi đâu
Đều gặp pháp nhiệm mầu
Để nương theo tu tập. O

Cho con biết khiêm hạ
Biết tôn trọng mọi người
Tự thấy mình nhỏ thôi
Việc tu còn kém cỏi.
Cho tay con rộng mở
Biết san sẻ cúng dường
Biết giúp đỡ yêu thương
Đến những người khốn khó.
Xin cho con bình thản
Trước nghịch cảnh cuộc đời
Dù bị mắng bằng lời
Hay bằng điều mưu hại. O

Xin tâm con sung sướng
Khi thấy người thành công
Hoặc gây tạo phước lành
Như chính con làm được.
Cho con biết im lặng
Không nói lỗi của người
Chỉ lặng lẽ dùng lời
Cầu cho người hết lỗi.
Xin vòng dây tham ái
Rời khỏi cuộc đời con
Để cho trái tim con
Biết yêu thương tất cả. O

Cúi lạy Mười Phương Phật
Đau khổ đã nhiều rồi
Vô lượng kiếp luân hồi
Đắng cay và mỏi mệt.
Nay con dâng lời nguyện
Giải thoát, quyết tìm về
Giác ngộ, quyết lìa mê
Độ sinh, đền ơn Phật.
Xin cho con giữ vững
Được chí nguyện tu hành
Không một phút buông lơi
Không một giờ xao lãng. O

Xin vẹn toàn giới hạnh
Với thiền định lắng sâu
Với trí tuệ nhiệm mầu
Xóa tan dần chấp ngã.
Xin cho con tỉnh táo
Không kiêu mạn tự hào
Dù tu tiến đến đâu
Vẫn tự tìm chỗ dở.
Nguyện cho con đi mãi
Không đứng lại giữa đường
Đến tuyệt đối vô biên
Tâm đồng tâm Chư Phật. O

Rồi trong muôn vạn nẻo
Của sinh tử luân hồi
Con mãi mãi không thôi
Độ sinh không dừng nghỉ.
Cúi lạy Mười Phương Phật
Xin chứng giám lòng con
Lời khấn nguyện sắt son
Dâng lên ngôi Tam Bảo. O

<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b></pre></div>` 
            },
            { 
                id: 98, 
                title: "THÁNH TRÍ BÁT NHÃ", 
                type: 'sub',
                content: `<div class="section-block"><h3>THÁNH TRÍ BÁT NHÃ</h3><pre>Khi Bồ Tát Quán Tự Tại thành tựu được Chánh Định thẳm sâu, phát sinh trí tuệ Bát Nhã vi diệu, liền thấy thân tâm năm uẩn này trống rỗng, không quan trọng nữa, và ngay đó vượt qua tất cả đau khổ.
Này Xá Lợi Phất, Bồ Tát thành tựu được Chánh Định vĩ đại an lành nên không còn chấp vào sắc thân, tự tại đối với sắc thân; không còn bị chi phối bởi cảm giác, tự tại đối với cảm giác; không còn vướng mắc nơi tâm tưởng, tự tại đối với tâm tưởng; không còn lệ thuộc vào tâm năng, tự tại đối với tâm năng; không còn bị giới hạn bởi cái biết, tự tại đối với cái biết.
Này Xá Lợi Phất, với sự tự tại an lành như thế, Bồ Tát đi vào sinh tử mang hạnh nguyện hóa độ chúng sinh. Khi ở trong sinh tử, Bồ Tát không bị dính mắc bởi bất cứ điều gì, không cần bất cứ điều gì, không xao động theo bất cứ sự biến dịch nào của cuộc đời. Bồ Tát đến với chúng sinh bằng tâm từ bi vô hạn, không phân biệt kẻ sang người hèn, kẻ dở người hay, thậm chí thương yêu cả kẻ xấu ác để tìm cách hóa độ. Bồ Tát sẽ phải chấp nhận mọi điều tôn vinh hay nhục mạ, vinh quang hay cay đắng một cách bình thản. Dũng lực của Bồ Tát là vô biên vô hạn.
Bồ Tát sẽ tùy theo tâm tình, sở thích, ngôn ngữ của chúng sinh mà tìm cách hóa độ chứ không chấp cứng vào văn tự Kinh điển vì cả cuộc sống của Bồ Tát là một bài Kinh thiêng liêng bất tận; những việc làm của Bồ Tát là tấm gương sáng ngời, ngay cả một cái nhìn hay sự im lặng của Bồ Tát cũng như sấm sét có thể làm thay đổi tâm hồn người đối diện.
Tâm của Bồ Tát chính là vô lượng đạo lý; lời nói của Bồ Tát chính là vô lượng Kinh điển, nghe không giống như ngôn ngữ cổ thư nhưng không hề sai khác với ý Phật.
Bồ Tát thực hành Bát Nhã như thế nên thành tựu vô lượngcông đức. Những công đức này  khiến cho Bồ Tát trở nên một vị Thánh đầy uy lực, không một chướng ngại nào, khổ nạn nào có thể xâm phạm được nữa. Bồ Tát đạt được sự bình an vô hạn cả nội tâm và ngoại cảnh.
Chư Phật từ xưa đến nay hay sau này đều thực hành Bát Nhã như thế, thành tựu Chánh Định như thế, có được tự tại như thế, giáo hóa chúng sinh như thế để đắc thành Vô Thượng Chánh Đẳng Chánh Giác.
Thần lực phi thường của Phật và Đại Bồ Tát có thể cứu giúp chúng sinh qua khỏi khổ nạn cấp thời để chúng sinh có cơ hội tu tập và gây tạo phước lành đền bù ác nghiệp quá khứ.
Phải biết Bát Nhã là bờ bến hiền lành an ổn, là thuyền to lớn giữa biển sóng lao xao, là ánh sáng soi rọi giữa đêm đen mờ mịt, là sự cao thượng vượt hơn mọi điều cao thượng trên đời.

<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b></pre></div>`

            { 
                id: 99, 
                title: "KHẨU QUYẾT TU THIỀN", 
                type: 'sub',
                content: `<div class="section-block"><h3>KHẨU QUYẾT TU THIỀN</h3><pre>
Thiền là điều phục tâm
Nhưng muốn điều phục tâm
Phải điều hòa hơi thở
Muốn điều hòa hơi thở
Phải điều hòa được thân
Cộng với phước vô ngần
Vì vậy lúc ban đầu
Trồng công đức thật sâu
Sống hiền lành chân chánh
Theo Thánh Đạo nhiệm mầu. O

Vào thiền ngồi kiết già
Đúng tư thế Phật Đà
Giữ toàn thân mềm mại
Và bất động sâu xa.
Khi vọng tưởng khởi lên
Khiến hiện tại bị quên
Lúc đó nhờ Công Đức
Giúp ta quay lại liền. O

Rồi trở lại Điều Thân
Xem khắp cả tay chân
Có chỗ nào gồng cứng
Hay nhúc nhích gì chăng
Rồi biết Thân Vô Thường
Ngày nào sẽ lên đường
Rã tan thành cát bụi
Xương thành bột bay luôn. O

Cứ kiên nhẫn Điều Thân
Không cần phải đi nhanh
Điều Thân thật thuần thục
Đường đạo đã đến gần
Rồi nhìn thấy trong thân
Có hơi thở vào ra
Để giữ gìn mạng sống
Không một phút lìa xa. O

Có hai điều cực đoan
Khiến hơi thở bất toàn
Một là quên hơi thở
Hai là thở rộn ràng
Quên hơi thở, quên tu
Tâm chìm đắm mịt mù.
Vì vậy luôn gắng nhớ
Từng hơi thở nhiệm mầu. O

Hơi thở vào, biết vào
Hơi thở ra, biết ra
Không cố gắng điều khiển
Theo ý muốn của ta
Có lúc hơi thở nhiều
Có lúc chẳng bao nhiêu
Nhưng chỉ cần biết rõ
Chẳng cần thêm một điều. O

Hơi thở là của thân
Khi Biết Rõ Toàn Thân
Là biết luôn hơi thở
Không cần phải phân vân.
Nhớ thật kỹ một điều
Dù hơi thở thế nào
Cũng không được điều khiển
Chỉ cần biết mà thôi. O

Biết thật rõ hơi vào
Biết thật rõ hơi ra
Biết toàn thân phía dưới
Tỉnh giác và an hòa
Vẫn giữ thân vững vàng
Bất động và nhẹ nhàng
Và biết từng hơi thở
Tâm dừng bước lang thang. O

Nhiều trạng thái của tâm
Vi diệu và lạ lùng
Thay phiên nhau xuất hiện
Sẽ khiến ta hiểu lầm
Thấy tâm thức rỗng không
Lòng thanh thoát vô cùng
Ta sẽ tưởng mình đắc
Một quả Thánh nào chăng. O

Thật ra, ta hãy còn
Đứng ngoài cửa mỏi mòn
Chưa vào được cánh cổng
Của ngôi đền Chí Tôn
Trong ngôi đền thẳm sâu
Có chiếc ghế nhiệm mầu
Tên gọi là Vô Ngã
Chờ đợi ta đã lâu. O

<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b></pre></div>`

            { 
                id: 100, 
                title: "LẠY PHẬT SÁM HỐI", 
                type: 'sub',
                content: `<div class="section-block"><h3>LẠY PHẬT SÁM HỐI</h3><pre>Kính lạy Đấng Giác Ngộ
Giữa thế gian tối tăm
Người là vầng ánh sáng
Giữa biển đời khổ đau
Người, đảo cồn nương tựa
Chúng con xin kính dâng
Lên Người lòng tôn kính
Vô biên và mãi mãi
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Trí tuệ Người vô cùng
Chiếu soi cả Pháp Giới
Suốt ba cõi chúng sinh
Không điều gì chẳng biết
Biết làm sao nói lên
Lòng chúng con kính ngưỡng
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Chúng con sống yên vui
Trong Từ Bi của Người
Ngập tràn như không khí
Trùm phủ khắp muôn loài
Tha thứ và độ lượng
Bao la và gần gũi
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Nơi trí giác tuyệt vời
Người vượt qua chấp ngã
Không còn là chính mình
Người đã là tất cả
Là hạt bụi cánh hoa
Là trăng sao mây gió
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Núi có thể lung lay
Nhưng Người là bất động
Tâm bình an của người
Còn hơn cả hư không
Rất nhỏ nhiệm sâu mầu
Đến tận cùng tuyệt đối
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Người cao cả thiêng liêng
Người bao la vời vợi
Mà chúng con nhỏ bé
Tầm thường và tội lỗi
Biết bao kiếp si mê
Trong tham lam thù hận
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Từ chấp ngã ban đầu
Biến thành tâm ích kỷ
Chỉ nghĩ lợi phần mình
Mà quên đi tất cả
Bây giờ con ăn năn
Xin nguyện chừa lỗi trước
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Từ chấp ngã ban đầu
Biến thành tâm kiêu mạn
Thấy mình hơn mọi người
Rồi khinh thường tất cả
Hôm nay trước muôn loài
Con cúi đầu sám hối 
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Có ai ngờ được rằng
Tâm kiêu mạn khởi lên
Là nhiễm ô nối bước
Khiến chúng con chìm trong
Đam mê và dục vọng
Thấp hèn và tội lỗi
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Tâm ích kỷ trước kia
Đưa đến lòng ác độc
Khiến chúng con nhẫn tâm
Gây tổn hại muôn loài
Bằng lời nói, gươm đao
Hoặc âm mưu đen tối
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Vì không biết thương người
Nên muốn ai cũng xấu
Nên chỉ thích chê bai
Để làm người nhục nhã
Ôi! Lời nói chê bai
Làm con người chia rẽ
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Tâm tự kiêu ngự trị
Nên nóng giận dễ dàng
Mỗi khi có người nào
Làm cho con trái ý
Hoặc xúc phạm đến con
Hoặc điều con ưa thích
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Làm được chút điều lành
Chưa có đáng là bao
Mà con tưởng rất nhiều
Nên khởi tâm tự mãn
Làm đóng lại con đường
Đi về nơi cao thượng    
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Rồi Phật Pháp cao siêu
Con hiểu được đôi điều
Đã thích thú khoe khoang
Không khiêm cung kín đáo
Làm hao tổn thiện căn
Phát sinh nhiều trở ngại
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (1 lạy) O</b>

Ôi! Lầm lỗi chập chùng
Giăng kín cả tâm con
Dù tha thiết ăn năn
Vẫn khó trừ diệt được
Cúi xin Mười Phương Phật
Soi sáng cả lòng con
Để trong mỗi phút giây
Con luôn luôn tỉnh giác
Xét được lầm lỗi mình
Từ nội tâm sâu kín
Con nguyện mãi về sau
Dù sinh về nơi đâu
Sẽ đem trọn đời mình
Hiến dâng cho tất cả.

<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần, 3 lạy) O</b></pre></div>`

            { 
                id: 101, 
                title: "KINH TỪ BI SÁM HỐI", 
                type: 'sub',
                content: `<div class="section-block"><h3>KINH TỪ BI SÁM HỐI</h3><pre>Ai cũng thế, ít nhiều đều tội
Chỉ khác nhau biết lỗi hay không
Đời là bể khổ mênh mông
Khéo nương Phật Pháp thoát vòng trầm luân

<b>Nam Mô Cầu Sám Hối Bồ Tát. (3 lần, 1 lạy) O</b>

Kính lạy Mười Phương Phật,
Kính lạy Mười Phương Pháp,
Kính lạy Mười Phương Tăng
Rất nhiều người thiếu thốn
Biết đâu trong quá khứ,
Con đã lừa gạt người,
Người đau khổ cả đời,
Tội lỗi càng chồng chất
Nay quay về nẻo Chánh,
Hiểu lầm lỗi ngày xưa,
Lòng ray rứt vô bờ,
Xin cúi đầu sám hối
<b>Nam Mô Cầu Sám Hối Bồ Tát.(1 lạy) O</b>

Nếu trước kia khờ dại,
Chẳng biết điều đúng sai,
Mãi lo lắng sinh nhai,
Tâm mịt mờ loạn động
Không hướng đi cao thượng,
Nghĩ những việc thấp hèn,
Đời lăn lộn bon chen,
Tầm thường và vô nghĩa
Không tin vào Nghiệp báo,
Chẳng biết có Luân hồi,
Gây tội mãi không thôi,
Đi dần vào tăm tối
Chẳng kính tin Tam Bảo,
Những bậc Thánh phi thường,
Nên sống rất tầm thường,
Kiếm tìm điều hư ảo
Nay quay về nẻo Chánh,
Hiểu lầm lỗi ngày xưa,
Lòng ray rứt vô bờ,
Xin cúi đầu sám hối
<b>Nam Mô Cầu Sám Hối Bồ Tát.(1 lạy) O</b>

Nếu trước kia kiêu ngạo,
Chẳng biết tôn trọng người,
Miệng chỉ thích chê cười,
Để cho mình là giỏi
Kiêu căng nhìn tất cả,
Cố tìm bới lỗi lầm,
Lời nói như dao đâm,
Khinh thị người thái quá
Thành công được chút ít,
Tưởng mình tài lắm rồi,
Nuôi lớn mãi cái Tôi,
Trong kiêu căng tự đắc
Khi lòng đầy tự mãn,
Dễ nóng nảy hung hăng,
Tâm dục vọng trào dâng,
Khó mà kiềm chế được
Nay tìm về Chánh Đạo,
Hiểu Nhân Quả nghiệp duyên,
Lòng ray rứt triền miên,
Xin cúi đầu sám hối
<b>Nam Mô Cầu Sám Hối Bồ Tát.(1 lạy) O</b>

Kính lạy Mười Phương Phật,
Nhiều kiếp phạm sai lầm,
Con sám hối ăn năn,
Rất chân thành tha thiết
Nguyện theo lời Phật dạy,
Yêu thương khắp muôn loài,
Như biển lớn sông dài,
Bao la và vô tận
Nguyện tình thương bát ngát,
Như tâm Phật từ bi,
Trên mọi nẻo đường đi,
Trong mênh mông Pháp Giới
Xin vượt qua thù hận,
Để mãi mãi về sau,
Oan trái chẳng theo nhau,
Lòng an vui thanh thản
Xin mở lòng rộng lớn,
Như trời đất thênh thang,
Soi sáng cả mười phương,
Với tình thương đầm ấm
<b>Nam Mô Vô Lượng Từ Bi Bồ Tát. (1 lạy) O</b>

Xin tâm con yêu mến,
Cả những người chẳng quen,
Trên đường đời nhiều phen,
Gặp nhau mà không biết
Xin tâm con thương hết,
Cả những người ghét con,
Thậm chí đã đưa con,
Vào khốn cùng đau khổ
Xin thương người già yếu,
Kiếp sống đã đi qua,
Lắm vinh nhục phong ba,
Tuổi trời không xa nữa
Xin thương những em bé,
Từng đôi mắt ngây thơ,
Những vui khổ đang chờ,
Kiếp người không biết trước
Nguyện lòng đầy thương cảm,
Những thân phận tật nguyền,
Làm người ít phước duyên,
Thiệt thòi và bất hạnh
<b>Nam Mô Vô Lượng Từ Bi Bồ Tát. (1 lạy) O</b>

Xin Phật Từ gia hộ,
Lòng con như đại dương,
Đầy ắp những tình thương,
Dành cho muôn cầm thú,
Chim trời đang tung cánh,
Từng đàn đi về xa,
Hoặc chen chúc lá hoa,
Tìm thức ăn vất vả
Thú hoang trong rừng thẳm,
Trú ẩn trong hang sâu,
Hoặc bờ bụi cành cao,
Cả một đời ngây dại
Cá tôm dưới sông biển,
Từng giây phút tìm mồi,
Sống cực khổ nổi trôi,
Đoạt lẫn nhau sự sống
Xin lòng con thương hết,
Mong muôn loài vượt lên,
Khỏi thân phận thấp hèn,
Để có ngày giác ngộ
<b>Nam Mô Vô Lượng Từ Bi Bồ Tát. (1 lạy) O</b>

Rồi những người đã chết,
Chưa có chỗ đi về,
Còn vất vưởng sơn khê,
Đầu đường hay cuối ngõ,
Những vong linh từ trước,
Khi sống rất nghĩa tình,
Vì nước quên thân mình,
Một tấm lòng trung hiếu
Cũng có những vong linh,
Đã sống rất sai lầm,
Không tìm thấy thiện tâm,
Chỉ gây ra đau khổ
Có vong linh u tối,
Vì tâm thức si mê,
Lòng ích kỷ nặng nề
Chết rồi còn hung ác
Nguyện lòng con soi sáng,
Tất cả các vong linh,
Bằng nguyện lực từ bi,
Cho vong linh an lạc
<b>Nam Mô Vô Lượng Từ Bi Bồ Tát. (1 lạy) O</b>

Nguyện tất cả muôn loài,
Biết yêu quý lẫn nhau,
Đừng gây cảnh khổ đau,
Để kéo theo oan trái
Ai cũng biết phòng hộ,
Những ý niệm của mình,
Tránh xúc não chúng sinh,
Bởi ác tâm hung bạo
Trên đường đời vạn nẻo,
Gặp nhau kết duyên lành,
Trong tử tế hân hoan,
Bằng yêu thương giúp đỡ
Người với người yêu mến,
Người khuyên người từ bi,
Dòng luân hồi cùng đi,
Bớt được nhiều nỗi khổ
Pháp Giới là vô ngã,
Pháp Giới là tình thương,
Lòng từ trải muôn phương,
Tâm bồ đề vô thượng.

<b>Nam Mô Vô Lượng Từ Bi Bồ Tát. (3 lần, 3 lạy)</b>
</pre></div>`

            { 
                id: 102, 
                title: "KINH TỨ NIỆM XỨ", 
                type: 'sub',
                content: `<div class="section-block"><h3>KINH TỨ NIỆM XỨ</h3><pre>
Con đã từng nghe như thế này
Ku-ru quốc độ có một ngày
Thế Tôn nói bốn phần TRÚ NIỆM
Con đường giác ngộ được hiển bày

Tỳ kheo phải có căn bản thiền
Kiết già tĩnh tọa ngồi cho yên
Toàn thân biết rõ không còn sót
Hơi thở ra vào biết tự nhiên

Giữ thân bất động rất vững vàng
Nhưng là mềm mại chẳng gồng căng
Tay chân tụ lại về trước bụng
Lưng thẳng, chân đan, mắt rõ ràng


An trú toàn thân, biết toàn thân
Cảm giác toàn thân, một khối thân
Mình mẩy tay chân đều biết rõ
Rõ nhất xương cùng dưới thắt lưng

Hơi thở đi vào, biết đi vào
Thở ra, biết rõ như thế nào
Cơ thể tự nhiên là phải thở
Chẳng cần điều khiển chậm hay mau

Phật dạy rất nhiều lợi ích hay
Khi nhìn hơi thở như thế này
Nội lực âm thầm nuôi thân mạng
Tinh thần tỉnh sáng thêm từng ngày

Chính thức đi vào bốn NIỆM PHẦN
Bắt đầu hiểu rõ hết về Thân
Rồi hiểu rõ về từng cảm Thọ
Hiểu Tâm, hiểu Pháp rất cân phân

Hiểu rõ rằng THÂN được hợp thành
Bởi nhiều bộ phận khá hôi tanh
Thịt xương máu mủ da lông tóc
Đờm dãi ngày đêm vẫn thải nhanh

Hiểu rõ rằng thân rất mong manh
Nóng lạnh tai ương chực chờ quanh
Già bệnh cuối cùng không tránh khỏi
Xương tàn vùi đất kiếp tử sinh

Hiểu rồi an trú ngay nơi thân
Đối diện kiếp người rất phù vân
Ngay tại niềm đau mà ôm lấy
Sự thật thế nào, thấy rất gần

CẢM THỌ khổ vui nối tiếp nhau
Sợ Lo Mừng Tủi… những u sầu
Chúng sinh tìm kiếm niềm hạnh phúc
Chỉ là lọt bẫy dưới hầm sâu

An trú nơi từng cảm giác qua
Hiểu rõ buồn vui cũng chỉ là
Một thoáng vô thường nhưng đắt giá
Tạo nghiệp vì mê những bóng tà

Những lúc khổ đau đến tột cùng
Tưởng như đã cạn sức vẫy vùng
Can đảm niềm đau mà ôm lấy
Chẳng cần tránh né chỗ mông lung

Những lúc niềm vui đến ngập tràn
Nhìn xem cảm giác đó rõ ràng
Như xem người khách từ đâu đến
Như nhìn sương khói lúc chiều tan

Hiểu rõ về TÂM có ba điều
Một là Đạo đức được bao nhiêu
Hai là Động loạn hay Thanh tịnh
Trí tuệ - Ngu si cái nào nhiều

Chưa chứng cao siêu thánh vị nào
Chắc rằng Bất thiện vẫn sôi trào
Ích kỷ, tham lam, và ác độc
Còn trong sâu kín biết làm sao

Chánh Định chưa từng nhập bao giờ
Thì tâm loạn động vẫn mịt mờ
Mà dẫu có yên vài khoảnh khắc
Vẫn là rất cạn, rất đơn sơ

Trí tuệ thì thôi, đã rõ rồi
Lỗi lầm ít thấy, cứ buông trôi
Nghiệp duyên nhân quả càng xa lạ
Đạo lý chỉ là nhai lại thôi

Niệm PHÁP nghĩa là hiểu bản thân
Dựa trên tội phúc đã bao lần
Tính ra tội hẳn nhiều hơn phúc
Nên lòng luôn sám hối ăn năn

Niệm Pháp nghĩa là biết Vô minh
Chấp ngã trầm luân kiếp tử sinh
Tứ Diệu Đế là vầng ánh sáng
Mục tiêu Vô ngã đón bình minh

QUÁN NIỆM và AN TRÚ bốn phần
Không rời một chỗ của bản thân
Mà nghiệm ra mọi điều đạo lý
Cúi đầu đảnh lễ trước Hồng Ân

Công đức phải huân tập vô ngần
Con đường giác ngộ mới đến gần
Tôn kính Phật và chư Hiền Thánh
Chan rải từ bi khắp chúng dân

An trú ngay nơi có lỗi lầm
Biết rằng đây chính là lỗi lầm
Nhẹ nhàng đối diện không tránh né
Can đảm niềm đau cứ thế ôm

Có một lỗi lầm rất lớn lao
Đó là chấp ngã rất thẳm sâu
Tạo nên sinh tử trầm luân mãi
Nên cần phải an trú dài lâu

Nhưng chẳng dễ tìm chấp ngã đâu
Vô hình trừu tượng ở tầng sâu
Nếu không có định và có phước
Làm sao vào được cửa nhiệm mầu

Tìm thấy chính mình, bước đầu tiên
Đặt chân lên đạo lộ tịnh thiền
Lặng lẽ nghìn năm không rời bước
Bản ngã tầng sâu rất diệu huyền

Nếu muốn tìm ra được chính mình
Phải nhờ ba cái biết phân minh
Một là cảm giác toàn thân thể
Hiểu lẽ vô thường biến dịch nhanh

Kế nữa là hơi thở vào ra
Chỉ biết mà thôi chẳng bôn ba
Không can thiệp nhưng không bỏ mất
Rất rõ từng hơi vào hơi ra

Đặc biệt không quên chỗ Xương Cùng
Gốc của toàn thân, dưới thắt lưng
Giúp cho sinh lực dồi dào mãi
Bình thản trú tâm biết không ngừng

Lúc này tâm có thể lắng yên
Trạng thái rỗng không rõ một miền
Nhưng chớ dại khờ nhìn nơi đó
Vì chẳng khác chi hướng ngoài hiên

Giữ ba cái biết không rời xa
Thêm chút ưu tư chưa tìm ra
Chính mình ẩn núp nơi nào đó
Vì duyên chưa đủ nên lầm qua

Chẳng hẹn thời gian sẽ bao lâu
Tìm được chính mình ở tầng sâu
Biết bao kỳ diệu chờ trong đó
Ta sẽ ngỡ như đắc đạo mầu

Ngoại đạo cũng từng tìm thấy rồi
Tự xưng chân tánh mãi không thôi
Chỉ có Như Lai siêu chánh giác
Vượt qua bản ngã rất tuyệt vời

Ta cũng sẽ đi hết con đường
Mà bao hiền thánh khắp mười phương
Đã từng đặt bước chân trên đó
Tìm thấy chính mình để đảm đương

An trú chính mình đến xa xăm
Mấy trăm hoặc cả mấy nghìn năm
Dù rằng trong đó là mầu nhiệm
Mục tiêu Vô ngã vẫn âm thầm

Nếu chỉ dừng ngang chỗ “chính mình”
Sẽ không thể hết sạch vô minh
Nhưng bỏ “chính mình” thì lạc hướng
Mục tiêu Vô ngã cũng không thành

Đây là Trung đạo khéo đi qua
An trú chính mình không rời xa
Nhưng biết “chính mình” còn bản ngã
Mục tiêu Vô ngã vẫn thiết tha

Đỉnh cao TỨ NIỆM XỨ là đây
Lỗi lầm tự nó sẽ đổi thay
Nếu ta thấy rõ và an trú
Nơi chính lỗi lầm đã từng gây

Cả lúc tâm thiền rất lắng yên
Vẫn hiểu là chưa hết não phiền
Nên không vội vã xưng thần thánh
Còn phước mà đi đến vô biên

Nguyện cho pháp giới khắp chúng sinh
Ai cũng tìm ra được chính mình
Để rồi an trú qua nhiều kiếp
Cuối cùng tan vỡ, hết vô minh.

<b>NAM MÔ ĐẤNG CHÁNH GIÁC ĐẠI TỪ BI ĐẠI TRÍ TUỆ BỔN SƯ THÍCH CA MÂU NI PHẬT. (3 lần)</b></pre></div>`

                title: "LỜI NGUYỆN CẦU BUỔI SÁNG", 
                type: 'sub',
                content: `<div class="section-block"><h3>LỜI NGUYỆN CẦU BUỔI SÁNG</h3><pre>(Cha mẹ nên hướng dẫn con trẻ vào buổi sáng, sau khi thức dậy, vệ sinh thân thể, mặc bộ đồ tươm tất, đến trước bàn thờ Phật, lễ Phật 3 lễ thật cung kính rồi quỳ tụng bài “Lời Nguyện Cầu Buổi Sáng”)

                content: `<div class="section-block"><h3>SÁM NGUYỆN HỘ PHÁP</h3><pre>Con cúi lạy Mười Phương Tam Bảo
Chứng minh con tâm đạo kiên cường

Tăng Ni bức hại não nùng

Nguyện thứ nhất con thôi si ám

Để nương vào sức đại hùng

Để nhìn ra muôn vạn âm mưu
Hiểu ra lòng dạ kẻ thù

            { 
                id: 105, 
                title: "SÁM NGUYỆN HOẰNG PHÁP", 
                type: 'sub',
                content: `<div class="section-block"><h3>SÁM NGUYỆN HOẰNG PHÁP</h3><<pre>Xin kính lạy Thế Tôn cao cả
Vì chúng sinh nên đã mở ra
Một trời Chánh Pháp bao la
Chúng sinh tu tập bước qua khổ sầu.

Con ngẫm lại buổi đầu gặp đạo
Hiểu cuộc đời hư ảo phù du
Tâm hồn thoát cõi ngục tù
Nguyện theo Bát Chánh gắng tu tinh cần.

Có trí tuệ hiểu nhân hiểu quả
Có trái tim hỷ xả từ bi
Phật Đà dẫn một đường đi
Đưa con về chốn diệu kỳ an vui.

Nay nhìn lại bao người cùng sống
Nơi hành tinh hoa mộng xanh tươi
Nhưng mà có được mấy người

Biết nương Phật Pháp cho đời thăng hoa.
Thiếu Phật Pháp đời là bể khổ
Kiếp nhân sinh vô số lỗi lầm
Tâm hồn mờ mịt tối tăm

Sa chân lỡ bước trôi lăn đọa đày.
Đền ơn Phật con nay phát nguyện
Cả một đời tinh tiến tu hành
Rồi đem Chánh Pháp quang minh

Gieo vào khắp chốn chúng sinh vạn loài.
Dù những chỗ chẳng ai mời thỉnh
Hoặc những người bướng bỉnh ngang tàng
Lòng con kiên nhẫn yêu thương

Gieo duyên hóa độ mở đường tương lai.
Con xin Phật điểm khai thần lực
Vào tâm con thành sức nhiệm mầu
Để con dù đến nơi đâu

Nói lời Chánh Pháp chuyển sâu lòng người.
Để từ đó người người quy ngưỡng
Về con đường cao thượng Như Lai
Đắp xây cuộc sống ngày mai

An vui giác ngộ vượt ngoài trầm luân.
Nhưng không phải mùa xuân còn mãi
Cũng có khi đông lại hè sang
Đường hoằng pháp sẽ gian nan

Biết bao đố kỵ bạo tàn ghét ganh.
Vì kính Phật lòng đành nhẫn nhục
Để đi qua những lúc khó khăn
Nghiệp xưa sám hối ăn năn

Nguyện nay vững bước ngàn lần hơn lên.
Phật cho con chí bền tâm sáng
Xin được làm bè bạn muôn sinh
Kết duyên lành đậm ân tình

Sẻ chia giáo pháp thiện lành với nhau.
Nếu còn kẻ đêm sâu chưa tỉnh
Chưa hiểu gì nẻo chính nẻo tà
Thì con quyết chẳng bỏ qua

Phải theo hóa độ dù là rất lâu.
Nếu còn kẻ mong cầu phép lạ
Chẳng biết gì nhân quả công bằng
Thì con chẳng chút ngại ngần

Nói cho nghe mãi vạn lần nghiệp duyên.
Nếu có kẻ trú miền biên địa
Chưa tìm ra diệu nghĩa Như Lai
Dù cho núi thẳm sông dài

Con không ngại đến nói bày đạo thiêng.
Nếu có kẻ nghiệp riêng điên đảo
Chưa biết tìm Tam Bảo quy y
Con xin dẫn một lối đi

Về đài sen để được quỳ nương theo.
Nếu còn kẻ gươm đeo súng vác
Cả một đời tàn ác điên cuồng
Lòng con bình thản như thường

Tìm phương tiếp cận dẫn đường hồi tâm.
Nếu có vị quang lâm thuyết pháp
Con sẽ kêu gọi khắp xa gần
Cùng về nghe rất ân cần

Để cho pháp hội thêm phần nghiêm trang.
Nếu gặp đĩa sách vàng đạo lý
Xem hoặc nghe khiến trí tuệ khai
Con xin phát tặng khắp nơi

Để nhiều người được nhận lời kinh hay.
Hoặc có lúc con thay Tăng chúng
Đăng pháp tòa trùng tụng tuyên dương
Nguyện lòng tuyệt đối kính thương

Dâng lên chư Phật mười phương ba đời.
Nguyện xin nói đúng lời đạo lý
Mà Thế Tôn đã chỉ dạy nên
