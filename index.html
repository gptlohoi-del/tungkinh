            { 
                id: 108, 
                title: "KINH CHÁNH TINH TẤN", 
                type: 'sub',
                content: `<div class="section-block"><h3>KINH CHÁNH TINH TẤN</h3><pre>
Như vầy con đã nghe, một thời Thế Tôn trở lại Tinh xá Lộc Uyển. Khi ấy, đại chúng đồng lòng quy tụ, thành kính lắng nghe Thế Tôn thuyết giảng lại bài Pháp Tứ Diệu Đế, như là bản tuyên ngôn bất diệt của mười phương ba đời chư Phật. Sau đó, Tôn giả Xá Lợi Phất thay Thế Tôn giảng giải tường tận về Pháp Tứ Đế vi diệu thâm sâu:
Này đại chúng, khi Chánh Mạng đã thuận lợi, việc nuôi sống bản thân đã ổn định thoải mái, hành giả bắt đầu bước vào Chánh Tinh Tấn, thực hành thiền định nhiếp tâm để chứng đạt tâm linh giác ngộ.
Chánh Tinh Tấn chính là giai đoạn dụng công thiền định ban đầu, chưa có kết quả, nhưng cần phải hiểu rõ toàn bộ lộ trình tu tập, giống như người lữ hành trước hành trình cần bản đồ chi tiết rõ ràng, nắm vững từng chặng đường, từng bước đi một cách cẩn thận.
Trong giai đoạn này, hành giả phải chọn đúng pháp môn theo lời dạy của Thế Tôn, tránh xa những giáo lý huyền hoặc, cao siêu của ngoại đạo. Những tà kiến ấy tuy nghe cao siêu nhưng lại sai lầm, khiến người tu không được lợi ích, thậm chí rơi vào rối loạn tâm thức, đau khổ vô cùng.
Nhưng dù có pháp môn đúng, hành giả cũng không thể có kết quả thiền định nhanh chóng mà phải rất kiên nhẫn đúng như ý nghĩa Tinh Tấn.
Này đại chúng, có hai con đường dẫn vào thiền định là Chỉ và Quán. Chỉ là kỹ thuật, Quán là đạo lý quán chiếu. Hành giả phải thực hành một số kỹ thuật từ căn bản đến nâng cao, và cũng phải quán chiếu những đạo lý từ đơn giản đến sâu xa tinh tế.
Hành giả phải tập ngồi kiết già hoa sen noi theo Mười phương ba đời Chư Phật đã thực hành mà chứng đạo. Ngồi kiết già ban đầu là khó khăn vì tâm chưa yên mà chân bị đau và tê rất khó chịu, nhưng kiên nhẫn chịu đựng cũng là rèn luyện đức tính kham nhẫn. Hành giả tập ngồi đúng tư thế: lưng thẳng, thân mềm mại mà bất động, hai chân đan vào nhau, hai bàn tay đặt ngửa lên nhau trên chân, hai cánh tay không ép sát thân, mắt nhìn xuống, miệng ngậm, lưỡi đặt lên nướu răng trên nhẹ nhàng.
Hành giả tập Điều Thân cho ổn định, nhờ cố gắng giữ thân đúng tư thế, mềm mại và bất động, mà tạo ra cái biết toàn thân giúp tâm được Tỉnh Giác hơn. 
Này đại chúng, khi điều thân thuần thục khiến cho tâm có chút tỉnh giác, cảm giác toàn thân hiện ra rõ hơn. Lúc ấy, hãy quán chiếu một sự thật hiển nhiên: thân này là Vô thường, rồi sẽ già, sẽ bệnh, sẽ chết, sau khi chết thân xác từ từ tan hoại, xương cũng mục thành đất bụi.
Bước đầu quán chiếu đạo lý chính là suy gẫm về sự vô thường của thân. Thân thể này là cuộc sống thực tế nên sự chấp thân là rất mạnh mẽ. Vì chấp thân mà chúng sinh sinh ra biết bao lầm chấp, để rồi tâm bị trói buộc trong vô số phiền não. Thường xuyên quán chiếu về Thân vô thường giúp phá dần chấp thân và nhẹ đi nhiều cái chấp khác. 
Khi biết rõ toàn thân, cảm giác toàn thân, hành giả quán chiếu suy gẫm về sự vô thường của thân. Tâm có chút yên lắng tỉnh giác, hành giả sẽ nhận ra thân này đang thở vào, thân này đang thở ra. Theo dõi hơi thở như thế, tâm sẽ được an lạc hơn, ít vọng tưởng hơn.
Điều thân là kỹ thuật (Chỉ), biết rõ toàn thân cũng là kỹ thuật (Chỉ), quán Thân vô thường là đạo lý (Quán), rồi biết hơi thở vào ra lại là kỹ thuật (Chỉ). Các phép Chỉ và Quán cứ dẫn dắt nhau trong tiến trình tu tập thiền định là như vậy.
Hơi thở là sợi dây kết nối giữa Thân và Tâm, giữa Danh và Sắc. Ai kiểm soát được hơi thở sẽ kiểm soát được nội tâm. Hơi thở vào biết rõ hơi thở vào, hơi thở ra biết rõ hơi thở ra, khéo biết nhưng không dằn ép hay điều khiển hơi thở cho nhiều, cho dài, cho mạnh.
Khi theo dõi hơi thở như thế, hành giả nhận ra rằng nguồn xung động của vọng tưởng nằm ở dưới thân chứ không phải trên đầu. Chú ý trên đầu không chặn được vọng tưởng, mà còn khiến tâm trí thêm căng thẳng, mệt mỏi. Hành giả chú ý xuống thân, đặc biệt là vùng bụng dưới, tâm bớt vọng tưởng.
Cảm giác toàn thân cũng là kỹ thuật giúp tăng tỉnh giác nhiều hơn vì các giác quan, xúc giác, đang âm thầm hoạt động trên khắp tấm thân rộng lớn. Cảm giác toàn thân một cách chủ động sẽ hình thành sự tỉnh giác, giúp hành giả không bị vọng tưởng dẫn đi.
Mười phương Ba đời Chư Phật ngồi kiết già đều đan hai chân và hai bàn tay lại với nhau đặt trước bụng. Tư thế này giúp chú ý nhiều hơn ở bụng dưới, vì đó mới là nguồn xung động của vọng tưởng. An trú dưới bụng giúp vọng tưởng bớt đi rất nhiều.
Này đại chúng, quán thân vô thường là một đạo lý căn bản để quán chiếu giúp hành giả đối diện với sự thật. Khi đối diện với sự thật, tâm liền tỉnh giác hơn.
Còn nhiều sự thật cần quán chiếu dần để gột bỏ lầm chấp, giúp tâm từng bước đi sâu vào thiền định. Chẳng hạn như, hành giả quán chiếu: Thế gian này vô thường, hư ảo, đầy rẫy ngang trái và khổ đau; Đời sống muôn loài chỉ là sự bươn chải vất vả, nhọc nhằn khổ đau; Thân này vốn bất tịnh mà hàng ngày ta đều phải đối phó xử lý; Chúng sinh bị chi phối bởi những ham muốn tầm thường, để rồi tạo ra vô số tội lỗi để đạt được những điều tầm thường ấy; Một tâm hồn khô khan, ích kỷ chính là sự bế tắc u mê. Muốn vượt thoát vô minh, phải khởi lòng từ bi, yêu thương tất cả...
Này đại chúng, tham lam, sân hận, đố kỵ, kiêu mạn, vô trách nhiệm là những tâm bất thiện khiến chúng sinh mãi chìm trong tăm tối.
Muốn thoát khỏi vô minh, hành giả phải quán chiếu để diệt trừ các tâm bất thiện đó. Nhưng diệt trừ không có nghĩa là làm gì để diệt, vì các tâm bất thiện vô hình, không tìm thấy dấu vết cụ thể. Chỉ cần BIẾT rằng trong tâm này đang bị thiêu đốt bởi kiêu mạn, ích kỷ, tham lam, sân hận, đố kỵ, vô trách nhiệm… thì tự nhiên lâu ngày các tâm bất thiện đó sẽ mất dần. Nhìn thấy sự thật này, tâm xuất hiện tỉnh giác, đó là quy luật tự nhiên.
Nếu ai hỏi rằng có cần quán chiếu về những thiện tâm như tử tế, rộng lượng, từ bi, khiêm hạ, vị tha, có trách nhiệm… hay không, thì hãy biết rằng, tự cho mình có những phẩm chất ấy là sai lầm. Sai lầm thứ nhất là tập trung nhìn ưu điểm của mình làm phát sinh kiêu mạn. Sai lầm thứ hai là càng nhìn vào ưu điểm của mình thì ưu điểm ấy sẽ mất dần chẳng còn nữa.
Khi tâm bớt vọng tưởng, tự nhiên sức chú ý của tâm sẽ lắng sâu xuống bụng dưới. Hành giả sẽ hiểu rõ rằng thực sự nguồn xung động của vọng tưởng chính là ở rất sâu từ dưới bụng chứ không phải trên đầu. Ai dù chưa bớt vọng tưởng nhưng đã khéo lắng tâm chú ý ở dưới bụng cũng sẽ dễ kiểm soát vọng tưởng hơn.
Lúc này, hành giả sẽ hiểu tại sao Mười Phương Ba Đời Chư Phật đều dạy ngồi thiền trong tư thế kiết già, đặt hai lòng bàn tay, hai lòng bàn chân tụ lại ở bụng dưới, giúp cho tâm dễ lắng trụ dưới đó hơn.
Những ai không hiểu điều này, ngồi thiền trụ tâm lên đầu, chẳng bao lâu phát sinh nhiều bệnh. Trụ tâm ở dưới bụng thấp cũng là một kỹ thuật (Chỉ) hỗ trợ rất lớn cho việc nhiếp tâm thiền định.
Khi có thêm sức tỉnh giác, hành giả sẽ khéo léo giữ cho hơi thở CHẬM-ÍT-ÊM, chứ không còn thở nhiều, thở mạnh, thở nhanh. Hơi thở có liên quan đến Thân thể và Tâm thức, thế nên khi Hơi thở êm dịu nhỏ nhiệm thì Thân thể và Tâm thức cũng yên tĩnh dần.
Nhiều người lầm tưởng rằng thở nhiều sẽ giúp tập trung hơn, nhưng không phải vậy, càng cố gắng thở nhiều càng bị căng thẳng, bất an, mất kiểm soát vọng tưởng. Ngược lại, không để ý đến hơi thở, hoặc thở quá ít, cũng làm mất kiểm soát vọng tưởng. Vọng tưởng vô hình đến và đi không đoán trước nên không thể trực tiếp ngăn chặn vọng tưởng, mà chỉ có thể thông qua trung gian hơi thở để nắm được tâm.
Sau khi khéo léo giữ hơi thở CHẬM - ÍT - ÊM, lúc nào đó, bất ngờ hành giả tìm thấy hơi thở có cường độ vừa đủ để DÍNH VỚI TÂM. Hơi thở nhiều quá, nhanh quá, mạnh quá sẽ vuột khỏi tâm. Khi ấy dù có chú ý vào hơi thở thế nào cũng không nhiếp được tâm, chỉ là chú ý vào một mình hơi thở mà thôi. Nếu hơi thở quá ít, quá chậm, quá yếu cũng không dính với tâm, lại sẽ mệt tim vì thiếu không khí.
Chỉ với một cường độ thích hợp nhất, HƠI THỞ DÍNH VỚI TÂM. Khi ấy chú ý vào hơi thở cũng là giữ được tâm. Tâm và hơi thở theo nhau, hành giả có một trụ cột vững chắc giữa sóng gió nội tâm. Giống như một người giữa cơn bão tố nhờ có trụ cột để nắm giữ mà không bị giông bão cuốn đi.
Có một điểm nơi mà hơi thở và tâm dính với nhau, đó là điểm lơ lửng trong bụng dưới. Khi thấy được điểm này, hành giả vừa theo dõi hơi thở, vừa kiểm soát được tâm. Dù vọng tưởng chưa dừng hẳn nhưng không còn kéo tâm đi miên man, hành giả biết vọng tưởng nhưng không bị trôi theo vọng tưởng.
Khi thực hành thiền định dừng vọng tưởng, nhiều người lầm tưởng phải chú ý trên đầu mới nhiếp được tâm, ít ai ngờ rằng gốc của tâm nằm ở dưới bụng sâu, bộ não trên đầu chỉ là phần ngọn của tâm thức. Ai nôn nóng nhiếp tâm, gắng sức dừng vọng tưởng để vào định, chú ý căng thẳng trên đầu lại dễ sinh bệnh tật, thậm chí tâm thần.
Kỹ thuật đỉnh cao của Thiền chính là khi tìm được HƠI THỞ DÍNH VỚI TÂM. Hành giả từng bước đi qua các kỹ thuật: Biết rõ toàn thân, Biết thấp dưới bụng, Biết hơi thở mà không điều khiển, thở sao cho Chậm – Ít – Êm, cuối cùng là phải tìm ra Cường Độ Hơi Thở vừa đúng để Hơi Thở Dính Với Tâm. Từ đó chỉ theo dõi hơi thở tức là đã kiểm soát được tâm. Đừng cố tìm cách trực tiếp kiểm soát tâm kẻo sinh nhiều bệnh tật.
Khi tìm được Hơi thở Dính với Tâm, hành giả dễ kiểm soát tâm, sức tỉnh giác tăng lên và kéo dài, chuẩn bị thành tựu Chánh Niệm.
Nhưng khi tâm có vẻ yên lắng, hỷ lạc xuất hiện, dễ khởi tâm lý tự khen làm phát sinh kiêu mạn, nguy hiểm vô cùng. Hành giả phải quyết tâm tránh cho bằng được tâm lý kiêu mạn tự khen mình mỗi khi có chút tiến bộ trong thiền.
Khi tâm có chút yên lắng, sức tỉnh giác hiện ra khắp thân, hành giả biết toàn thân rõ ràng và có cảm giác chỉ cần an trú toàn thân, tâm sẽ yên dần. Nhưng không phải vậy. Nếu chỉ an trú toàn thân, sẽ càng chấp thân, ngược với đạo lý quán thân vô thường mà Thế Tôn đã dạy, nên sẽ bất an trở lại khi cố gắng tiếp tục an trú toàn thân.
An trú toàn thân là Kỹ thuật (Chỉ), hành giả cần đạo lý quán chiếu bổ sung. Khi toàn thân hiện ra rõ ràng, cảm giác toàn thân giúp hành giả có sức tỉnh giác cưỡng lại vọng tưởng, phải nhanh chóng tác ý Quán Thân Vô Thường, đừng chỉ an trú toàn thân mà đã cho là đủ.
Này đại chúng, nếu tìm được hơi thở có cường độ thích hợp để Hơi Thở Dính Với Tâm là đỉnh cao của phép Chỉ (kỹ thuật) trong thiền, thì hành giả cũng phải tìm được đạo lý để quán chiếu cho đến tận cùng của sự thật. Quán chiếu nghĩa là tác ý suy gẫm về những sự thật, mà điều đó khiến cho tâm tỉnh giác.
Nếu suy nghĩ sai lầm, tà tư duy, tâm sẽ từ từ trở nên điên loạn. Nếu suy nghĩ đúng đắn, Chánh tư duy, tâm sẽ dần trở nên điềm tĩnh. Còn nếu suy nghĩ về những sự thật, về bản chất tiêu cực của thân - tâm - cuộc sống sẽ giúp tâm xuất hiện sự tỉnh giác để đi vào thiền định.
Việc suy xét về bản chất tiêu cực của vạn hữu chính là quán chiếu theo đạo lý. Đây là phép Quán trong thiền định mà hành giả cần am tường.
Phép Chỉ, kỹ thuật nhiếp tâm không giúp gạn lọc hết vô minh chấp ngã, phải nhờ phép Quán để đạt đến viên mãn giác ngộ.
Sự thật ban đầu mà hành giả phải suy gẫm quán chiếu là sự vô thường của thân xác. Thân này rồi sẽ già, bệnh, chết, mục rữa chẳng còn gì.
Phải can đảm đối diện với già, bệnh, chết ngay khi còn khỏe mạnh, để buông bỏ những ham muốn tầm thường.
Ngày nào còn khỏe, còn sống, phải biết quý thời gian để làm điều thiện, tu hành, chớ uổng phí kiếp người vô nghĩa.
Sự thật tiếp theo, Thân vốn bất tịnh. Mọi thứ đưa vào miệng là sạch, nhưng khi ra khỏi thân liền thành dơ bẩn. Mọi việc tắm giặt, ăn mặc sạch sẽ chỉ để che đậy đôi chút, không thay đổi được bản chất bất tịnh nơi thân. Hành giả phải chiêm nghiệm sự thật này để biết nhàm chán, không đắm luyến thân này quá đáng, chỉ dùng thân để làm việc thiện và tu hành.
Thân này cũng là Kết tinh của Nghiệp từ vô lượng kiếp, tội nhiều hơn phước rất rõ ràng. Hành giả phải thấy thân cũng là Khối Tội từ vô lượng kiếp. Đó là sự thật cần quán chiếu sâu xa.
Thân này mang một kiết sử bản năng mãnh liệt là ham sống sợ chết, và bản năng đó thúc đẩy chúng sinh phải làm tất cả để được sống. Chúng sinh vất vả mưu sinh, giành giật hơn thua, tạo bao nghiệp dữ, vay trả không ngừng. Thân này thật là gánh nặng, nên người hiểu đạo phải biết dùng thân để tạo phúc, tu hành, đừng phí hoài công sức chỉ để giữ thân này tồn tại vô nghĩa.
Khi tâm có tỉnh giác, tự nhiên có cảm giác bao quanh thân, giúp hành giả dễ an trú tĩnh tâm. Lúc đó, hành giả dễ bị rơi vào lỗi an trú toàn thân, an trú trong cảm giác bình yên đó, thụ hưởng cảm giác bình yên đó, rồi khởi tâm kiêu mạn tự hào mà không hay, dần dần hết phước, lui lại động loạn như xưa.
Khi tâm xuất hiện trạng thái yên tĩnh, tỉnh giác, có cảm giác biết rõ toàn thân, phải nhanh chóng tác ý quán chiếu thân này là vô thường, thân này là tội lỗi. Sức tỉnh giác kéo dài tới đâu thì sự quán chiếu cũng kéo dài theo tới đó để không bị ngấm ngầm tác ý nắm giữ trạng thái yên tĩnh.
Khi tâm tỉnh giác yên tĩnh, phải quán chiếu sâu xa đến sự thật cuối cùng: Trạng thái này vẫn còn là Vô Minh và Tội Lỗi. Chừng nào chưa đạt Tam Minh Lục Thông, chừng đó vẫn còn Vô minh và Tội lỗi. Dù thiền định cao sâu đến đâu, tâm thức tiến bộ thế nào, vẫn còn là Vô Minh và Tội Lỗi. Hành giả phải ghi xương khắc cốt sự thật cuối cùng này cho đến ngày hoàn toàn giải thoát.
Này đại chúng, khi tỉnh giác hiện khắp thân, hành giả phải quán thân này là Vô Thường và Tội Lỗi. Khi tâm yên tĩnh, hỷ lạc phát sinh, phải quán trạng thái này vẫn còn Vô Minh và Tội Lỗi. Nghĩa là sự tiến bộ tới đâu thì sự quán chiếu cũng phải đi theo tới đó để kiềm giữ không cho kiêu mạn trỗi dậy, để giữ gìn đức hạnh hiền lành, để hướng về Vô ngã trọn vẹn.
Này đại chúng, khi tọa thiền, hành giả cố gắng tìm đến đỉnh cao kỹ thuật (CHỈ) là thở với cường độ thích hợp (Chậm Ít Êm) để Hơi Thở Dính Với Tâm. Từ đó chỉ cần kiểm soát hơi thở là kiểm soát được tâm. Ngoài lúc tọa thiền, mỗi khoảnh khắc thời gian đều quán Thân này Vô Thường Tội Lỗi, Chính mình chỉ là Vô Minh Tội Lỗi. Dù thức hay ngủ, làm việc hay nghỉ ngơi, không phút giây nào buông lơi quán chiếu.
Này đại chúng, có những người có duyên mặc định là phải đắc đạo, dù dụng công tu hành chưa kỹ lưỡng, chưa đầy đủ, nhưng kết quả vẫn xuất hiện bất ngờ, rồi đem cách dụng công chưa trọn vẹn ấy truyền dạy cho nhiều người, gây nên rất nhiều tai hại. Bao người thực hành theo chẳng những không lợi ích, mà còn thêm tà kiến nguy hiểm.
Người không có duyên mặc định sẽ đắc đạo, đường tu vất vả gian lao, phải siêng dụng công kỹ lưỡng đầy đủ, chính xác từng chi tiết nhỏ, mới không bị tai hại, bệnh tật. Nhờ vậy về sau dạy người khác chi tiết tỏ tường, chứ không dạy sơ sài, bóng gió xa xôi.
Này đại chúng, Công Đức Lành là yếu tố quan trọng trong việc tu thiền. Dù có nỗ lực hay có phương pháp đúng, nhưng thiếu công đức lành, thiền định vẫn không thể thành tựu. Vì thế hành giả phải luôn vun bồi công đức lành đến vô lượng vô biên.
Thiền định là kết tinh của một đời sống thánh thiện, đức hạnh, vị tha, tử tế, độ lượng, siêng năng, chứ không phải là vô trách nhiệm với chúng sinh. Chính đời sống thánh thiện đó giúp hành giả đạt được kết quả thiền định sâu xa.
Có hai công đức mà hành giả phải vun đắp mãi mãi là: Tôn kính bậc A La Hán Chánh Đẳng Giác, và Độ cho chúng sinh tu hành chứng ngộ.
Muốn tạo công đức từ việc Tôn kính các bậc A La Hán thì phải cung kính, cúng dường, thừa sự, lễ bái, vâng lời. Nhưng hành giả không thể theo lễ bái mãi làm các Ngài mất thời gian. Có thể thờ kính, lễ bái từ xa qua biểu tượng hoặc họa hình của vị A La Hán, vẫn được nhiều công đức.
Này đại chúng, khi tâm trở nên yên tĩnh, hành giả dễ khởi ý nghĩ từ bỏ tất cả, nên trở thành vô trách nhiệm với chúng sinh. Tà kiến này là hệ quả tất yếu phát sinh từ thiền định, mà hành giả cần phải vượt qua. Dù tâm có yên tĩnh, nhưng hạnh nguyện độ sinh không bao giờ chấm dứt, trách nhiệm với chúng sinh không bao giờ vơi cạn.
Chính vì luôn từ bi thương yêu tất cả, mà hành giả luôn cố gắng giúp đỡ hóa độ từng người. Đó cũng là tích lũy công đức cho vô lượng kiếp sau. Thánh quả giải thoát luôn là kết tinh của công đức lành vô lượng, chứ không phải thờ ơ với chúng sinh.
Này đại chúng, khi tâm có tỉnh giác, hành giả nhanh chóng phát hiện vọng tưởng vừa móng khởi, không bị cuốn theo, khiến nó tự biến mất. Thấy cách này hiệu quả, hành giả rời bỏ dưới bụng, chỉ chú ý trên đầu để canh chừng vọng tưởng khởi lên mà BIẾT cho kịp, đâu ngờ đã bỏ gốc theo ngọn, lâu ngày phát sinh nhiều bệnh tật.
Dù xuất hiện trạng thái tỉnh giác khiến hành giả dễ dàng phát hiện vọng tưởng từ sớm, thì vẫn phải giữ tâm phía dưới bụng, vì đó mới là gốc của tâm thức. Hành giả vẫn phải khéo léo giữ hơi thở dính với tâm, để kiểm soát tâm bằng cách kiểm soát hơi thở. Rồi sau đó, dẫu đạt được trạng thái tốt đẹp nào, vẫn phải luôn tự nhắc trạng thái này vẫn còn Vô minh và Tội lỗi.
Này đại chúng, phải có công đức lành rất nhiều, một người mới có thể thường xuyên nhớ mình là Vô Minh Tội Lỗi. Nếu công đức chưa đủ, hành giả sẽ khi nhớ khi quên trong đời sống hằng ngày. Hành giả phải thường lễ kính các bậc A La Hán Chánh Đẳng Giác để xin sám hối các nghiệp bất thiện từ quá khứ, vì chính những nghiệp này khiến hành giả khó thường xuyên nhớ tác ý chính mình chỉ là Vô minh Tội lỗi. Phải đủ quyết tâm để khi tâm đạt được bất cứ trạng thái mầu nhiệm nào cũng phải tự nhắc rằng trạng thái đó vẫn còn Vô minh Tội lỗi. Nhờ vậy mà không bị ý niệm kiêu mạn xuất hiện tàn phá hết công đức.
Khi luôn nhớ mình chỉ là Vô Minh Tội Lỗi, hành giả sẽ cảm nhận rằng suốt đời chỉ mong được nhớ chính mình là Vô minh Tội lỗi, chứ không còn mong chứng ngộ cao siêu.
Cúi lạy Phật từ bi gia hộ cho chúng con mãi mãi khắc ghi lời Kinh Chánh Tinh Tấn nhiệm màu, chân lý cao quý mà Chư Phật Mười Phương Ba Đời đều tuyên thuyết. Cúi lạy Ngài Xá Lợi Phất, bậc Đệ Nhất Trí Tuệ đã từ bi giảng giải nghĩa lý thâm sâu, dẫn dắt chúng con vững bước trên con đường giải thoát. Nguyện tất cả chúng sinh thành tựu ý chí kiên định phi thường, từng bước gây tạo vô lượng công đức, tinh tấn thực hành thiền định đúng phương pháp, mãi theo Phật đến bờ giác vô biên.
<b>Nam Mô Đệ Nhất Trí Tuệ Thống Lĩnh Tăng Đoàn Xá Lợi Phất Tôn Giả
Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. (3 lần) O</b>

<b>PHỤC NGUYỆN</b>
(dành cho bài kinh Chánh Tinh Tấn)
Cúi nguyện mười phương khắp chúng sinh
Ai cũng tinh chuyên hết sức mình
Thiền định đúng theo lời Phật dạy
Để khỏi sai lầm uổng nhất sinh
Như tấm bản đồ đã vẽ ra
Dẫn lối về nơi cõi thái hòa
Nguyện ước cùng nhau chung chí hướng
Vô ngã từ bi đến bao la.
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật. O</b></pre></div>`

            { 
                id: 109, 
                title: "KINH PHẬT NHẬP TỨ THIỀN VÔ NGÃ", 
                type: 'sub',
                content: `<div class="section-block"><h3>KINH PHẬT NHẬP TỨ THIỀN VÔ NGÃ</h3><pre>Nam mô Bổn Sư Thích Ca Mâu Ni Phật.
Kính lễ Đấng Giác Ngộ Vô Thượng,
Bậc Từ Bi soi sáng thế gian.

Ngày xưa, hai đạo sư Alara Kalama và Udduka Ramaputta,
Đều chứng được sức định thâm sâu,
Có thần thông phi thường,
Truyền dạy tận tình cho Sa-môn Gotama.
Sa-môn Gotama với trí tuệ sáng ngời,
Nhanh chóng chứng đạt các mức định cao siêu ấy.
Hai vị đạo sư bấy lâu vẫn mãn nguyện,
Cho rằng đó là cứu cánh giải thoát.

Nhưng Sa-môn Gotama đã nhận ra:
Nơi cảnh định ấy vẫn còn bóng dáng bản ngã.
Người từ biệt đạo sư,
Độc hành đến rừng Uruvela,
Tu khổ hạnh suốt sáu năm trời,
Có năm anh em Kiều Trần Như hộ trì bên cạnh.
Sáu năm khổ hạnh, thân thể hư hao mà mục tiêu vô ngã vẫn không đến.
Người chợt nhớ lại thuở mười hai tuổi,
Khi tâm tự nhiên an trú trong Sơ thiền thanh tịnh.
Người liền cảm nhận rằng:
“Muốn đạt vô ngã,
Không phải rời bỏ bản ngã,
Mà phải ôm lấy nó đến tận cùng”
Thế rồi Sa-môn Gotama thọ thực trở lại,
Hồi phục thân tâm,
Trong khi năm anh em Kiều Trần Như vì hiểu lầm mà rời đi.
Người đến gốc cây Bồ-đề,
Ngồi kiết già, phát nguyện kiên định:
“Dù xương tan thịt nát,
Nếu chưa chứng Vô thượng Chánh giác,
Ta quyết không rời khỏi chỗ này.”

Rồi Người nhập Sơ thiền,
Tâm tự nhiên yên lắng, vọng tưởng tự nhiên không còn,
Không cần dụng công gì nữa,
Chỉ còn giữ nhẹ và kỹ lưỡng hơi thở chậm ít êm,
nơi một điểm sáng tĩnh lặng dưới bụng,

Rồi Người nhập Nhị thiền,
Vào sâu trong bản ngã hơn nữa,
Không hướng ra ngoài để chiêm ngưỡng tịnh cảnh,
Chỉ an nhiên trong chính mình rất nhỏ nhiệm.

Rồi Người nhập Tam thiền,
Tới tận cùng bản ngã,
Chỉ còn cái biết thuần khiết sâu thẳm,
Không chiêm ngưỡng trạng thái kỳ diệu nào khác,
Chỉ bám chặt vào cái biết sâu thẳm lặng lẽ ấy.

Rồi Người nhập Tứ thiền,
Vượt qua bản ngã,
Không còn chấp ngã, không còn vô minh, không còn cái “Ta” nữa.
Bản thể vũ trụ hiện bày,
Từ bi Trí tuệ bao trùm tất cả.

Trong cảnh giới ấy,
Tam Minh hiển hiện, đó là:
Túc Mạng Minh, Thiên Nhãn Minh, Lậu Tận Minh.
Sa-môn Gotama trở thành bậc Giác Ngộ Vô Thượng,
Mở ra con đường giải thoát chưa từng có cho thế gian.
Thật vi diệu thay,
Đức Thế Tôn đã chỉ bày:
“Nhập bốn tầng thiền định,
Là bám chặt bản ngã,
Đi sâu vào bản ngã,
Rồi vượt qua bản ngã,
Mà chứng VÔ NGÃ viên mãn.”

Nguyện cho tất cả chúng sinh,
Hiểu được ý nghĩa thâm sâu này,
Tôn kính con đường này,
Tôn thờ Đấng Giác Ngộ này,
Thực hành đúng lộ trình này,
Và sẽ cùng chứng đạt VÔ NGÃ này.

<b>Nam mô Bổn Sư Thích Ca Mâu Ni Phật (3 lần) O</b></pre></div>`

            { 
                id: 111, 
                title: "BÀI KHẤN CHO ÂM BINH", 
                type: 'sub',
                content: `<div class="section-block">
                <h3>BÀI KHẤN CHO ÂM BINH</h3>
<pre>Con kính lạy mười phương chư Phật
Chư Thánh hiền Bồ Tát từ bi
Chư Thiên Hộ Pháp thần uy
Lai lâm gia hộ độ trì âm binh

Xin dâng chút lòng thành phẩm vật
Âm binh về thọ thực nghe kinh
Nương nhờ thần lực uy linh
Mười phương Tam Bảo chứng minh đàn tràng

Đi theo Phật con đường tươi sáng
Hãy tránh xa thầy bạn gian tà
Từ lâu nuôi dưỡng tâm ma
Để rồi sai khiến làm ra hại ngườí.

Vì muôn kiếp nghìn đời chấp ngã
Với đạo tà lỡ đã tin theo
Chẳng màng Phật Pháp cao siêu 
Về đây phá phách gây nhiều tội khiên

Xin chư Phật Thánh hiền gia hộ 
Cho âm binh tỉnh ngộ hồi tâm 
Thoát ra tà kiến lỗi lầm
Quy y theo Phật khởi tâm tu hành

Xin gia hộ âm binh yêu mến
Từ con người cho đến cỏ cây
Hiểu rằng nhân quả trả vay
Chở che tôn trọng không gây hại người

Âm binh hãy nghe lời Phật dạy 
Biết thương yêu dừng lại sai lầm 
Không làm phiền loạn động tâm 
Kết thêm thù oán gây mầm ghét ganh

Xin tất cả tâm thành theo Phật
Để tinh cầu đầy ắp tình thương 
Xây nền đạo đức hiền lương 
Hướng về giác ngộ phi thường bao la.
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật (3 lần)</b></pre>
                </div>`

            { 
                id: 112, 
                title: "KỆ PHÓNG SINH", 
                type: 'sub',
                content: `<div class="section-block">
                
                <h3>KỆ PHÓNG SINH</h3>
<pre>
<b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật</b>
<b>Nam Mô Đại Từ Di Lặc Tôn Phật</b>
<b>Nam Mô Đại Bi Quán Thế Âm Bồ Tát </b>

Theo từ bi Phật dạy
Vì thương tưởng chúng sinh
Trong tăm tối vô minh
Đọa vào thân cầm thú
 
Nên chúng con công đức
Làm hạnh phóng sinh này
Gỡ thân phận tù đày
Cứu nguy cơ bị giết
 
Cho các loài thú vật
Đang hiện diện nơi đây
Chờ chú nguyện đủ đầy
Rồi thoát thân khổ ách
 
Cúi xin Mười Phương Phật
Chư Bồ Tát Thánh Hiền
Phóng ánh sáng bảo liên
Độ chúng sinh an lạc
 
Chúng sinh quy y Phật
Chờ duyên phúc tái lai
Tỉnh giấc mộng đêm dài
Một lòng theo Phật Pháp
 
Nguyện chúng sinh hiểu rõ
Được lầm lỗi của mình
Nên tinh tấn tu hành
Không đọa thêm lần nữa
 

Nguyện chúng sinh dũng mãnh
Theo Phật đến vô cùng
Vượt khăn khó nghìn trùng
Đạo tâm không thay đổi
 
Nguyện chúng sinh giác ngộ
Giải thoát khỏi luân hồi
Tứ quả thánh lên ngôi
Tâm Từ bi Trí tuệ
 
Phóng sinh này có phúc
Con xin hồi hướng cho
Cha mẹ được ấm no
Ông bà được an lạc
 
Phóng sinh này có phúc
Xin hồi hướng quyến thân
Bệnh tật được tiêu tan
Ách nàn được qua khỏi
 
Phóng sinh này có phúc
Con xin được cúng dường
Chúng sinh khắp mười phương
Đều viên thành Phật Đạo.
<b>Nam mô Bổn sư Thích Ca Mâu Ni Phật (10 lần)</b>
</pre>

            { 
                id: 113, 
                title: "SÁM CẦU SIÊU CHO THÚ BỊ SÁT SINH LẤY THỊT", 
                type: 'sub',
                content: `<div class="section-block">
                <h3>SÁM CẦU SIÊU CHO THÚ BỊ SÁT SINH LẤY THỊT</h3>
<pre><b>Nam Mô Bổn Sư Thích Ca Mâu Ni Phật</b>
<b>Nam Mô Đại Từ Di Lặc Tôn Phật</b>
<b>Nam Mô Đại Bi Quán Thế Âm Bồ Tát</b>
<b>Nam Mô Đại Nguyện Địa Tạng Vương Bồ Tát</b>
<b>Nam Mô Siêu Lạc Độ Bồ Tát</b>
<b>Nam Mô Cai Quản Thế Giới Chư Thiên Bồ Tát</b>

Con cúi lạy mười phương chư Phật
Chư Thánh Hiền lòng rất nhân từ
Khắp trong vũ trụ thái hư
Chúng sinh nỗi khổ nhiều như biển ngàn

Nay chứng kiến thú đang bị giết
Bước đường cùng chẳng biết kêu than
Nhiều con nước mắt rụa ràn
Nỗi đau cắt thịt nát tan cả lòng

Âu cũng chỉ xoay vòng trả nghiệp
Rất nhiều đời nhiều kiếp nợ nhau
Máu xương, nỗi khổ, niềm đau
Đã vay thì phải đối đầu trả thôi

Nhưng ai chẳng bồi hồi thương xót
Khi đứng nhìn cảnh gọt cắt đâm
Cơn đau xé nát thân tâm
Hồn lìa khỏi xác còn ngâm nỗi hờn

Ở cõi chết từng cơn đau đớn
Vẫn dày vò thấu tận u minh
Chết chưa phải hết tội tình
Nỗi đau đày đọa chúng sinh chẳng dừng

Trong đau đớn không ngừng thù hận
Oán thù này vô tận đời sau
Thành niềm độc ác dài lâu
Sau này trở lại cắt đầu lột da

Ôi oan trái bao giờ mới hết
Nếu lòng còn nối kết oán thù
Giết qua giết lại thiên thu
Hành tinh thành chỗ trả thù lẫn nhau

Con lạy Phật nguyện cầu tha thiết
Cho chúng sinh được chết không đau
Để không thù hận với nhau
Để không trở lại tìm nhau trả thù

Cầu ơn Phật cho dù bỏ xác
Chúng sinh về theo các bóng chùa
Sớm hôm nghe tiếng kinh đưa
Nhờ thần lực Phật nghiệp xưa xóa dần

Nhờ Phật lực tinh thần khai mở
Màn vô minh như vỡ tan ra
Hiểu rằng nhân quả sâu xa
Trả vay vay trả thật là công minh

Tuy còn vướng vong linh cầm thú
Nhưng cõi lòng an trú tính người
Một lòng kính Phật đời đời
Trải lòng thương hết muôn nơi mọi loài

Xin nghiệp cũ nguôi ngoai xóa sạch
Để chúng sinh bỏ ách súc sinh
Tiến nhanh trên bước tâm linh
Nương theo Tăng Chúng yên bình tiến tu

Rồi nhìn lại thân như cỏ lá
Thịt xương kia ai đã lấy ăn
Xem như đã có một lần
Tặng người một chút nghĩa ân trong đời

Giờ chỉ có những lời đạo lý
Mà Như Lai đã chỉ dạy ra
Mới là quý giá bao la
Mới là bờ bến hiền hòa thanh cao

Xin pháp giới nơi nào cũng thế
Cầu chúng sinh bảo vệ cho nhau
Thoát ra khỏi những khổ dau
Đưa nhau về đến đạo mầu an vui
<b>Nam Mô Độ Nhất Thiết Thảm Tử Chúng Sinh Đại Từ Đại Bi Đại Nguyện Địa Tạng Vương Bồ Tát (10 lần)</b>
</pre>
                </div>` 
            },
            { 
                id: 114, 
                title: "KHÚC TÁN CA TÔN KÍNH PHẬT (HOMAGE TO BUDDHA)", 
                type: 'sub',
                content: `<div class="section-block">
                <h2>KHÚC TÁN CA TÔN KÍNH PHẬT (HOMAGE TO BUDDHA)</h2>
<pre><b>Lời 1 (VIỆT NAM) – Lời 2 (ENGLISH)</b>
Kính lạy Đấng Vô Thượng
Người là cành hoa sen
Nơi biển đời nhân thế
Người là nguồn thương yêu
Bao dung khắp muôn loài
Là mặt trời ban mai
Đem ánh sáng cho đời
Dựng lại niềm tin sâu
Nơi tăm tối u sầu.

Quỳ lạy bậc Chánh Giác

                type: 'sub',
                content: `<div class="section-block">
                <h2>KINH NHÂN QUẢ (CHANT OF KARMA LAW)</h2>
<pre><b>Lời 1</b>
Buddha always taught the law of karma
Controls our lives, affects our thoughts, creates our fates
Every action will lead to an outcome in the future
No gods will do anything different to karma
If we cause sadness in another’s heart
Another woe will appear in our life
If we make happy in another’s heart 
Another luck will follow on our life 
When we help someone, we will have one more choice for our future
When we hurt other, we just close the gate open to the sun 
Many successes come from modesty and respect
It is a blessing when we have a saint to pay homage to in our life
It is a blessing when we can open our hearts to love all in the world
It is a blessing when we happy for another’s success as our own
It is a blessing when we offer our absolute homage to Lord Buddha
If someone can live for everyone
He will have a great future this life next life and many lives later
Don’t ignore the poor or forget the needy
Try to help them with everything we can
A life is too short for the law of karma to go
We have to be reborn to receive our karma
But when we are reborn in other life 
We will make new karma
And need another life to pay our debt
So the rebirth will be unstoppable
Why do we always make new karma 
Because our mind is dull with greed and anger
If we want to be free from rebirth
Try to get rid of dullness of greed and anger first 
If our heart is full of light of wisdom and virtue
We will not choose to make bad karma
We will choose doing for good karma
It is the basic of sublime way to get out of misery
Try to help the poor, give them food and drink
Try to help the sick, give them medicine and caring
Build the bridges for rivers and repair roads for travelers
Teach unlearned ones knowledge and advise sinner on morals
Give ideal to people, meditation to good people
Meditation is the good path
First it leads to inner repose
Then it opens sagacity and improves our morality
There comes special ability
If we have enough virtue and good karma
Meditation will lead to a high sainthood
Sainthood requires great virtue
Boundless love for all on Earth
Limitless good works in life
And aiming at selflessness
We try our best to meditate
Also improve morality
Perform good karma all the time 
Deeply revere to Buddha Lord
How to meditate precisely
At first we sit motionless
Our whole body’s full of senses
Let it softly keep unstirred
Remind ourselves that our body is short-lived
It is not us so is the mind nothing’s us
Thoughts are not us sentiments not us too
Nothing can be us, nothing can be us ah ah
Then we breath with awareness
Inhale we are aware, exhale we are aware
That feel body can share
Our mind will be peaceful get rid of thoughts
But we must keep knowing the whole body
Keep perceiving body and mind are not us
Even some outcomes of meditation appear 
We should know that the way also is very long ahead 
We should not tell anyone 
We should keep in modesty
Deferential bows to Buddha for days

 Quý Thầy Cô nói:

</pre>
<h2>A. Ý nghĩa của Quy Y Tam Bảo:</h2>
<pre>
<b>Quy Y Tam Bảo là gì ?</b> 
Quy Y Tam Bảo được nói một cách đầy đủ là Quy Y Phật, Quy Y Pháp, Quy Y Tăng.
Quy Y là dịch từ chữ Nam Mô, theo nghĩa của chữ Ấn Độ có nghĩa là đem hết cả cuộc đời mình để đi theo, để tôn thờ. Khi ta Quy Y Phật nghĩa là ta đem hết cuộc đời của mình để đi theo, để tôn thờ Đức Phật. Quy Y Pháp nghĩa là đem hết cuộc đời của mình để đi theo, để tôn thờ Giáo lý của Đức Phật. Quy Y Tăng nghĩa là đem hết cuộc đời của mình để đi theo, để tôn thờ các vị xuất gia tu hành chân chính. Có nghĩa là kể từ lúc Quy Y Tam Bảo rồi chúng ta tôn thờ Đức Phật với trọn lòng tôn kính thiết tha. Chúng ta sẽ sống vì Phật Pháp, vì đạo lý, vì lợi ích chúng sanh, chứ không còn sống như cuộc sống cũ trước đây. Kể từ đây ta là đệ tử của Đức Phật, học theo Chánh Pháp, nương với Chư Tăng. Vì vậy ý nghĩa Quy Y Tam Bảo là rất lớn. 

</pre>
<h2>I. Quy Y Phật là gì?</h2>
<pre>
<b>Phật là ai?</b> Phật là Đấng Giác ngộ hoàn toàn giải thoát luân hồi sanh tử.
Đức Phật trước khi chứng đạo cũng là một người như chúng ta nhưng trong vô lượng kiếp xưa, Ngài đã sống với lòng từ bi thương yêu chúng sanh vô hạn và nỗ lực trong thiền định. Hai yếu tố Thiền định và Từ bi này đã tạo thành công đức tích lũy từ kiếp này sang kiếp khác và đến kiếp cuối cùng Ngài hiện thân ở đất nước Nepal (Ấn Độ) là Thái tử con vua Tịnh Phạn, mẹ là hoàng hậu Mada. Ngài đã từ bỏ mọi sự giàu sang quyền quý để tìm đường tu hành và sau sáu năm khổ hạnh ở rừng già, bốn mươi chín ngày đêm tham thiền nhập định dưới cội Bồ Đề, Ngài đã đạt thành Chánh Quả tối thượng gọi là Phật.
Ở quả vị Phật này Ngài chứng đạt được vô ngã hoàn toàn, đạt được sự giác ngộ giải thoát viên mãn đến tận cùng tuyệt đối và trở thành đồng nhất với vũ trụ Pháp giới. Ngài thương yêu tất cả mọi loài chúng sanh. Ngài thấu rõ bản thể của vũ trụ Pháp giới, từ đó không có chuyện gì mà Phật không biết. Ngài thấu suốt lại vô lượng kiếp của chính mình, thấy rõ đường đi luân hồi Nhân quả của chúng sanh. Ngài vĩnh viễn không còn si mê đọa lạc, biết rõ bản chất của cuộc đời là ràng buộc, khổ đau.
<b>Ngài trở thành vị Phật lịch sử hiện hữu trên cuộc đời này đó là Đức Bổn Sư Thích Ca Mâu Ni Phật</b>. 
Tóm lại, Quy Y Phật được hiểu là Quy Y Đấng Giác Ngộ, một con người đã vượt thoát khỏi luân hồi sinh tử và trở thành vị Thầy của cả Trời Người, với công đức và trí tuệ vượt trội. Tình thương của Đức Phật bao la phủ trùm khắp Pháp giới. Ngài để lại cho chúng sanh một giáo lý vô lượng, một chân lý không gì có thể thay thế được cho thế giới này và Chư Thiên ở các tầng trời. Chúng ta hiểu và tôn thờ Đức Phật Thích Ca Mâu Ni, tin rằng Đức Phật là có thật và đến quỳ dưới chân Ngài. Kể từ nay, chúng ta nguyện đời đời kiếp kiếp đi theo con đường của Đức Phật, cũng là đi theo lý tưởng của sự giác ngộ và giải thoát mà Ngài đã đạt được.
Quy Y Phật rồi chúng ta hiểu được những ý nghĩa:
    <b>Thứ Nhất:</b> Sự tối cao trong vũ trụ này không phải là Thượng đế hay thần linh mà là sự giác ngộ. Cho nên Quy Y Phật là chúng ta tự đặt cho mình một mục tiêu, một lý tưởng tu hành hướng về sự giác ngộ, sự giải thoát.
<b>Thứ hai:</b> Đạo Phật có khác với tôn giáo khác. Ở các tôn giáo khác đấng tối cao là một vị thượng đế, một vị thần linh mà không ai có thể đạt đến địa vị đó, chỉ có vị đó là tối cao duy nhất. 
Còn ở Đạo Phật, đấng tối cao là Đấng Giác Ngộ. Nhưng đấng cao nhất lại không phải là duy nhất. Tất cả chúng sanh nếu biết tu tập, thực hành đúng theo lời Đức Phật dạy thì đều có thể chứng đạt được sự giác ngộ tuyệt đối như Đức Phật. 
Đức Phật không phải là một Thần linh hay Thượng đế có thể ban phước giáng họa cho mọi người để chúng ta chỉ biết thờ lạy và cầu xin. Đối với những người tu theo Đạo Phật, việc cầu xin chỉ là việc rất bé, chúng ta tôn kính Đức Phật nhưng Đức Phật sẽ dạy ta để ngày nào đó ta sẽ được sự chứng ngộ như Ngài, cái tính nhân bản này không có tôn giáo thứ hai nào trên thế giới có được.
<b>Thứ ba:</b> Sau khi Quy Y Phật rồi, chúng ta không còn được Quy Y tà thần, quỷ vật nữa. Điều này có nghĩa là khi nghe về một ngôi đền hoặc miếu thờ nào đó có vị Thần rất linh, có thể phạt người này, thưởng người kia, chúng ta không vì thế mà đến xin làm đệ tử. Một người đệ tử Phật chỉ quỳ xuống và cúi đầu trước Đấng Giác Ngộ, hoặc trước những vị tu hành chân chính đi trên con đường giác ngộ. 
Quý Phật tử lưu ý điều này, chúng ta có thể kính trọng các vị anh hùng, tiền bối có công với đất nước nhưng không tôn thờ họ như một bậc giác ngộ mà ta trọn đời đi theo. 
Ngoài ra, các vị Chư Thiên tử trên các cõi Trời tu theo Phật thì ta phải kính trọng. Đây cũng là điều mà Quý Phật tử phải nhớ trong lễ Quy Y Phật.

</pre>
<h2>II. Quy Y Pháp:</h2>
<pre>
Pháp là lời dạy của Đức Phật để lại trong tam tạng kinh điển, sách sử. Chúng ta tôn thờ Đức Phật rồi thì chúng ta phải tôn thờ, học hỏi những lời dạy của Ngài để lại trong kinh điển như căn bản của Pháp là Tứ Diệu Đế, Bát Chánh Đạo, Mười Hai Nhân Duyên, Luật Nhân Quả, Luân hồi sinh tử… 
Nhờ những lời Phật dạy mà chúng ta có được con đường đi và ánh sáng để bước đi trên cuộc đời của mình ở kiếp này và trong vô lượng kiếp sau. Đây không phải là lần duy nhất chúng ta quỳ trước Phật, mà đã nhiều kiếp trước đó Quý Phật tử đã từng quỳ trước Đức Phật. Trong kiếp này, chúng ta tiếp tục quỳ trước Ngài để tiếp tục tu hành cho đến ngày đạt được công viên, quả mãn. Tuy nhiên, duyên theo Phật là duyên từ nhiều đời, nhiều kiếp và chính nhờ vào giáo pháp của Đức Phật mà chúng ta có một nơi để nương tựa và tiếp tục đi trên con đường của chúng ta trong kiếp này và các kiếp sau mà không lạc lối.
Pháp còn có nghĩa là chân lý, là lẽ phải. Mà chân lý vừa nghiêm khắc vừa vô hạn. Nghiêm khắc có nghĩa là không cho phép chúng ta mắc sai lầm dù nhỏ nhất, giống như một sợi tóc vậy. Tuy nhiên, chân lý lại vừa bao dung, vừa mênh mông, phủ trùm khắp không gian và thời gian. Ví dụ, một số bản kinh Phật có thể không phải là những gì Đức Phật đã nói. Chúng có thể đã được sửa đổi hoặc thêm vào trong suốt mấy ngàn năm qua, vì vậy khi nghe ai nói đây là kinh Phật, chúng ta không mù quáng tin ngay mà phải có sự tỉnh táo để suy xét một cách cẩn trọng. Ngược lại, có những người nói ra những điều không phải của Đạo Phật, nhưng nếu chúng chí lý và xác đáng thì chúng ta vẫn nên quý trọng, đó là tính bao dung của chân lý. Tuy nhiên, tính nghiêm khắc của chân lý lại không cho phép ta nói sai dù chỉ là một lỗi nhỏ như một sợi tóc. Tóm lại, Giáo Pháp là như vậy.
Tuy nhiên ý nghĩa về Pháp rất rộng, như có một lần đi ngang khu rừng, Đức Phật hái một nắm lá, đưa lên hỏi các thánh đệ tử của Ngài: Nắm lá trong tay của Thế Tôn so với lá trong khu rừng là nhiều hay ít?
Các đệ tử của Ngài đáp: Bạch Thế Tôn, nắm lá trong tay của Đức Thế Tôn rất là ít, lá trong rừng rất là nhiều.
Đức Phật nói: Này các Tỳ Kheo! Cũng vậy, những điều mà Ta biết như lá trong rừng, những điều Ta nói như lá trong bàn tay.
Nghĩa là suốt 45 năm, Đức Phật thuyết Pháp rất nhiều, tuy nhiên đó chỉ là một phần rất nhỏ trong số những chân lý trong vũ trụ này. Tuy nhiên, đó là nền tảng, là thềm thang để chúng ta đến với chân lý. Chúng ta dựa trên những căn bản mà Phật đã dạy để phát triển cho phù hợp với thời đại, nhưng nhớ rằng dù có phát triển ra sao thì cũng không thể vượt ra khỏi trí tuệ của Đức Phật.
<b>Khi đã Quy Y Phật rồi chúng ta phải tôn kính lời Phật dạy, tôn thờ lời Phật dạy, nghĩa là siêng năng học hỏi giáo Pháp, và thực hành thiền định. Đó là tinh thần Quy Y Pháp, tôn thờ Pháp.</b>
Sau khi Quy Y Pháp rồi, chúng ta cũng được dặn dò rằng từ đây không Quy Y theo ngoại đạo hay tà giáo. Chúng ta không nên học những kinh sách không chính thống hoặc tin vào người nào đó truyền bá một tôn giáo mà không dựa chắc trên Luật Nhân Quả Nghiệp Báo, không hướng đến mục tiêu Vô Ngã và giải thoát. Nếu gặp phải những điều này, chúng ta cần dứt khoát không tin và không theo.

</pre>
<h2>III. Quy Y Tăng:</h2>
<pre>
Tăng là ngôi báu thứ ba trong Tam Bảo. Đó là những vị Thánh Tăng thực hành rốt ráo triệt để lời Đức Phật dạy và chứng đạt được những Quả Thánh trong Đạo Phật. 
Tăng còn được hiểu là cả Tăng đoàn, trong đó bao gồm những vị xuất gia từ bỏ gia đình, sống không gia đình, xem tất cả chúng sinh là thân quyến. Những người này dành tất cả cuộc đời của mình để học và thực hành lời Phật dạy nên họ có kinh nghiệm. Chúng ta tôn thờ Đức Phật, nhưng Đức Phật đã nhập diệt chỉ để lại sự gia hộ vô hình. Chúng ta tôn thờ lời dạy Đức Phật, nhưng những lời văn cổ mấy nghìn năm không dễ hiểu. Chính nhờ có Chư Tăng, những người đã đem hết cuộc đời để tu học theo Phật như vậy, những người đó mới là những tấm gương mẫu mực đạo đức cho chúng ta nhìn thấy trong cuộc sống, có thể giải thích lời dạy của Phật một cách xác đáng, cụ thể để chúng ta có thể hiểu rõ hơn. Vì vậy, chúng ta phải biết cung kính, vâng lời và học hỏi.
Tuy nhiên chúng ta phải có sự gạn lọc suy xét. Mặc dù chúng ta quý kính Chư Tăng nhưng chúng ta phải biết nhận xét những Chư Tăng nào tu hành chân chính thì mới tôn kính. Vì thời đại này càng lúc càng xa Phật, trong Đạo Phật đã có sự dễ dãi lỏng lẻo, cho nên có những người tuy mang hình tướng xuất gia nhưng sự thật nội tâm và hành động không giống vậy. Do đó ta không dựa vào hình thức để đặt lòng tôn kính mà phải dựa vào đạo hạnh, nghĩa là phải biết rõ, phải nhận thấy đó là những Chư Tăng tu hành chân chính, giới hạnh trang nghiêm thì mình mới nương tựa, mới học hỏi, mới tôn kính.
Khi chúng ta Quy Y Tăng, chúng ta nương tựa với Mười Phương Tăng chứ không riêng vị Thầy Bổn Sư của mình, ở những nơi khác thấy có những vị tu hành chân chính thì ta vẫn phải học hỏi, thừa sự, cúng dường.
Khi đã Quy Y Tăng, chúng ta không được giao lưu gần gũi với thầy tà, bạn ác. Nghĩa là, khi ta gặp người nào họ xưng họ là Thầy, nói có quyền phép, biết coi bói, biết chuyện này chuyện kia nhưng ta thấy người đó không có Đạo hạnh, không hướng tới sự giải thoát thì ta dứt khoát từ chối không bao giờ đi theo. Tương tự, những người bạn nào không có cuộc sống tốt đẹp, đạo đức để ta có thể học hỏi thì cũng không được thân cận. Chỉ khi nào đạo lực của chúng ta rất vững, có khả năng giáo hóa thì lúc đó mới đến với những người xấu để giáo hóa. Còn trong khi ta đang nương tựa học hỏi thì nên tránh những người thầy tà, bạn ác. 
Để tăng cường đoàn kết và hỗ trợ nhau trong việc tu hành, Quý Phật tử nên đăng ký tham gia sinh hoạt tại Đạo Tràng của Chùa Phật Quang. Hiện tại, các Đạo tràng đang có mặt ở khắp nơi trên cả nước. Trước đây, do không có Đạo tràng, nhiều người đã tu hành đơn độc, không được sách tấn, nhắc nhở dẫn đến tình trạng lui sụt. Tuy nhiên, nhờ có sự xuất hiện của Đạo tràng, mọi người có thể tìm được sự nương tựa, hỗ trợ lẫn nhau, cùng đến chùa để tham gia các hoạt động tu học như tụng kinh, ngồi Thiền, đàm đạo và thực hiện các việc Phật sự theo sự hướng dẫn của Thầy Trụ trì và Quý Thầy Cô đến từ Thiền Tôn Phật Quang.
Đó là ý nghĩa Quy Y Tam Bảo (Phật – Pháp – Tăng).


</pre>

<h2>B - NĂM GIỚI CẤM</h2>
<pre>
Khi đã Quy Y trở thành đệ tử Đức Phật thì phải giữ gìn năm Giới cấm, để tăng trưởng nhân cách đạo đức của người Phật tử. Đây cũng là đạo đức để làm tư cách căn bản của con người.

</pre>
<h2>I. Thứ nhất Giới Sát Sanh:</h2>
<pre>
Giới sát sinh nghĩa là ngăn cấm việc giết hại chúng sinh vô tội và không được gây tổn hại các bậc hiền thiện. 
Chúng ta hiểu những chúng sinh vô tội là con người, thú vật lớn, thú vật bé. Người Phật tử dù vì bất cứ lý do gì cũng không được giết người và cũng không được có ý nghĩ muốn hại người hay tự hủy hoại mạng sống của bản thân mình. Ngoài ra, các loài thú vật lớn như trâu, bò, heo, chó… cũng không được giết hại vì chúng có Nhân quả rất gần với loài người, giết nó cũng gần như chúng ta giết nửa mạng người. Còn những thú vật nhỏ như gà, vịt, tôm, cá, ... người Phật tử phải hết sức hạn chế làm hại, dùng làm thức ăn rồi tiến đến không giết hại bất cứ một chúng sinh nào là hoàn hảo. 
Việc cấm giết hại cũng được hiểu rộng ra là không gián tiếp ủng hộ việc giết hại như có tâm vui mừng khi nhìn thấy chúng sinh bị giết, hoặc cố ý để việc giết hại xảy ra để mang lại lợi ích cho bản thân mình.
Ngoài việc không giết hại, chúng ta cũng không được ngược đãi, đánh đập, đày đọa chúng sinh vô tội. Bởi vì cách đối xử này bắt nguồn từ sự ác độc, thiếu lòng từ bi và trong Đạo Phật không chấp nhận. 
Giới sát sinh còn cấm việc không được gây tổn hại đến bậc hiền thiện. 
Bậc hiền thiện là Đức Phật, các bậc Thánh, những vị xuất gia tu hành chân chính, những người có lý tưởng sống vì Đạo Pháp, những người lãnh đạo đất nước, những người chiến sĩ hay những người công an bảo vệ hòa bình, độc lập cho đất nước.
Giới sát sinh cấm việc không gây tổn hại đến bậc hiền thiện thì sẽ không bị mâu thuẫn với hoạt động của các chiến sĩ bảo vệ Tổ quốc, an ninh trật tự xã hội, bảo vệ được quyền sống của mọi người. Các nhà lãnh đạo đất nước cũng yên tâm trừng trị những kẻ muốn phá hoại để đảm bảo đời sống bình yên, no đủ cho nhân dân và sự phát triển của đất nước. Không chỉ vậy, từ thời Đức Phật đến nay, Đạo Phật chưa bao giờ được bình yên, mà luôn phải đối diện với sự tấn công ngấm ngầm hoặc công khai. Do đó, Đạo Phật rất cần những người có tinh thần mạnh mẽ, đứng lên để bảo vệ Phật Pháp, bảo vệ những bậc hiền thiện để chân lý vô giá không bị lụi tắt.
Khi hiểu được điều này thì việc trừng trị kẻ xấu ác làm tổn hại đến Đất Nước, Phật Pháp là công đức lớn, không sợ bị phạm Giới hay mang tội. Mà như vậy thì cũng giúp cho tinh thần Hộ Pháp mạnh mẽ lên không rụt rè do dự nữa.
Người giữ gìn được Giới sát sinh thì nhiều đời được khỏe mạnh, lòng từ bi ngày một lớn dần, ít bệnh hoạn, dung mạo đẹp đẽ, được nhiều người yêu mến, sống trường thọ, ít bị tai nạn, đi vào những nơi nguy hiểm không sợ sệt.
Đó là phước báo của người giữ gìn Giới sát sinh.

</pre>
<h2>II. Thứ hai là Giới trộm cắp:</h2>
<pre>
Giới Trộm Cắp là không được lấy những gì không thuộc của mình, không phải người khác cho mình. Nhặt của rơi phải tìm cách trả lại cho người đánh mất. Nếu không tìm được người đánh mất để trả lại thì đem tất cả số của đó làm việc phước hồi hướng cho người đã đánh mất. Không được sử dụng của rơi cho riêng mình.
Ngay cả công nhân viên chức, không lợi dụng quyền chức, tham nhũng, hối lộ, không tham lam của công mà phải giữ gìn tài sản nhà nước một cách kỹ lưỡng.
Đối với các tài nguyên chung như rừng, chúng ta không được quyền chặt phá. Bởi vì rừng là tài sản chung, là yếu tố quan trọng để bảo vệ môi trường sống của muôn loài.
Cũng như nguồn nước thiên nhiên sử dụng chung cho mọi người mà chúng ta làm ô nhiễm khiến những người ở phía dưới nguồn không dùng được thì cũng phạm vào Giới trộm cắp. 
Theo kinh Phật, kẻ trộm cắp sẽ bị quả báo xấu, nhẹ thì vất vả nghèo hèn, nặng thì phải làm súc sanh để trả nợ, hoặc bị đọa vào địa ngục. Cho nên vì sự công bình, vì lòng từ bi, vì giữ nhân cách, vì tránh quả báo xấu ta tuyệt đối không ăn cắp.
Người giữ Giới không trộm cắp mà lại có lòng thương xót giúp đỡ bố thí thì sẽ được mọi người yêu mến, lòng từ bi và các phẩm lành tăng, tài vật đầy đủ an vui hạnh phúc.
Đó là Giới thứ hai mà người Phật tử phải giữ gìn.

</pre>
<h2>III. Thứ ba là Giới tà dâm:</h2>
<pre>
Người cư sĩ tại gia không được tà dâm ngoại tình. Khi lập gia đình thì phải chung thủy một vợ một chồng để giữ hạnh phúc cho gia đình và sự ổn định của xã hội. Đây là Giới tà dâm – Giới thứ ba từ thời Đức Phật. 
Giới thứ ba này bây giờ được mở rộng thêm. Có nghĩa là người đệ tử Phật ngoài việc không được tà dâm, thì còn không được phản bội Phật Pháp, Tổ Quốc, Thầy Tổ, các mối quan hệ xung quanh như: cha mẹ, vợ chồng, bạn bè,...
Mục đích của Giới này là ngăn cấm sự phản bội giữa con người với con người, giữa con người với những tình cảm thiêng liêng khác. Điều này bắt buộc người Phật tử phải sống sắt son, thủy chung để xây dựng đạo đức chân chính từ thẳm sâu trong tâm hồn, từ đó xây dựng sự đoàn kết, kỷ cương, đáng tin cậy giữa con người với nhau, góp phần tạo nên sức mạnh của Đạo Phật, của quốc gia, dân tộc, gia đình và tình cảm tốt đẹp trong sự tương quan giữa người và người.  

</pre>
<h2>IV. Giới thứ tư là Giới nói dối:</h2>
<pre>
Người đệ tử Phật cố gắng chỉ nói sự thật, và nói những lời chân chính và chỉ nói cho những người đáng nghe, không được nói dối để che dấu tội lỗi, không nói dối để lường gạt người khác. Tuyệt đối Không được nói dối, nhiều khi sự nói dối đó có đem lại lợi ích nhưng cũng phải dè dặt. Vì lời nói dối không có giá trị lâu dài. Người Phật tử phải ráng sống chân chính và nói thật.
Ngoài việc không nói dối, người Phật tử cũng không được nói những điều ác ngữ như sau:
<b> </b><b>Không </b><b>được nói lời ác độc:</b>
Người Phật tử phải giữ gìn đạo đức, không được nói lời ác độc, chửi rủa, nhục mạ người khác quá đáng làm cho người khác bị tổn thương. 
Hoặc hăm đánh hăm giết cho dù không làm cũng là ác ngữ. 
<b>K</b><b>hông được nói lời chia r</b><b>ẽ</b>
 Thế giới này cần phải thương yêu, người ta đau khổ vì người ta phải đối diện với sự thù ghét, đố kỵ. Vì vậy, để cho cuộc sống được yên vui, hạnh phúc thì chúng ta chỉ nên đem lại sự đoàn kết thương yêu với nhau. Không nói những lời làm cho người này ghét người kia, người kia nghĩ xấu người nọ. Chỉ nên nói những lời vui vẻ , hòa ái, đem lại sự thân ái với nhau.
Người Phật tử tuyệt đối tránh nói những điều chia rẽ. Người hay nói lời chia rẽ sẽ bị quả báo cô độc, cô đơn.
 <b>K</b><b>hông nói lời khoe khoang</b>
Người Phật tử lúc nào cũng khiêm cung kín đáo, mình được rất nhiều nhưng vẫn dấu lại nói rất ít. Đó là tư cách khiêm cung kín đáo của người Phật tử. 

Người giữ Giới không nói dối sẽ được phước báo là mọi người yêu mến tin cậy, việc làm thuận lợi, phước lành được tăng trưởng.
Đó là Giới thứ tư mà Phật tử phải giữ gìn.

</pre>
<h2>V. Giới thứ năm là Giới dùng các chất làm say, nghiện:</h2>
<pre>
Là đệ tử Phật chúng ta không được dùng rượu, bia, ma túy, các trò chơi điện tử Game online... 
Vì rượu khi uống vào làm cho đầu óc mình không còn tỉnh táo rồi lại sinh ra nghiện.
 Theo trong kinh, uống rượu gây ra mười hai điều tai hại như sau: Của tiền rơi mất, thân hay đau bệnh, tăng trưởng lòng giết hại, thêm việc sân hận tranh cãi (rượu vào lời ra), trí tuệ lần lần kém, phước đức tiêu mòn, sự nghiệp không thành, tuổi thọ giảm bớt, thân tâm nhiều khổ, khi chết đọa vào địa ngục.
Hoặc ma túy, khi sử dụng ma túy nó làm nghiện rồi quên hết tất cả chỉ biết tới ma túy mà bất chấp tội lỗi. 
Đặc biệt là Game, được WHO tổ chức y tế thế giới liệt kê vào danh sách thuộc loại ma túy tinh thần nguy hại cho con người, gây nên bệnh tâm thần và vô số hệ lụy đau lòng cho người nghiện, gia đình và cộng đồng xung quanh. 
Tác hại của game vô cùng lớn. Ai tiêu tốn thời gian của mình vào thế giới game hư ảo thì người đó đang lãng phí thời gian, tiền bạc, sức khỏe và quan trọng là làm cho đạo đức bị suy đồi. Hơn nữa theo Nhân quả, chính họ sẽ bị quả báo đau khổ về sau là chết sớm và khó đầu thai lại làm người. Vì vậy là người đệ tử Phật phải tránh xa game, giúp đỡ mọi người xung quanh hiểu được tác hại của game để tránh cho người đó gây tổn hại cho bản thân gia đình và nhận quả báo xấu về sau. 
Vì vậy để giữ tư cách của người Phật tử chúng ta không được dùng các chất hoặc các thứ làm say làm nghiện để tránh những quả báo xấu.
Người giữ được Giới này thì thân ít đau bệnh, phẩm cách nâng cao, bảo tồn được hạt giống trí tuệ, ngăn ngừa được tội lỗi… gia đình yên vui. 
Đó là Giới thứ năm mà người Phật tử phải giữ gìn.

(Nói thêm) Giới có nghĩa là không được phép làm những điều sai trái, nhưng Giới còn có một ý nghĩa rất lớn nữa đó là KHÔNG ĐƯỢC LƯỜI BIẾNG TRÁNH NÉ NHỮNG VIỆC THIỆN LÀNH GIÚP NGƯỜI.





</pre>
<h2>THỌ TRÌ NĂM GIỚI CẤM</h2>
<pre>
Sau khi giải thích Năm Giới xong, mời Quý Phật tử quỳ lên để thọ trì năm Giới.
Quý Thầy Cô nói: Quý Phật tử khi nghe Quý Thầy Cô hỏi từng Giới, Giới nào mà Phật tử giữ được thì nói: <b>“Mô Phật con xin giữ được”.</b>
Quý Thầy Cô:
– <b>Thứ nhất Giới sát sinh</b>: <b>Là người đệ tử Phật suốt đời không được giết hại chúng sinh vô tội và không được gây tổn hại các bậc hiền thiện. Đó là Giới của người cư sĩ tại gia. Vậy Quý Phật tử có giữ được không?</b>
Phật tử: “<b>Mô Phật</b><b>,</b><b> con xin giữ được</b>” (l lạy)  O
Quý Thầy Cô:
– <b>Thứ hai Giới trộm cắp</b>: <b>Là người đệ tử Phật suốt đời không được gian tham trộm cắp. Đó là Giới của người cư sĩ tại gia. Vậy Quý Phật tử có giữ được không?</b>
Phật tử: <b>“Mô Phật</b><b>,</b><b> con xin giữ được” </b>(1 lạy)  O
Quý Thầy Cô:
<b>– Thứ ba Giới </b><b>tà dâm</b><b>:</b> <b>Là người đệ tử Phật suốt đời không được </b><b>tà dâm, </b><b>phản bội. Đó là Giới của người cư sĩ tại gia. Vậy Quý Phật tử có giữ được không?</b>
Phật tử: <b>“Mô Phật</b><b>,</b><b> con xin giữ được”</b> (1 lạy)  O
Quý Thầy Cô:
<b>– </b><b>Thứ tư Giới nói </b><b>dối</b>: <b>Là người đệ tử Phật suốt đời không được nói </b><b>dối</b><b>, nói điều sai quấy. Đó là Giới của </b><b>người cư sĩ tại gia. Vậy Quý Phật tử có giữ được không?</b>
Phật tử: “<b>Mô Phật</b><b>,</b><b> con xin giữ được</b>” (1 lạy)  O
Quý Thầy Cô:
– <b>Thứ năm Giới dùng những chất làm say, làm nghiện</b>: <b>Là người đệ tử Phật suốt đời không được dùng các chất làm say, làm nghiện. Đó là Giới của người cư sĩ tại gia. Vậy Quý Phật tử có giữ được không?</b>
Phật tử: <b>“Mô Phật</b><b>,</b><b> con xin giữ được”</b> (1 lạy)  O
Quý Thầy Cô: Đó là năm Giới cấm mà Quý Phật tử đã thọ trì trước Phật thì phải ráng suốt đời còn lại giữ gìn kỹ lưỡng để không bị sai phạm. Và bây giờ phần thọ trì Tam Quy, Ngũ Giới đã xong mời Quý Phật tử ngồi xuống nghe Quý thầy giải thích Bảy Điều Nguyện để thọ trì. Bảy Điều Nguyện này sẽ làm cho Phật Pháp năng động hơn, mạnh mẽ hơn, đem lại lợi ích phước báo vô lượng cho Phật tử.

</pre>
<h2>C – BẢY ĐIỀU NGUYỆN</h2>
<h2>Điều 1: Phật tử phải phát nguyện tập ăn chay dần dần mỗi tháng.</h2>
<pre>
Ngoài việc thọ trì Năm Giới Cấm, Phật tử phải tập ăn chay. Mới ban đầu dùng ít, có thể 1 tháng ăn chay 2 ngày là mùng 1 và 15. Sau đó quen dần tăng lên 4 ngày là 30, mùng 1, 14, 15, tăng dần đến khi có thể ăn cả tuần liên tiếp vẫn cảm thấy nhẹ nhàng bình thường.
 Phật tử phải tập ăn chay để góp phần giảm thiểu nhu cầu dùng thịt cá cho xã hội. Vì chỉ cần một người thêm một miếng thịt thôi, chừng vài ba chục người là đủ giết một con heo. Và cứ nhiều người như vậy thì người ta phải sát sinh quá nhiều. Đó là nguyên nhân làm cho thế giới này chiến tranh không bao giờ chấm dứt. 
Vậy người Phật tử phải cố gắng tập ăn chay mỗi ngày tiến lên dần để giảm bớt sự sát sinh và thế giới sẽ dần dần được hòa bình.
Đó là điều phát nguyện thứ nhất.

</pre>
<h2>Điều 2: Phật tử phải phát nguyện siêng năng học hiểu giáo Pháp để áp dụng tu hành.</h2>
<pre>
Là đệ tử Phật chúng ta phải siêng năng học hỏi giáo Pháp để xây dựng cho mình Chánh Kiến (quan điểm tu hành đúng) từ ban đầu. Vì chỉ khi hiểu đạo lý một cách cặn kẽ, thấu đáo thì chúng ta mới có lập trường kiên định, có con đường rõ ràng, đúng đắn để áp dụng tu cho mình và giải thích, hướng dẫn cho những người chung quanh. 
Việc học Pháp có nghĩa là chúng ta nghe thuyết giảng hoặc đọc sách, hoặc trao đổi với những huynh đệ đồng tu… Dĩ nhiên là ta phải học Pháp một cách tỉnh táo có chọn lọc. Cách thời Phật còn tại thế đã hơn 2500 năm, nhiều đạo lý bị giảng dạy khác đi so với kinh điển gốc. Vì vậy, quý Phật tử nên nghe bài giảng, đọc những cuốn sách (với hơn 2.000 đề tài khác nhau) của Bổn sư mình là Thượng Tọa Thượng Chân Hạ Quang để bám sát được những lời dạy của Đức Phật, để có nền tảng giáo lý vững chắc.
Một đạo lý tốt đẹp mà chỉ được nghe một lần, thì sự tốt đẹp đó không thể thấm sâu vào tâm trí của chúng ta. Vì lẽ đó, chúng ta, người đệ tử Phật phải siêng năng học hỏi giáo Pháp để mình có lập trường kiên định, hiểu sâu áp dụng tu cho mình và làm lợi ích cho những người chung quanh. 
Đó là điều phát nguyện thứ hai.

</pre>
<h2>Điều 3: Phật tử phải phát nguyện công phu tu hành thật sự mỗi ngày.</h2>
<pre>
Mỗi ngày phải Lễ Phật ít nhất một lần (mỗi lần ít nhất là 10 lạy), rồi sau đó Tọa Thiền hay Tụng Kinh do Sư Phụ biên soạn. Một khi đã trở thành đệ tử Phật thì không để một ngày trôi qua mà không có công phu tu tập thực hành theo lời Đức Phật dạy. 
Nếu lâu ngày chúng ta không lễ Phật thì đạo tâm sẽ lui sụt nhanh chóng. Để Đạo Phật thêm sức mạnh thì từng người Phật tử phải siêng năng lễ Phật, niệm Phật, tọa thiền.

</pre>
<h2>Điều 4: Phật tử phải phát nguyện sống vị tha, siêng năng suốt đời làm việc thiện.</h2>
<pre>
Chúng ta đã Quy Y Phật thì từ đây coi cuộc đời này không phải là của mình nữa, nguyện với lòng mình là suốt cuộc đời sống vị tha vì tất cả mọi người, cố gắng tìm cách giúp đỡ những người khốn khổ. Và siêng năng làm việc từ thiện không bao giờ nghỉ ngơi, không bao giờ có chút thối tâm. Nếu phát được những lời nguyện chân thành sâu sắc như vậy thì công đức ở kiếp sau thật là vô lượng, mênh mông không kể hết được. 
Chúng ta không thể suốt đời chỉ đi tìm miếng ăn, cái mặc cho chính mình, vì như vậy thật là một cuộc đời uổng phí. Ý nghĩa tốt đẹp của cuộc sống là chúng ta quên mình để sống cho người khác. Tuy chúng ta còn phải có bổn phận là phải làm ăn kiếm sống, nhưng phải biết sống vì người khác, phải biết làm việc từ thiện. 
Việc làm từ thiện đó có thể là việc rất nhỏ, có thể là việc rất lớn, nhưng theo khả năng của mình, theo nhân duyên của mình, điều gì làm được thì phải ráng mà làm. Một ngày, một tuần, một tháng trôi qua nhìn lại thấy mình chưa từng làm một việc từ thiện gì với ai hết thì phải biết đó là những ngày tháng mình chưa sống đúng với tinh thần của một người đệ tử Phật.

</pre>
<h2>Điều 5: Phật tử phải Phật hóa gia đình mình:</h2>
<pre>
Chúng ta may mắn biết được Phật Pháp thì làm sao cho gia đình mình cùng tin hiểu Phật Pháp và Quy Y Tam Bảo. Không để tình trạng cha, mẹ biết Phật Pháp mà con cái không biết đạo hoặc ngược lại. Nhất là trẻ em còn đang ở tuổi thơ dễ uốn nắn nên tập cho chúng biết đi chùa, lễ Phật, niệm Phật, làm điều thiện, tin Nhân quả thì lớn lên cuộc sống chúng sẽ tốt đẹp. 
Chúng ta báo hiếu cho cha mẹ bằng cách giúp cho cha mẹ biết tu hành, biết Phật Pháp, đó là sự báo hiếu đúng nghĩa nhất. Trách nhiệm gần gũi nhất đối với chúng ta là gia đình mình. Phật Pháp là an vui là hạnh phúc, là chân lý, là ánh sáng thì phải làm sao cho gia đình mình biết Quy Y theo Phật Pháp. 
Do đó người Phật tử phải phát nguyện Phật hóa gia đình, không được chỉ biết tu riêng cho bản thân mình.

</pre>
<h2>Điều 6: Người Phật tử phải phát nguyện đem Phật Pháp đến cho những người chưa biết, để mọi người có được niềm vui, được hạnh phúc trong cuộc sống này.</h2>
<pre>
Tất cả mọi người trong cuộc đời này mà chúng ta có duyên quen biết, đều tìm cách cho người ta biết Phật Pháp. Như đưa một cuốn kinh, băng giảng hoặc sách giáo lý. 
Nhưng đối với người không thích đọc sách hay pháp, chúng ta nên độ họ bằng cách sống tốt, sống cuộc sống mẫu mực, đạo đức, thánh thiện, giữ gìn Giới cấm, làm từ thiện. Nhìn vào hành động tốt đẹp của chúng ta, họ sẽ từ từ bị thuyết phục. Gặp dịp thích hợp, chúng ta nói một câu, hai câu, người ta nghe sẽ thấm. Từ đó chúng ta đưa pháp cho họ nghe, đưa sách cho họ đọc.
Người Phật tử khi đã Quy Y rồi mà không nói chuyện đạo lý với ai, chưa đưa ai về chùa, chưa đưa bài giảng, sách giáo lý cho ai nghe, phải biết là mình chưa làm trọn trách nhiệm của người đệ tử Phật.
Hơn nữa sự lan truyền giáo lý của Đức Phật bị giới hạn nếu chỉ được truyền bá trong các ngôn ngữ không phổ biến. Vì thế người Phật tử phải phát nguyện học rất giỏi ngôn ngữ phổ thông quốc tế tiếng Anh để lan truyền Chánh Pháp đến mọi nơi. Đừng để những lời đạo lý vô giá của Đức Phật bị giới hạn bởi rào cản biên giới, ngôn ngữ. Đó là sự mất mát vô cùng lớn cho nhân loại.
Do đó người Phật tử suốt đời không bao giờ ngừng ước nguyện đem Phật Pháp đến cho những người chưa biết đạo.

</pre>
<h2>Điều 7: Người Phật tử phải phát nguyện dù gặp hoàn cảnh khó khăn, gian khổ vẫn kiên cường bảo vệ đạo.</h2>
<pre>
Cuộc đời không bao giờ suôn sẻ. Có những hoàn cảnh thật vô cùng khó khăn. Hoặc chúng ta bị hoàn cảnh gia đình, xã hội gây khó khăn, hoặc là chịu những cám dỗ nào đó, thì chúng ta nguyện dù bỏ thân mạng mình chứ không bỏ đạo. Vì thân mạng này bỏ đi kiếp sau chúng ta có thân khác tốt đẹp hơn.
 Nếu trong tâm mình có một lần bỏ đạo thì những kiếp sau không gặp lại Phật Pháp nữa, mà không gặp lại Phật Pháp nữa nghĩa là chúng ta đã quay lưng với ánh sáng và đi dần về phía âm u tăm tối. Nên người Phật tử phải có ý nguyện thà chết vẫn phải kiên cường giữ đạo, và bảo vệ đạo.
</pre>
<h2>THỌ TRÌ BẢY ĐIỀU NGUYỆN</h2>
<pre>
Quý Thầy Cô giải thích xong rồi mời Quý Phật tử quỳ lên để thọ trì Bảy Điều Nguyện. Quý Thầy Cô đọc rồi Phật tử đọc theo.
* <b>Điều 1</b>: <b>Chúng con phát nguyện, từng bước dần dần, dùng thức ăn chay, đều đặn mỗi tháng. </b>(1 lạy)  O
* <b>Điều 2:</b> <b>Chúng con phát nguyện, siêng năng học Pháp, cố gắng hiểu sâu, áp dụng tu hành.</b> (1 lạy)  O
* <b>Điều 3</b>: <b>Chúng con phát nguyện, mỗi ngày lễ Phật, niệm Phật, tọa thiền, không cho gián đoạn. </b>(1 lạy)  O
* <b>Điều 4:</b> <b>Chúng con phát nguyện, suốt cuộc đời này, biết sống vị tha, siêng làm việc thiện.</b> (1 lạy)  O
* <b>Điều 5</b>: <b>Chúng con phát nguyện, giúp thân quyến mình, nhất là trẻ em, tin hiểu Phật Pháp.</b> (1 lạy)  O
* <b>Điều 6:</b> <b>Chúng con phát nguyện, giúp cho tất cả, kẻ gần người xa, tin hiểu Phật Pháp.</b> (1 lạy)  O
*<b> Điều 7:</b> <b>Chúng con phát nguyện, dù gặp khó khăn, vẫn quyết một lòng, kiên cường hộ đạo.</b> (1 lạy)  O

Đó là Bảy Điều Nguyện mà Quý Phật tử đã thọ trì trước Phật. Vậy Quý Phật tử cố gắng giữ gìn để đem lại niềm vui cho mọi người và làm cho Phật Pháp được ngày càng hưng thịnh.
Quý Phật tử đã thọ trì Tam Quy Ngũ Giới và Bảy Điều Nguyện xong thì phải cố gắng giữ gìn kỹ lưỡng suốt đời không sai phạm để công đức được thập toàn viên mãn. 
Sau đó Quý Thầy Cô sẽ phát lá phái cho Phật tử. Khi Quy Y Phật tử giống như được sinh ra trong đạo và được Sư Phụ đặt cho một cái tên trong đạo hay còn gọi là Pháp danh. Để khi đến chùa Sư Phụ hay Thầy Cô hỏi thì ta xưng Pháp danh mình ra và Phật tử gọi nhau cũng bằng Pháp danh.
Khi đã Quy Y rồi thì Phật tử ở địa phương nào giới thiệu về Đạo Tràng – Chúng Thanh Niên ở địa phương đó tu tập (kết nối giữa Tổ điều hành Đạo Tràng-Chúng Thanh Niên và Phật tử mới Quy Y). 
Mời Quý Phật tử quỳ lên làm lễ Tam Tự Quy Y.

</pre>

            // Hàm xử lý tìm kiếm
            // Hàm tìm kiếm và hiển thị danh sách kết quả nhanh
            function searchData() {
                const query = document.getElementById('searchInput').value.toLowerCase().trim();
                const resultsContainer = document.getElementById('searchResults');
                
                if (query.length < 2) {
                    resultsContainer.innerHTML = "";
                    resultsContainer.classList.add('hidden');
                    return;
                }

                // Lọc tất cả các kinh khớp với từ khóa
                const matches = fullData.filter(item => item.title.toLowerCase().includes(query));

                if (matches.length > 0) {
                    resultsContainer.classList.remove('hidden');
                    resultsContainer.innerHTML = matches.map(item => `
                        <div onclick="goToItem(${item.id})" class="p-3 hover:bg-indigo-50 border-b border-gray-100 text-sm text-gray-700 cursor-pointer flex justify-between items-center">
                            <span>${item.title}</span>
                            <span class="text-[10px] text-indigo-400 font-bold">${item.type === 'sub' ? 'KINH' : 'NGHI THỨC'}</span>
                        </div>
                    `).join('');
                } else {
                    resultsContainer.innerHTML = "<div class='p-3 text-xs text-gray-400 italic'>Không tìm thấy...</div>";
                    resultsContainer.classList.remove('hidden');
                }
            }

            // CẬP NHẬT LẠI hàm renderChecklists để hỗ trợ lọc (Thay thế hàm cũ của bạn)
            // Hàm render mới: Giữ nguyên các mục đã chọn và hiển thị kết quả tìm kiếm
            function renderChecklists() {
                const mainContainer = document.getElementById('main-checklist');
                const sutraContainer = document.getElementById('sutra-checklist');
                let mainHtml = "";
                let sutraHtml = "";

                fullData.forEach(item => {
                    const orderIndex = selectedOrder.indexOf(item.id);
                    const isChecked = orderIndex !== -1;
                    
                    // Gán ID cho mỗi dòng là item-id (ví dụ: item-1, item-2)
                    const rowHtml = `
                        <div id="item-${item.id}" class="transition-all duration-300">
                            <label class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg cursor-pointer border-b border-gray-50">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" ${isChecked ? 'checked' : ''} 
                                           class="w-5 h-5 rounded text-indigo-600" 
                                           onchange="toggleSection(${item.id})">
                                    <span class="text-sm ${isChecked ? 'text-indigo-800 font-bold' : 'text-gray-600'}">${item.title}</span>
                                </div>
                                ${isChecked ? `<span class="selection-number">${orderIndex + 1}</span>` : ''}
                            </label>
                        </div>`;
                    
                    if (item.type === 'sub') sutraHtml += rowHtml;
                    else mainHtml += rowHtml;
                });

                mainContainer.innerHTML = mainHtml;
                sutraContainer.innerHTML = sutraHtml;
            }
            
            
        // Hàm thực hiện việc cuộn và tạo hiệu ứng nhấp nháy
        function goToItem(id) {
            const targetElement = document.getElementById(`item-${id}`);
            if (targetElement) {
                // 1. Cuộn đến mục đó
                targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

                // 2. Tạo hiệu ứng nhấp nháy
                targetElement.classList.add('blink-target');
                
                // 3. Xóa hiệu ứng sau khi hoàn tất
                setTimeout(() => {
                    targetElement.classList.remove('blink-target');
                }, 2500);

                // 4. (Tùy chọn) Ẩn danh sách kết quả sau khi chọn để dễ nhìn
                document.getElementById('searchResults').classList.add('hidden');
            }
        }   

        function toggleSection(id) {
            const index = selectedOrder.indexOf(id);
            if (index > -1) selectedOrder.splice(index, 1);
            else selectedOrder.push(id);
            renderChecklists();
            updateUI();
        }

        function updateUI() {
    const previewArea = document.getElementById('pdf-content');
    const placeholder = document.getElementById('preview-placeholder');
    const profileContent = document.getElementById('input_profile').value || "................";

    if (selectedOrder.length === 0) {
        previewArea.classList.add('hidden');
        placeholder.classList.remove('hidden');
        return;
    }

    placeholder.classList.add('hidden');
    previewArea.classList.remove('hidden');

    const selectedSubs = fullData.filter(d => d.type === 'sub' && selectedOrder.includes(d.id));
    const subContent = selectedSubs.map(s => s.content).join('');

    let finalHtml = "";
    // Kiểm tra xem người dùng có chọn "NGHI THỨC TỤNG KINH" (loại wrapper) không
    const hasWrapper = selectedOrder.some(id => fullData.find(d => d.id === id).type === 'ritual_wrapper');

    selectedOrder.forEach(id => {
        const item = fullData.find(d => d.id === id);
        
        if (item.type === 'ritual_wrapper') {
            // Nếu chọn "NGHI THỨC TỤNG KINH", nó sẽ tự động chèn các bài Kinh đã chọn vào giữa
            finalHtml += item.content_open + subContent + item.content_close;
        } 
        else if (item.type === 'main') {
            finalHtml += item.content;
        } 
        else if (item.type === 'sub') {
            // QUAN TRỌNG: Chỉ hiển thị Kinh tụng độc lập nếu KHÔNG chọn Nghi thức bao ngoài (wrapper)
            // để tránh việc nội dung bài Kinh bị hiện lặp lại 2 lần.
            if (!hasWrapper) {
                finalHtml += item.content;
            }
        }
        finalHtml += '<div style="page-break-after: always; margin: 10px 0;"></div>';
    });

    previewArea.innerHTML = finalHtml.replace(/{{hoten}}|{{huonglinh}}|{{diachi}}/g, profileContent);
}

                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();

        renderChecklists();
        let currentFontSize = 1.15; // Cỡ chữ mặc định ban đầu (rem)

    function changeFontSize(delta) {
        // Cập nhật giá trị cỡ chữ
        currentFontSize = parseFloat((currentFontSize + delta).toFixed(2));
        
        // Giới hạn không cho chữ quá nhỏ (tối thiểu 0.5rem)
        if (currentFontSize < 0.5) currentFontSize = 0.5;
        
        // Hiển thị con số hiện tại lên màn hình
        document.getElementById('font-size-display').innerText = currentFontSize;

        // Áp dụng cỡ chữ mới cho tất cả thẻ pre bên trong #pdf-content
        const preTags = document.querySelectorAll('#pdf-content pre');
        preTags.forEach(pre => {
            // Sử dụng setProperty để ghi đè thuộc tính !important nếu có trong CSS
            pre.style.setProperty('font-size', currentFontSize + 'rem', 'important');
        });
    }

        // Chỉnh sửa một chút hàm updateUI cũ để khi render lại vẫn giữ cỡ chữ đã chọn
        const originalUpdateUI = updateUI;
        updateUI = function() {
            originalUpdateUI();
            // Sau khi nội dung mới được load, áp dụng ngay cỡ chữ hiện tại
            const preTags = document.querySelectorAll('#pdf-content pre');
            preTags.forEach(pre => {
                pre.style.setProperty('font-size', currentFontSize + 'rem', 'important');
            });
        };

        // Xử lý thu gọn/mở rộng khi click vào h2 hoặc h3
        document.getElementById('pdf-content').addEventListener('click', function(e) {
            const header = e.target.closest('h2, h3');
            if (!header) return;

            // Toggle class để xoay mũi tên
            header.classList.toggle('is-collapsed');

            // Tìm và ẩn/hiện tất cả các phần tử anh em cho đến khi gặp tiêu đề tiếp theo
            let next = header.nextElementSibling;
            while (next && !['H1', 'H2', 'H3'].includes(next.tagName)) {
                next.classList.toggle('section-hidden');
                next = next.nextElementSibling;
            }
        });

    // Hàm bật/tắt Modal
function toggleModal(id) {
    const modal = document.getElementById(id);
    modal.classList.toggle('hidden');
    
    // Nếu mở modal INFO thì cập nhật dữ liệu mới nhất
    if(id === 'modal-info' && !modal.classList.contains('hidden')) {
        updateInfoModal();
    }
}

    const container = document.getElementById('info-display-content');

    `;
}

            function copyToClipboard() {
                const linkToCopy = "https://gptlohoi-del.github.io/tungkinh/";
                
                navigator.clipboard.writeText(linkToCopy).then(() => {
                    // Có thể thay alert bằng một thông báo toast đẹp hơn nếu muốn
                    alert("Đã copy đường dẫn: " + linkToCopy);

        // Đóng modal khi click vào vùng bên ngoài (vùng nền mờ)
        window.onclick = function(event) {
            const modalList = document.getElementById('modal-list');
            const modalInfo = document.getElementById('modal-info');

            // Nếu người dùng click trúng vào vùng nền của modal LIST
            if (event.target == modalList) {
                modalList.classList.add('hidden');

            // Nếu người dùng click trúng vào vùng nền của modal INFO
            if (event.target == modalInfo) {
                modalInfo.classList.add('hidden');
            }
        }

        window.addEventListener('beforeunload', function (e) {

            // Kiểm tra:

            // 3. VÀ vị trí nhấp chuột KHÔNG phải là nút kính lúp (để tránh xung đột với hàm toggleSearch)
            if (!wrapper.classList.contains('hidden')) {
                if (!wrapper.contains(event.target) && !btn.contains(event.target)) {
                    toggleSearch(); // Gọi hàm để đóng khung tìm kiếm và xóa dữ liệu cũ
                }
            }
        });
