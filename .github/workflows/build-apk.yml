name: Tạo APK KINH TỤNG (không Release Key)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write # Tạo/cập nhật bản APK ở GitHub Releases.

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Tạo APK debug đã ký tự động
        env:
          OVERRIDE_PAGES_URL: ${{ vars.PAGES_URL }}
        shell: bash
        run: |
          if [[ -n "$OVERRIDE_PAGES_URL" ]]; then
            SITE_URL="$OVERRIDE_PAGES_URL"
          else
            OWNER="${GITHUB_REPOSITORY%%/*}"
            REPO="${GITHUB_REPOSITORY#*/}"
            OWNER="${OWNER,,}"
            REPO="${REPO,,}"
            if [[ "$REPO" == "$OWNER.github.io" ]]; then
              SITE_URL="https://$OWNER.github.io/"
            else
              SITE_URL="https://$OWNER.github.io/$REPO/"
            fi
          fi
          echo "Địa chỉ nội dung OTA: $SITE_URL"
          gradle -p android --no-daemon :app:assembleDebug "-PsiteUrl=$SITE_URL"
          cp android/app/build/outputs/apk/debug/app-debug.apk KINH-TUNG.apk
      - name: Lưu APK trong GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: KINH-TUNG-APK-debug
          path: KINH-TUNG.apk
          retention-days: 30
          if-no-files-found: error
      - name: Đăng APK vào GitHub Releases để tải trực tiếp
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="kinh-tung-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" KINH-TUNG.apk --clobber
          else
            gh release create "$TAG" KINH-TUNG.apk \
              --title "KINH TỤNG — APK (bản debug)" \
              --notes "APK tự động ký DEBUG, không cần Release Key. Nội dung cập nhật OTA từ GitHub Pages. Dùng thử/cài cá nhân, không phải bản phát hành bảo mật cho Play Store." \
              --prerelease --target "$GITHUB_SHA"
          fi
